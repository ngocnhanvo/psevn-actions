name: PSE Chi bo source-verified WordPress category repair (NO ASTRO BUILD)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/pse-chi-bo-source-category-repair.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pse-chi-bo-source-category-repair
  cancel-in-progress: false
jobs:
  chi-bo-repair:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify and repair existing WordPress categories
        run: |
          node --check scripts/pse-chi-bo-source-category-repair.mjs
          node scripts/pse-chi-bo-source-category-repair.mjs
      - name: Save per-post taxonomy rollback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pse-chi-bo-category-repair-rollback
          path: docs/reports/pse-chi-bo-category-rollback.json
          if-no-files-found: ignore
          retention-days: 7
