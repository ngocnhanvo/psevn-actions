name: PSE historical Phu My Garden eight variant product parity (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-phu-my-garden-source-product-parity.mjs
      - .github/workflows/pse-phu-my-garden-source-product-parity.yml
permissions:
  contents: read
jobs:
  garden:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install pinned Playwright wrapper using container Chromium
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify original 8 Garden variants against native Product and Category, GET only
        run: node --check scripts/pse-phu-my-garden-source-product-parity.mjs && node scripts/pse-phu-my-garden-source-product-parity.mjs
      - name: Preserve source and WordPress identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pse-garden-source-8-variant-parity
          path: artifacts/pse-phu-my-garden-parity/report.json
          retention-days: 30
          if-no-files-found: warn
