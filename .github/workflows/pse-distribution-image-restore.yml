name: PSE original distribution JPEG to native WordPress Media (NO BUILD)
on:
  push:
    branches: [main]
    paths: [.pse-distribution-image-restore-trigger]
permissions:
  contents: read
concurrency:
  group: pse-distribution-original-image
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-distribution-image-restore.mjs && node scripts/pse-distribution-image-restore.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-verified-distribution-image-restore
          path: artifacts/pse-distribution-image/manifest.json
          retention-days: 14
          if-no-files-found: warn
