name: PSE Thong tin thi truong Joomla WordPress category parity (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/pse-market-category-parity.mjs'
      - '.github/workflows/pse-market-category-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-parity:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-market-category-parity.mjs && node scripts/pse-market-category-parity.mjs