name: PSE Joomla 382 three original FTP image bytes (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-original-ftp-382-media-readonly.py
      - scripts/test-pse-original-ftp-382-media-readonly.py
      - .github/workflows/pse-original-ftp-382-media-readonly.yml
      - .pse-original-ftp-382-media-request
permissions:
  contents: read
jobs:
  test:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m py_compile scripts/pse-original-ftp-382-media-readonly.py scripts/test-pse-original-ftp-382-media-readonly.py
      - run: python3 scripts/test-pse-original-ftp-382-media-readonly.py
  inspect:
    needs: test
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'audit(pse): verify Joomla 382 original image bytes'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      group: pse-original-joomla-source-readonly
      cancel-in-progress: false
    env:
      PSE_SOURCE_FTP_HOST: ${{ secrets.PSE_SOURCE_FTP_HOST }}
      PSE_SOURCE_FTP_USERNAME: ${{ secrets.PSE_SOURCE_FTP_USERNAME }}
      PSE_SOURCE_FTP_PASSWORD: ${{ secrets.PSE_SOURCE_FTP_PASSWORD }}
      PSE_SOURCE_FTP_CA_PEM: ${{ secrets.PSE_SOURCE_FTP_CA_PEM }}
      PSE_SOURCE_FTP_PROTOCOL: ftps
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read 3 exact source images, emit SHA256/dim-safe metadata only
        run: python3 scripts/pse-original-ftp-382-media-readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-382-original-source-media-hashes
          path: artifacts/pse-original-ftp-382-media-readonly/summary.json
          retention-days: 14
          if-no-files-found: warn
