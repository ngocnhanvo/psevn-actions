name: PSE 1090 source captions and relocated image context (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-1090-original-caption-context.py
      - .github/workflows/pse-1090-original-caption-context.yml
permissions:
  contents: read
  actions: read
jobs:
  caption-context:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: pse-1090-relocated-proof
          path: inputs/pse1090
          run-id: 44986757822
          github-token: ${{ github.token }}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - run: python -m py_compile scripts/pse-1090-original-caption-context.py
      - run: python scripts/pse-1090-original-caption-context.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-1090-caption-context
          path: artifacts/pse-1090-caption-context/
          retention-days: 30
          if-no-files-found: warn
