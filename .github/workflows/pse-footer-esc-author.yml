name: PSE shared footer ESC Table author (NO ASTRO BUILD)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-footer-esc-author.yml
      - .pse-footer-esc-author-trigger
permissions:
  contents: read
concurrency:
  group: pse-shared-footer-author
  cancel-in-progress: false
jobs:
  author:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-footer-esc-author.mjs && node scripts/pse-footer-esc-author.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-footer-esc-prewrite-snapshot
          path: artifacts/pse-footer/esc-before.json
          retention-days: 14
          if-no-files-found: ignore
