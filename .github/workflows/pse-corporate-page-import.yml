name: PSE corporate Pages Joomla import (DRAFTS ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-corporate-page-import.mjs
      - .github/workflows/pse-corporate-page-import.yml
permissions:
  contents: read
concurrency:
  group: pse-corporate-page-import
  cancel-in-progress: false
jobs:
  wordpress-corporate:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      PSE_CORPORATE_DRY_RUN: ${{ github.event.head_commit.message == 'cms(pse): import validated corporate Pages as private drafts' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify and author source-backed PSE corporate WP drafts
        run: node scripts/pse-corporate-page-import.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-corporate-page-manifest
          path: artifacts/pse-corporate-page-manifest.json
          if-no-files-found: warn
          retention-days: 7
