name: PSE three original Joomla short investor/market articles source evidence (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-three-short-original-source-preflight.mjs
      - .github/workflows/pse-three-short-original-source-preflight.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-three-short-original-source-preflight.mjs && node scripts/pse-three-short-original-source-preflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-three-original-short-source-evidence
          path: artifacts/pse-three-short-source/report.json
          retention-days: 30
          if-no-files-found: warn
