name: PSE retry seven original photo album galleries (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-gallery-timeout-retry.mjs
      - .github/workflows/pse-gallery-timeout-retry.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-gallery-timeout-retry.mjs && node scripts/pse-gallery-timeout-retry.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-legacy-gallery-seven-retry
          path: artifacts/pse-gallery-retry/verified.json
          if-no-files-found: warn
          retention-days: 14
