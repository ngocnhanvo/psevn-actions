name: PSE synchronize ESC Header menu fields to verified WordPress URLs (NO BUILD)
on:
  push:
    branches: [main]
    paths: [.pse-esc-header-sync-trigger]
permissions:
  contents: read
concurrency:
  group: pse-header-menu-editor-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-esc-header-sync.mjs && node scripts/pse-esc-header-sync.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: pse-header-menu-source-sync-manifest, path: artifacts/pse-header-sync/manifest.json, retention-days: 14, if-no-files-found: warn}
