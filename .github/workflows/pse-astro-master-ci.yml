name: PSE Astro master isolation verification (NO BUILD)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-astro-master-ci.yml
      - .pse-lighthouse-master-ci-trigger

permissions:
  contents: read

jobs:
  production-source-tests:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout only Astro PRODUCTION source for offline tests
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - name: Confirm checked out source is PSE master
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "master"
          echo "PSE_MASTER_SOURCE_COMMIT=$(git rev-parse HEAD)"
          test ! -e src/lib/nckh
          test ! -e src/pages/api/nckh
          test ! -e src/pages/api/auth
          test ! -e src/pages/so-tay
          test -f src/pages/api/user/info.ts
          test -f 'src/pages/ssr/posts/[slug]/detail.astro'
          test -f 'src/pages/ssr/products/[slug]/detail.astro'
          ! grep -Eqi 'nghiencuukhoahoc|xuongmunonbaohiem' \
              src/pages/api/user/info.ts \
              'src/pages/ssr/posts/[slug]/detail.astro' \
              'src/pages/ssr/products/[slug]/detail.astro'
          echo "PSE_MASTER_RUNTIME_ORIGIN_BOUNDARY=PASS"
      - name: Install pnpm wrapper
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node 24 and pnpm download cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Syntax-check WordPress-origin-aware SSR injection
        working-directory: source
        run: |
          node --check scripts/patch-entry.mjs
          node --check scripts/inject-handler.js
          node --check scripts/generate-sitemap-robots.mjs
          echo 'PSE_MASTER_BUILDER_CSP_SYNTAX=PASS'
      - name: Test complete PSE template SSR, WordPress, SEO and frontend contracts
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline
          pnpm exec vitest run
          echo "PSE_MASTER_TESTS=PASS"
      - name: Assert no fixed tenant domains in active SSR entry or WordPress user API
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'pse[.]webnvn[.]com|nghiencuukhoahoc[.]webnvn[.]com|allowedStagingOrigin|runtimeDomain[(]' \
            scripts/inject-handler.js scripts/patch-entry.mjs src/pages/api/user/info.ts
          echo "PSE_RUNTIME_DOMAIN_PORTABILITY=PASS"
      - name: Explicitly confirm no Astro build or live deploy
        run: |
          echo "NO_ASTRO_BUILD=PASS"
          echo "NO_FTP_UPLOAD=PASS"
          echo "NO_GITHUB_DISPATCH=PASS"
