name: PSE fifteen historical missing original Joomla company Posts and 93 JPEG GUARDED
on:
  push:
    branches: [main]
    paths: [.pse-company-historical-restore-request]
permissions:
  contents: read
concurrency:
  group: pse-joomla-original-cms-write
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Read original 15 articles; check native WP ownership; verify or import original JPGs; publish verified Posts
        run: node --check scripts/pse-company-historical-restore.mjs && node scripts/pse-company-historical-restore.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-company-historical-restore
          path: artifacts/pse-company-news/historical-restore.json
          retention-days: 7
          if-no-files-found: warn
