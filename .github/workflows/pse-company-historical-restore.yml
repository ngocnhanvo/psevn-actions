name: PSE fifteen historical missing original Joomla company Posts and 93 JPEG GUARDED
on:
  push:
    branches: [main]
    paths: [.pse-company-historical-restore-request]
permissions:
  contents: read
concurrency:
  group: pse-joomla-original-cms-write
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Validate exact-second source manifest and import script
        run: |
          node --check scripts/pse-company-historical-restore.mjs
          node --check scripts/pse-company-historical-live-qa.mjs
          node --check scripts/pse-template-updraft-backup.mjs
      - name: Fresh native WordPress DB-only rollback backup before import
        if: >-
          github.event.head_commit.message == 'cms(pse): restore fifteen missing original company articles and images'
        run: node scripts/pse-template-updraft-backup.mjs
      - name: Read 15 original articles; import 93 JPGs; publish Posts with Joomla timestamps to second
        env:
          PSE_COMPANY_FRESH_DB_BACKUP: "${{ github.event.head_commit.message == 'cms(pse): restore fifteen missing original company articles and images' && 'yes' || 'no' }}"
        run: node scripts/pse-company-historical-restore.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-company-historical-restore
          path: artifacts/pse-company-news/historical-restore.json
          retention-days: 7
          if-no-files-found: warn
