name: PSE PDF icon article layout audit (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-pdf-icon-layout-audit.mjs
      - .github/workflows/pse-pdf-icon-layout-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Diagnose CMS body images on desktop
        run: node --check scripts/pse-pdf-icon-layout-audit.mjs && node scripts/pse-pdf-icon-layout-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-pdf-icon-layout-audit
          path: artifacts/pse-pdf-icon-layout/report.json
          retention-days: 14
          if-no-files-found: warn
