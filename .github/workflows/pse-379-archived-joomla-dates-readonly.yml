name: PSE original Joomla 379 historical source published date (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-379-archived-joomla-dates-readonly.mjs
      - .github/workflows/pse-379-archived-joomla-dates-readonly.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-379-archived-joomla-dates-readonly.mjs && node scripts/pse-379-archived-joomla-dates-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-original-379-archive-day-evidence
          path: artifacts/pse-379-archive-dates/report.json
          retention-days: 30
          if-no-files-found: warn
