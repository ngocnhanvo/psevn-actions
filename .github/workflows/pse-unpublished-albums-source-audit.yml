name: PSE four remaining historical photo albums source proof (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-unpublished-albums-source-audit.mjs
      - .github/workflows/pse-unpublished-albums-source-audit.yml
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-unpublished-albums-source-audit.mjs && node scripts/pse-unpublished-albums-source-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-unpublished-four-source-albums
          path: artifacts/pse-unpublished-four-albums/report.json
          retention-days: 14
          if-no-files-found: ignore
