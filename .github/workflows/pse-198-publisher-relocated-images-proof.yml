name: PSE 198 relocated official publisher image proof (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-198-publisher-relocated-images-proof.mjs
      - .github/workflows/pse-198-publisher-relocated-images-proof.yml
permissions:
  contents: read
jobs:
  publisher-proof:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify relocated publisher image candidates
        run: |
          node --check scripts/pse-198-publisher-relocated-images-proof.mjs
          node scripts/pse-198-publisher-relocated-images-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-198-publisher-relocation-proof
          path: artifacts/pse-198-publisher-relocation/
          retention-days: 30
          if-no-files-found: warn
