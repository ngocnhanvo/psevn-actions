name: PSE news taxonomy WordPress hierarchy (NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-news-taxonomy-categories.mjs
      - .github/workflows/pse-news-taxonomy-categories.yml
permissions:
  contents: read
concurrency:
  group: pse-news-taxonomy-categories
  cancel-in-progress: false
jobs:
  cms-taxonomy:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Audit or apply seven source-backed WordPress categories
        run: node scripts/pse-news-taxonomy-categories.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-news-taxonomy-state
          path: artifacts/pse-news-taxonomy.json
          retention-days: 7
          if-no-files-found: warn
