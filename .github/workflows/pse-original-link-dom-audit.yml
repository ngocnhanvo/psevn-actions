name: PSE original Joomla external links DOM audit (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-original-link-dom-audit.mjs
      - .github/workflows/pse-original-link-dom-audit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pse-original-link-dom-audit
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Read only source Joomla external link selectors
        run: node --check scripts/pse-original-link-dom-audit.mjs && node scripts/pse-original-link-dom-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-original-joomla-link-dom
          path: artifacts/pse-original-link-dom/report.json
          retention-days: 14
          if-no-files-found: warn
