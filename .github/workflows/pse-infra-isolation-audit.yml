name: PSE infrastructure isolation audit (READ ONLY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .pse-infra-audit-trigger
permissions:
  contents: read
concurrency:
  group: pse-infra-isolation-audit
  cancel-in-progress: false
jobs:
  read-only-audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check presence of configuration secrets without revealing values
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          {
            echo "## PSE Actions secret presence (names only)"
            echo "| Secret | Present |"
            echo "|---|---|"
            for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD WP_ADMIN_USERNAME WP_ADMIN_PASSWORD SOURCE_REPO_PAT; do
              if [ -n "${!name}" ]; then
                echo "| $name | yes |"
                echo "SECRET_STATUS $name=present" >&2
              else
                echo "| $name | no |"
                echo "SECRET_STATUS $name=absent" >&2
              fi
            done
            echo ""
            echo "Secret presence does not establish database/FTP isolation. No credential value was printed or used to log in."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Probe public WordPress endpoint availability (anonymous GET only)
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Public endpoint probes"
            echo "| Endpoint | HTTP status |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for url in 'https://admin-pse.webnvn.com/wp-json/' 'https://api-nghiencuukhoahoc.webnvn.com/wp-json/' 'https://pse.webnvn.com/' 'https://nghiencuukhoahoc.webnvn.com/'; do
            status="$(curl --silent --location --output /dev/null --write-out '%{http_code}' --max-time 12 --connect-timeout 6 --max-redirs 3 "$url" || true)"
            echo "| $url | ${status:-failed} |" >> "$GITHUB_STEP_SUMMARY"
            echo "PUBLIC_HTTP_STATUS $url=${status:-failed}"
          done
          echo "Anonymous endpoint checks cannot reveal database names or FTP account roots." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify FTPS TLS, authentication and configured site roots (READ ONLY)
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib, os, socket, ssl, sys
          from urllib.parse import urlsplit

          def status(key, value):
              print('FTPS_DIAG '+key+'='+value, flush=True)

          raw=os.environ.get('FTP_SERVER','').strip()
          if '://' not in raw:
              raw='ftp://'+raw
          try:
              addr=urlsplit(raw)
              if not (addr.scheme in ('ftp','ftps') and addr.hostname
                      and addr.port in (None,21) and not addr.username and not addr.password
                      and addr.path in ('','/') and not addr.query and not addr.fragment):
                  raise ValueError('Invalid endpoint')
          except (ValueError, TypeError):
              status('CONFIG','INVALID_FTP_SERVER')
              sys.exit(2)

          user=os.environ.get('FTP_USERNAME','')
          password=os.environ.get('FTP_PASSWORD','')
          if not user or not password:
              status('CONFIG','MISSING_CREDENTIALS')
              sys.exit(2)

          origins={}
          for line in os.environ.get('ENV_FILE','').splitlines():
              line=line.strip().removeprefix('export ').strip()
              for k,label in (('WC_URL=','WORDPRESS'),('WC_URL_CLIENT=','ASTRO')):
                  if line.startswith(k):
                      value=line[len(k):].strip().strip('"').strip("'")
                      origin=urlsplit(value)
                      if origin.scheme!='https' or not origin.hostname or origin.path not in ('','/'):
                          status('CONFIG','INVALID_'+label+'_ORIGIN')
                          sys.exit(2)
                      origins[label]=origin.hostname
          if len(origins)!=2:
              status('CONFIG','MISSING_WORDPRESS_OR_ASTRO_ORIGIN')
              sys.exit(2)

          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=12)
          phase='TCP_CONNECT'
          try:
              ftp.connect(addr.hostname,addr.port or 21)
              status('TCP','PASS')
              phase='TLS_HANDSHAKE'
              ftp.auth()
              status('TLS','PASS')
              phase='AUTH'
              ftp.login(user,password)
              status('AUTH','PASS')
              phase='PROTECTED_DATA'
              ftp.prot_p()
              status('PROT_P','PASS')
              phase='ROOT_PWD'
              initial=ftp.pwd()
              status('PWD','PASS')
              reachable={}
              for label,hostname in origins.items():
                  candidates=[
                      '/domains/'+hostname+'/public_html',
                      'domains/'+hostname+'/public_html',
                      '../domains/'+hostname+'/public_html',
                      '/public_html',
                      'public_html',
                  ]
                  reachable[label]=False
                  for index,directory in enumerate(candidates,1):
                      try:
                          ftp.cwd(initial)
                          ftp.cwd(directory)
                          status(label+'_CWD','PASS_CANDIDATE_'+str(index))
                          reachable[label]=True
                          break
                      except ftplib.all_errors as exc:
                          if isinstance(exc, (TimeoutError, socket.timeout)):
                              status(label+'_CWD','CONTROL_CHANNEL_TIMEOUT')
                              break
                          if isinstance(exc, ftplib.error_perm):
                              code=str(exc)[:3]
                              status(label+'_CWD_ATTEMPT_'+str(index),'FTP_'+code if code.isdigit() else 'FTP_REJECTED')
                          else:
                              status(label+'_CWD_ATTEMPT_'+str(index),'UNAVAILABLE_'+type(exc).__name__)
                  if not reachable[label]:
                      status(label+'_CWD','FAIL')
              if not all(reachable.values()):
                  status('DEPLOY_READINESS','FAIL_SITE_ROOT_ACCESS')
                  sys.exit(2)
              status('DEPLOY_READINESS','PASS_READ_ONLY')
          except ssl.SSLCertVerificationError:
              status(phase,'TLS_CERTIFICATE_VERIFICATION_FAILED')
              sys.exit(2)
          except (TimeoutError,socket.timeout):
              status(phase,'TIMEOUT')
              sys.exit(2)
          except ftplib.error_perm as exc:
              code=str(exc)[:3]
              status(phase,'FTP_'+code if code.isdigit() else 'FTP_REJECTED')
              sys.exit(2)
          except ftplib.all_errors as exc:
              status(phase,'FAILED_'+type(exc).__name__)
              sys.exit(2)
          finally:
              try:ftp.quit()
              except Exception:ftp.close()
          PY
