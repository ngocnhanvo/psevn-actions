name: PSE original Joomla large ZIP TOC secure read-only probe
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-original-ftp-zip-toc-readonly.py
      - scripts/test-pse-original-ftp-zip-toc-readonly.py
      - .github/workflows/pse-original-ftp-zip-toc-readonly.yml
      - .pse-original-ftp-zip-toc-readonly-request
permissions:
  contents: read
jobs:
  syntax:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m py_compile scripts/pse-original-ftp-zip-toc-readonly.py
      - run: python3 scripts/test-pse-original-ftp-zip-toc-readonly.py
  inspect:
    needs: syntax
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'audit(pse): inspect verified original Joomla ZIP contents metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: pse-original-joomla-source-readonly
      cancel-in-progress: false
    env:
      PSE_SOURCE_FTP_HOST: ${{ secrets.PSE_SOURCE_FTP_HOST }}
      PSE_SOURCE_FTP_USERNAME: ${{ secrets.PSE_SOURCE_FTP_USERNAME }}
      PSE_SOURCE_FTP_PASSWORD: ${{ secrets.PSE_SOURCE_FTP_PASSWORD }}
      PSE_SOURCE_FTP_CA_PEM: ${{ secrets.PSE_SOURCE_FTP_CA_PEM }}
      PSE_SOURCE_FTP_PROTOCOL: ftps
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Inspect ZIP tail and central directory only (maximum bounded bytes)
        run: python3 scripts/pse-original-ftp-zip-toc-readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-original-joomla-large-zip-toc-metadata
          path: artifacts/pse-original-ftp-zip-toc-readonly/summary.json
          retention-days: 14
          if-no-files-found: warn
