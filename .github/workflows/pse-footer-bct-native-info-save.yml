name: PSE native WordPress Info save for BCT build queue (NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-footer-bct-native-info-save.yml
permissions:
  contents: read
concurrency:
  group: pse-shared-footer-author
  cancel-in-progress: false
jobs:
  save:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-footer-bct-native-info-save.mjs && node scripts/pse-footer-bct-native-info-save.mjs
