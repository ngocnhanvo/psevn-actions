name: PSE restore original 2008 and 2010 annual booklets (NO ASTRO BUILD)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-annual-early-booklet-import.yml
      - .pse-annual-early-import-retry
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: pse-legacy-article-migration-single-writer
  cancel-in-progress: false
jobs:
  import-original-booklets:
    if: github.repository == 'ngocnhanvo/psevn-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: pse-annual-early-source-images
          run-id: 44731405301
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/pse-annual-media-proof
      - uses: actions/download-artifact@v4
        with:
          name: pse-annual-missing-date-evidence
          run-id: 44731533087
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/pse-annual-dates-proof
      - uses: actions/download-artifact@v4
        with:
          name: pse-annual-18-parity
          run-id: 44729950280
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/pse-annual-parity-proof
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Fresh DB-only UpdraftPlus rollback snapshot before creating Media
        run: node scripts/pse-template-updraft-backup.mjs
      - name: Safely transfer, verify and publish only complete source booklets
        run: node --check scripts/pse-annual-early-booklet-import.mjs && node scripts/pse-annual-early-booklet-import.mjs
      - name: Persist source media mappings and exact WordPress post IDs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pse-legacy-migration-save.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-annual-early-booklets-import
          path: artifacts/pse-annual-media-import/report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Require both original full-booklet reports to be published
        run: |
          node -e "const r=require('./artifacts/pse-annual-media-import/report.json'); if(r.status!=='PASS') throw Error('Annual original-booklet import PARTIAL; resume safely using verified Media checkpoint');"
