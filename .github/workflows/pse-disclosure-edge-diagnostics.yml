name: PSE disclosure edge diagnostics (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pse-disclosure-edge-diagnostics.yml"
      - "scripts/pse-disclosure-edge-diagnostics.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-disclosure-edge-diagnostics.mjs && node scripts/pse-disclosure-edge-diagnostics.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pse-disclosure-edge-diagnostics
          path: artifacts/pse-disclosure-edge/report.json
          if-no-files-found: warn
          retention-days: 7
