name: PSE verified distribution Pages and PDF responsive live QA (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .pse-distribution-live-trigger
permissions:
  contents: read
jobs:
  qa:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      PSE_DISTRIBUTION_SHAPE_ONLY: "${{ github.event.head_commit.message == 'audit(pse): distribution CMS table shapes before rollout' }}"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-distribution-live-qa.mjs && node scripts/pse-distribution-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-distribution-responsive-captures
          path: artifacts/pse-distribution-live/
          if-no-files-found: ignore
          retention-days: 7
