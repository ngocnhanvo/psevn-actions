name: PSE CSS boundary postdeploy visual QA (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.pse-css-boundary-postdeploy-qa-request]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-css-boundary-postdeploy-qa.mjs && node scripts/pse-css-boundary-postdeploy-qa.mjs
