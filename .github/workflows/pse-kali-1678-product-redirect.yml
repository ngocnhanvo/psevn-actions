name: PSE Kali 1678 owner product redirect (GUARDED)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-kali-1678-product-redirect.mjs
      - .github/workflows/pse-kali-1678-product-redirect.yml
      - .pse-kali-1678-product-redirect-request
permissions:
  contents: read
  actions: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-kali-1678-product-redirect.mjs
  apply:
    needs: syntax
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'cms(pse): point Kali 1678 to existing WooCommerce product'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: pse-legacy-redirect-native-wordpress
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Fresh database backup before owner redirect
        run: node scripts/pse-template-updraft-backup.mjs
      - run: echo "PSE_KALI_FRESH_BACKUP=yes" >> "$GITHUB_ENV"
      - run: node scripts/pse-kali-1678-product-redirect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-kali-1678-product-redirect
          path: artifacts/pse-kali-1678-product-redirect/
          retention-days: 30
          if-no-files-found: warn
