name: PSE Joomla 204 original URL and canonical acceptance (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-204-original-legacy-alias-readonly.mjs
      - .github/workflows/pse-204-original-legacy-alias-readonly.yml
      - .pse-204-original-legacy-alias-readonly-request
permissions:
  contents: read
jobs:
  syntax:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-204-original-legacy-alias-readonly.mjs
  audit:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      (github.event.head_commit.message == 'audit(pse): original Joomla 204 old URL and public canonical' ||
       github.event.head_commit.message == 'test(pse): verify original Joomla 204 legacy 301 postrelease')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-204-original-legacy-alias-readonly.mjs && node scripts/pse-204-original-legacy-alias-readonly.mjs
