name: PSE six source-gallery WordPress Media authenticated readback (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-six-historical-gallery-media-rest-audit.mjs
      - .github/workflows/pse-six-historical-gallery-media-rest-audit.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-six-historical-gallery-media-rest-audit.mjs && node scripts/pse-six-historical-gallery-media-rest-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-six-gallery-original-media-rest-evidence
          path: artifacts/pse-six-original-gallery-media/report.json
          retention-days: 14
          if-no-files-found: ignore
