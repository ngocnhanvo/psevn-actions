name: PSE Builder and WordPress DB availability read-only diagnostic
on:
  push:
    branches: [main]
    paths:
      - .pse-builder-db-readonly-diagnostic-request
permissions:
  contents: read
concurrency:
  group: pse-builder-db-diagnostic-readonly
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Diagnose WordPress REST DB error and Builder menu read only
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pse-builder-db-readonly-diagnostic.mjs
          node scripts/pse-builder-db-readonly-diagnostic.mjs
          echo 'PSE_DB_DIAGNOSTIC_DONE=READ_ONLY NO_CMS_WRITE=PASS NO_ASTRO_BUILD=PASS'
