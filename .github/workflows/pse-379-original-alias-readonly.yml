name: PSE Joomla 379 exact original legacy alias public diagnostic (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-379-original-alias-readonly.mjs
      - .github/workflows/pse-379-original-alias-readonly.yml
      - .pse-379-original-alias-readonly-request
permissions:
  contents: read
jobs:
  syntax:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-379-original-alias-readonly.mjs
  inspect:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'test(pse): inspect original Joomla 379 legacy alias after deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-379-original-alias-readonly.mjs && node scripts/pse-379-original-alias-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-379-original-alias-status
          path: artifacts/pse-379-legacy-alias/report.json
          retention-days: 30
          if-no-files-found: ignore
