name: PSE Joomla Kali three original aliases strict native variant proof (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-kali-original-variant-proof.mjs
      - .github/workflows/pse-kali-original-variant-proof.yml
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 11
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-kali-original-variant-proof.mjs
      - run: node scripts/pse-kali-original-variant-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-kali-source-variant-parity
          path: artifacts/pse-kali-original-variant/report.json
          retention-days: 14
          if-no-files-found: ignore
