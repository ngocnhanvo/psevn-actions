name: PSE verify legacy governance publication feed metadata (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-governance-feed-metadata.mjs
      - .github/workflows/pse-governance-feed-metadata.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pse-governance-legacy-feed-readonly
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Probe Joomla feeds and article 92 source metadata
        run: node --check scripts/pse-governance-feed-metadata.mjs && node scripts/pse-governance-feed-metadata.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-governance-92-legacy-feed-proof
          path: artifacts/pse-governance-feed/report.json
          retention-days: 14
          if-no-files-found: warn
