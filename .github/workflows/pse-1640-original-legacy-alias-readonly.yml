name: PSE original Joomla 1640 public old-link and canonical audit (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-1640-original-legacy-alias-readonly.mjs
      - .github/workflows/pse-1640-original-legacy-alias-readonly.yml
      - .pse-1640-original-legacy-301-live-qa-request
permissions:
  contents: read
jobs:
  old-link:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-1640-original-legacy-alias-readonly.mjs && node scripts/pse-1640-original-legacy-alias-readonly.mjs
