name: PSE inherited helmet 22 retirement verification (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .pse-helmet-retirement-audit-trigger
permissions:
  contents: read
jobs:
  helmet-retirement:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Inspect native WP active and Trash records plus live legacy paths
        run: |
          node --check scripts/pse-helmet-retirement-audit.mjs
          node scripts/pse-helmet-retirement-audit.mjs
      - name: Preserve read-only helmet retirement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pse-helmet-retirement-audit
          path: artifacts/pse-helmet-22-audit/
          retention-days: 30
          if-no-files-found: warn
