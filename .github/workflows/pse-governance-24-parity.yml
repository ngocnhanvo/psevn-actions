name: PSE verify 24 governance source documents (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-governance-2026-11-parity.mjs
      - .github/workflows/pse-governance-24-parity.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pse-governance-24-independent-parity
  cancel-in-progress: false
jobs:
  parity:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 24
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Compare six Joomla archive pages, all 24 WordPress records, Yoast titles and frontend
        run: node --check scripts/pse-governance-2026-11-parity.mjs && node scripts/pse-governance-2026-11-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-governance-2026-independent-parity
          path: artifacts/pse-governance-2026-parity/report.json
          if-no-files-found: ignore
          retention-days: 14
