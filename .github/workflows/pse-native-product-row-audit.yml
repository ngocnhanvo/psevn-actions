name: PSE Joomla fertilizer row to native Product mapping (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.pse-native-product-rows-trigger]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-native-product-row-audit.mjs && node scripts/pse-native-product-row-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-verified-product-source-rows
          path: artifacts/pse-native-products/verified-rows.json
          retention-days: 14
          if-no-files-found: warn
