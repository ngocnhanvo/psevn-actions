name: PSE legacy published draft date provenance audit (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-legacy-draft-provenance-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-draft-provenance:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 8
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned read-only browser tools
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Inspect original draft ID slug status category without writing
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import {searchDate} from './scripts/pse-legacy-search-date.mjs';
          import {readFile} from 'node:fs/promises';
          const state=JSON.parse(await readFile('docs/pse-legacy-migration-state.json','utf8'));
          if(state.schema!=='pse-legacy-article-migration-v1'||!state.backup_verified)throw Error('Wrong migration checkpoint');
          const opts=String(process.env.ENV_FILE||'').split(/\r?\n/).map(s=>s.trim().replace(/^export\s+/,''));
          const wc=opts.filter(s=>s.startsWith('WC_URL='));
          if(wc.length!==1)throw Error('Missing WordPress origin');
          const origin=new URL(wc[0].slice(7).trim().replace(/^['"]|['"]$/g,''));
          if(origin.protocol!=='https:'||origin.username||origin.password||origin.search||origin.hash||!['','/'].includes(origin.pathname))throw Error('Invalid origin');
          const wp=origin.origin;
          const browser=await chromium.launch({headless:true});
          try{
            const context=await browser.newContext({viewport:{width:1366,height:900}});
            const page=await context.newPage();
            await page.goto(wp+'/wp-admin/',{waitUntil:'domcontentloaded',timeout:60000});
            if(await page.locator('#user_login').count()){
              await page.locator('#user_login').fill(process.env.WP_ADMIN_USERNAME||'');
              await page.locator('#user_pass').fill(process.env.WP_ADMIN_PASSWORD||'');
              const body=await page.locator('body').innerText();
              const m=body.match(/(\d+)\s*([+\-x×*])\s*(\d+)\s*(?:=|\?)/i)||body.match(/(\d+)\s*([+\-x×*])\s*(\d+)/i);
              if(m){
                const a=+m[1],b=+m[3],v=({'+':a+b,'-':a-b,x:a*b,'×':a*b,'*':a*b})[m[2]];
                const input=page.locator('#loginform input[name*="captcha" i],#loginform input[name*="math" i],#loginform input[name*="arith" i],#loginform input[type="number"]').first();
                if(!await input.count())throw Error('Login challenge unavailable');
                await input.fill(String(v));
              }
              await Promise.all([page.waitForLoadState('domcontentloaded'),page.locator('#wp-submit').click()]);
            }
            if(page.url().includes('wp-login'))throw Error('WordPress admin login rejected');
            await page.goto(wp+'/wp-admin/post.php?post=248&action=edit',{waitUntil:'domcontentloaded',timeout:60000});
            const nonce=await page.evaluate(async()=>{
              if(window.wpApiSettings?.nonce)return window.wpApiSettings.nonce;
              const r=await fetch('/wp-admin/admin-ajax.php?action=rest-nonce',{credentials:'same-origin'});
              if(!r.ok)throw Error('REST nonce unavailable');
              return (await r.text()).trim();
            });
            if(!/^[a-z0-9]{8,24}$/i.test(nonce))throw Error('REST nonce invalid');
            const api=async path=>page.evaluate(async({path,nonce})=>{
              const r=await fetch(path,{method:'GET',credentials:'same-origin',headers:{'Accept':'application/json','X-WP-Nonce':nonce}});
              return {status:r.status,data:await r.json().catch(()=>null)};
            },{path,nonce});
            for(const id of ['1733','1734','1735']){
              const row=state.articles[id];
              if(!row||!Number.isSafeInteger(Number(row.wp_id)))throw Error('Missing exact source checkpoint ID '+id);
              const r=await api('/wp-json/wp/v2/posts/'+row.wp_id+'?context=edit&_fields=id,status,slug,date,date_gmt,title,categories');
              if(r.status!==200||r.data?.id!==Number(row.wp_id))throw Error('Cannot read exact WordPress post '+id);
              const wpDate=String(r.data.date||'');
              const probe=await context.newPage();
              try{
                const src=await probe.goto(row.source_url,{waitUntil:'domcontentloaded',timeout:45000});
                if(src?.status()!==200)throw Error('Cannot read source '+id+' HTTP '+src?.status());
                const article=await probe.evaluate(()=>({
                  title:(document.title||'').replace(/\s+-\s+PSE\.VN\s*$/i,'').trim(),
                  opening:(document.querySelector('[itemprop="articleBody"]')?.textContent||'').replace(/\s+/g,' ').trim().slice(0,300)
                }));
                const proof=await searchDate(probe,{
                  id:Number(id),sourceUrl:row.source_url,
                  title:article.title,opening:article.opening
                });
                console.log('PSE_LEGACY_PUBLISHED_DATE_PROVENANCE='+JSON.stringify({
                  source_id:Number(id),wp_id:row.wp_id,
                  wp_status:r.data.status,wp_date:wpDate,wp_day:wpDate.slice(0,10),
                  checkpoint_status:row.status,checkpoint_verified_date:row.verified_date||null,
                  joomla_exact_id_title_proof:!!proof.day,
                  joomla_source_created_day:proof.day||null,
                  proof_precision:proof.precision||null,
                  proof_source:proof.source,
                  wordpress_day_equals_joomla_created_day:!!proof.day&&wpDate.slice(0,10)===proof.day,
                  source_title_present:article.title.length>0,
                  source_opening_chars:article.opening.length,
                  source_search_attempts:proof.attempts||null
                }));
              }finally{await probe.close()}
            }
            console.log('PSE_LEGACY_PUBLISHED_DATE_AUDIT_FINISHED=PASS; read_only=true; wordpress_writes=0; astro_build=false');
          }finally{await browser.close()}
          NODE
