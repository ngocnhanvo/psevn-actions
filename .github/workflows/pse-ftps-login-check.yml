name: PSE FTPS strict login check (READ ONLY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-ftps-login-check.yml
permissions:
  contents: read
jobs:
  strict-authenticated-login:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout pinned shared FTPS strict check
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/knowledge-actions
          ref: c000965daa9f1ec103a56a1504317494443d05d8
          persist-credentials: false
      - name: Strict TLS + credentialed FTPS login + PWD
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ftp-tls-handshake-readonly.py
