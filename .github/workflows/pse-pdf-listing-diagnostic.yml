name: PSE PDF cards thumbnail source diagnostic (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-pdf-listing-diagnostic.mjs
      - .github/workflows/pse-pdf-listing-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Inspect real card image URLs and their WordPress source markup
        run: node --check scripts/pse-pdf-listing-diagnostic.mjs && node scripts/pse-pdf-listing-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-pdf-listing-evidence
          path: artifacts/pse-pdf-listing-diagnostic/report.json
          if-no-files-found: warn
          retention-days: 10
