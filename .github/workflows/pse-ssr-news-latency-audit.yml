name: PSE news SSR versus WordPress REST latency audit (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-ssr-news-latency-audit.yml
      - .pse-ssr-news-latency-audit-trigger
permissions:
  contents: read
jobs:
  news:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Measure published public SSR routes and WP GET endpoints (bounded, read-only)
        run: node --check scripts/pse-ssr-news-latency-audit.mjs && node scripts/pse-ssr-news-latency-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-ssr-news-latency-evidence
          path: artifacts/pse-ssr-news
          retention-days: 7
          if-no-files-found: warn
