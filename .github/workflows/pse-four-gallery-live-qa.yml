name: PSE four original Joomla albums 464 photos public live QA (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .pse-four-gallery-live-qa-request
  # Run strict read-only source parity after the existing signed production
  # deploy succeeds; this does not create a new build or write to WordPress.
  workflow_run:
    workflows:
      - PSE Astro build and deploy via WordPress GitHub Trigger
    types: [completed]
permissions:
  contents: read
jobs:
  browser:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'repository_dispatch' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'ngocnhanvo/psevn-actions' &&
          github.event.workflow_run.name == 'PSE Astro build and deploy via WordPress GitHub Trigger'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Compare four original albums, images and frontend interactions
        run: node --check scripts/pse-four-gallery-live-qa.mjs && node scripts/pse-four-gallery-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-four-source-albums-live-acceptance
          path: artifacts/pse-four-original-gallery-live/report.json
          if-no-files-found: warn
          retention-days: 30
