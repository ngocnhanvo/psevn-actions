name: PSE original TuoiTre 521979 legacy static cache archive proof (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-225-tuoitre-521979-cache-proof.mjs
      - .github/workflows/pse-225-tuoitre-521979-cache-proof.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/pse-225-tuoitre-521979-cache-proof.mjs
      - run: node scripts/pse-225-tuoitre-521979-cache-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-original-tuoitre-521979-static-cache-source-proof
          path: artifacts/pse-225-tuoitre-static-cache/report.json
          retention-days: 30
          if-no-files-found: warn
