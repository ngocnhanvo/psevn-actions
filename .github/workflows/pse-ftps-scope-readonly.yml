name: PSE FTPS account scope (READ ONLY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .pse-ftps-scope-trigger
permissions:
  contents: read
concurrency:
  group: pse-ftps-scope-readonly
  cancel-in-progress: false
jobs:
  ftps-scope:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout shared read-only FTP audit helper
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/knowledge-actions
          ref: 1d6ebfb13075c0c5c67633f0abab4e9906eb33d2
          persist-credentials: false
      - name: Install TLS-capable lftp read-only client
        shell: bash
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq --no-install-recommends lftp >/dev/null 2>&1
      - name: Verify FTP login root, account ref and allowed CWD paths
        env:
          PROJECT_NAME: PSE
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: python3 scripts/ftp-scope-readonly.py
