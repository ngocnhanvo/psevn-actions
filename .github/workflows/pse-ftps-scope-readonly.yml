name: PSE FTPS account scope (READ ONLY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .pse-ftps-scope-trigger
permissions:
  contents: read
concurrency:
  group: pse-ftps-scope-readonly
  cancel-in-progress: false
jobs:
  ftps-scope:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout shared certificate-verified FTPS audit
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/knowledge-actions
          ref: 1060e30ac63a94b1b92c75564040578e5e48da51
          persist-credentials: false
      - name: Resolve trusted FTPS hostname, authenticate and inspect directory scope
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ftp-public-certificate-readonly.py
