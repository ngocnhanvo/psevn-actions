name: PSE governance documents public article images (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-governance-public-images-audit.mjs
      - .github/workflows/pse-governance-public-images-audit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pse-governance-public-images-audit
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-governance-public-images-audit.mjs && node scripts/pse-governance-public-images-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-governance-public-images
          path: artifacts/pse-governance-public-images/report.json
          if-no-files-found: ignore
          retention-days: 7
