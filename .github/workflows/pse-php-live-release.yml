name: PSE WordPress PHP Trigger release (FTP VERIFIED)
on:
  push:
    branches: [main]
    paths:
      - .pse-php-live-release-request
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pse-wp-php-release
  cancel-in-progress: false
jobs:
  wordpress-php:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PSE Actions deploy script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout only PSE WordPress PHP master
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: PHP syntax and project identity
        shell: bash
        run: |
          set -euo pipefail
          php -l source-php/esc-tool/image.php
          php -l source-php/pse-image-delta.php
          php -l source-php/pse-unzip.php
          php -l source-php/wp-content/plugins/github-trigger/vcs-build-trigger.php
          node --check source-php/wp-content/plugins/github-trigger/vcs-build-trigger.js
          php -l source-php/wp-content/plugins/esc-visual-builder/includes/site-config.php
          php -l source-php/wp-content/plugins/esc-visual-builder/includes/text-editor.php
          php -l source-php/wp-content/plugins/esc-visual-builder/includes/text-editor-ui.php
          php -l source-php/wp-content/plugins/esc-visual-builder/includes/image-editor.php
          php -l source-php/wp-content/plugins/github-trigger/vcs-hook.php
          php -l source-php/wp-content/themes/vibe-code-theme/inc/tools/menu.php
          grep -Fq "'product', 'post', 'page'" source-php/wp-content/plugins/github-trigger/vcs-hook.php
          php -l source-php/wp-content/mu-plugins/esc-github-trigger-config.php
          php -l source-php/wp-content/mu-plugins/esc-seo-files.php
          php -l source-php/wp-content/mu-plugins/esc-url-routing-manager.php
          php source-php/wp-content/plugins/github-trigger/tests/redirect-rewrite-regression.php
          php -l source-php/wp-content/mu-plugins/pse-legacy-article-seo-rest.php
          php -l source-php/wp-content/mu-plugins/pse-post-routing-defaults.php
          php -l source-php/wp-content/mu-plugins/pse-published-post-search.php
          php -l source-php/wp-content/mu-plugins/pse-public-contact-form-id.php
          php -l source-php/wp-content/mu-plugins/pse-contact-editor-preview.php
          node --check source-php/wp-content/mu-plugins/pse-contact-editor-preview.js
          php -l source-php/wp-content/mu-plugins/pse-support-editor-preview.php
          node --check source-php/wp-content/mu-plugins/pse-support-editor-preview.js
          php -l source-php/tests/pse-public-contact-form-id.php
          php source-php/tests/pse-public-contact-form-id.php
          php -l source-php/tests/pse-post-routing-defaults.php
          php source-php/tests/pse-post-routing-defaults.php
          ! grep -Eqi 'nghiencuukhoahoc|EduResearch Hub' source-php/wp-content/mu-plugins/esc-seo-files.php
          php -l source-php/wp-content/plugins/github-trigger/tests/build-status-regression.php
          php source-php/wp-content/plugins/github-trigger/tests/build-status-regression.php
          test "$(cat source-php/pse-unzip-v2.ready)" = 'PSE_ASTRO_UNZIP_PROTOCOL=2'
          python3 -m py_compile scripts/pse-php-live-release.py
      - name: Release only PSE WordPress PHP files with protected FTPS
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 scripts/pse-php-live-release.py
      - name: Check PHP image API response contract without exposing backend origin
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,urllib.request,urllib.error
          from pathlib import Path
          from urllib.parse import urlsplit,quote
          values=[x.split('=',1)[1].strip().strip('"').strip("'") for x in os.environ['ENV_FILE'].splitlines() if x.strip().startswith('WC_URL=')]
          assert len(values)==1
          base=urlsplit(values[0])
          assert (base.scheme=='https' and base.hostname and not base.username and not base.password
                  and base.path in ('','/') and not base.query and not base.fragment and base.port in (None,443))
          sample=Path('.pse-missing-media-audit').read_text()
          items=re.findall(r'^PSE_IMAGE_PROXY_DIAG=(wp-content/uploads/[A-Za-z0-9_./-]+\.jpg)$',sample,re.M)
          assert len(items)==1 and '..' not in items[0].split('/')
          endpoint=base.scheme+'://'+base.netloc+'/esc-tool/image.php?w=2560&path='+quote(items[0][:-4]+'.webp',safe='')
          req=urllib.request.Request(endpoint,headers={'User-Agent':'PSE-Image-Contract-Smoketest'})
          try:
              with urllib.request.urlopen(req,timeout=45) as resp:
                  status=resp.status
                  marker=resp.headers.get('X-ESC-Image-Error','')
                  content_type=resp.headers.get('Content-Type','').split(';',1)[0]
                  resp.read(32)
          except urllib.error.HTTPError as resp:
              status=resp.code
              marker=resp.headers.get('X-ESC-Image-Error','')
              content_type=resp.headers.get('Content-Type','').split(';',1)[0]
          print('PSE_IMAGE_PHP_DIAGNOSTIC status='+str(status)+' marker='+marker+' content_type='+content_type)
          assert ((status==503 and marker=='imagick_missing' and content_type=='text/plain')
                  or (status==200 and content_type=='image/webp')), 'Unexpected image API response'
          print('PSE_IMAGE_PHP_DIAGNOSTIC_CONTRACT=PASS')
          PY
      - name: Probe configured WordPress unzip ready marker (NO BUILD)
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, ssl, time
          from urllib.parse import urlsplit
          from urllib.request import HTTPSHandler, HTTPRedirectHandler, Request, build_opener
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  return None
          values=[]
          for line in os.environ['ENV_FILE'].splitlines():
              if line.strip().startswith('WC_URL='):
                  values.append(line.split('=',1)[1].strip().strip('"').strip("'"))
          if len(values)!=1:
              raise RuntimeError('Expected one WordPress WC_URL in ENV_FILE')
          parsed=urlsplit(values[0])
          if not (parsed.scheme=='https' and parsed.hostname
              and not parsed.username and not parsed.password and parsed.port in (None,443)
              and parsed.path in ('','/') and not parsed.query and not parsed.fragment):
              raise RuntimeError('Invalid WordPress HTTPS origin in ENV_FILE')
          client=build_opener(HTTPSHandler(context=ssl.create_default_context()),NoRedirect)
          url=parsed.geturl().rstrip('/')+'/pse-unzip-v2.ready'
          for attempt in range(3):
              try:
                  with client.open(Request(url,method='GET'),timeout=20) as response:
                      if response.status==200 and response.read(100).strip()==b'PSE_ASTRO_UNZIP_PROTOCOL=2':
                          print('PSE_WP_UNZIP_READY_MARKER=PASS')
                          break
              except Exception:
                  pass
              if attempt==2:
                  raise RuntimeError('Configured WP unzip readiness endpoint unavailable')
              time.sleep(3)
          PY

  acf-routing-readonly-qa:
    needs: wordpress-php
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 9
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Chromium JS driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify post routing ACF defaults without changing WordPress content
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pse-acf-post-defaults-verify.mjs
          node scripts/pse-acf-post-defaults-verify.mjs
