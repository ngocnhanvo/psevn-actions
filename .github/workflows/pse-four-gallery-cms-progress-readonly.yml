name: PSE four gallery native CMS progress snapshot (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-four-gallery-cms-progress-readonly.mjs
      - .github/workflows/pse-four-gallery-cms-progress-readonly.yml
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Read native WordPress Media and gallery Post progress without mutations
        run: node --check scripts/pse-four-gallery-cms-progress-readonly.mjs && node scripts/pse-four-gallery-cms-progress-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-four-gallery-cms-progress-readonly
          path: artifacts/pse-four-gallery-progress/report.json
          if-no-files-found: warn
          retention-days: 21
