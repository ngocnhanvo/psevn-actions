name: PSE Garden public SSR routing and catalog links diagnosis (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-garden-routing-readonly.yml
      - .pse-garden-routing-readonly-request
permissions:
  contents: read
jobs:
  routes:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-garden-routing-readonly.mjs && node scripts/pse-garden-routing-readonly.mjs
