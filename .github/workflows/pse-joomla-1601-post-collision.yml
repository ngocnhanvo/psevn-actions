name: PSE source 1601 versus WordPress public slug collision (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-joomla-1601-post-collision-audit.mjs
      - .github/workflows/pse-joomla-1601-post-collision.yml
permissions:
  contents: read
jobs:
  reconcile:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-joomla-1601-post-collision-audit.mjs && node scripts/pse-joomla-1601-post-collision-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-joomla-1601-wp-identity
          path: artifacts/pse-1601-collision/result.json
          if-no-files-found: warn
          retention-days: 14
