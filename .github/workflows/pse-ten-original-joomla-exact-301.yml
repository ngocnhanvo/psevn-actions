name: PSE ten Joomla source exact native WordPress 301 redirects (GUARDED)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-ten-original-joomla-exact-301.mjs
      - .github/workflows/pse-ten-original-joomla-exact-301.yml
      - .pse-ten-original-joomla-exact-301-request
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-ten-original-joomla-exact-301.mjs
  apply:
    needs: preflight
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'cms(pse): route ten original Joomla articles to published WordPress Posts'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    concurrency:
      group: pse-legacy-article-migration-single-writer
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Updraft rollback snapshot before scoped redirect-only writes
        run: node --check scripts/pse-template-updraft-backup.mjs && node scripts/pse-template-updraft-backup.mjs
      - run: echo "PSE_TEN_REDIRECTS_BACKUP_READY=yes" >> "$GITHUB_ENV"
      - name: Create and publish only ten exact original Joomla redirects
        run: node scripts/pse-ten-original-joomla-exact-301.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-ten-native-thirdparty-original-article-301-evidence
          path: artifacts/pse-original-ten-external-article-301s/report.json
          retention-days: 30
          if-no-files-found: warn
