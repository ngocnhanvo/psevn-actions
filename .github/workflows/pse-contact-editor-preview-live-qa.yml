name: PSE WordPress native Contact editor visual parity (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-contact-editor-preview-live-qa.yml
      - scripts/pse-contact-editor-preview-live-qa.mjs
      - .pse-contact-editor-preview-qa-request
permissions:
  contents: read
jobs:
  qa:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-contact-editor-preview-live-qa.mjs && node scripts/pse-contact-editor-preview-live-qa.mjs
