name: PSE verified contact warehouse WordPress Page (DRY RUN / APPLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-contact-warehouse-page.mjs
      - .github/workflows/pse-contact-warehouse-page.yml
      - .pse-contact-warehouse-apply
permissions:
  contents: read
concurrency:
  group: pse-contact-warehouse-page
  cancel-in-progress: false
jobs:
  author:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      PSE_CONTACT_APPLY: "${{ github.event.head_commit.message == 'cms(pse): publish verified five contact warehouse cards' }}"
      PSE_CONTACT_REMOVE_NOTE: "${{ github.event.head_commit.message == 'cms(pse): remove verified Contact Page editorial placeholder' }}"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-contact-warehouse-page.mjs && node scripts/pse-contact-warehouse-page.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: pse-contact-original-wordpress-backup, path: artifacts/pse-contact-warehouse/backup.json, if-no-files-found: warn, retention-days: 14}
