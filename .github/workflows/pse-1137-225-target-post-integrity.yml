name: PSE two published Post content-media anomalies original source diagnostic (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-1137-225-target-post-integrity.mjs
      - .github/workflows/pse-1137-225-target-post-integrity.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/pse-1137-225-target-post-integrity.mjs
      - run: node scripts/pse-1137-225-target-post-integrity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-native-post-1137-225-integrity
          path: artifacts/pse-two-post-integrity/report.json
          retention-days: 14
          if-no-files-found: ignore
