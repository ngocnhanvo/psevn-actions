name: PSE WordPress album and contact real browser QA (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.pse-media-live-qa-trigger]
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      PSE_CONTACT_ONLY: "${{ github.event.head_commit.message == 'test(pse): read-only Contact two-column QA only' || github.event.head_commit.message == 'test(pse): verify live structured Contact ESC table ownership' }}"
      PSE_CONTACT_ESC_EXPECTED: "${{ github.event.head_commit.message == 'test(pse): verify live structured Contact ESC table ownership' }}"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-media-live-qa.mjs && node scripts/pse-media-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-media-responsive-visual
          path: artifacts/pse-media-visual/
          if-no-files-found: warn
          retention-days: 14
