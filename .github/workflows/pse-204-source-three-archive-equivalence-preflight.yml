name: PSE original Joomla 204 three publisher archive images and source day (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-204-source-three-archive-equivalence-preflight.mjs
      - .github/workflows/pse-204-source-three-archive-equivalence-preflight.yml
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Exact historic JPEG URL percent-encoding and source CREATED day, GET only
        run: node --check scripts/pse-204-source-three-archive-equivalence-preflight.mjs && node scripts/pse-204-source-three-archive-equivalence-preflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-original-204-three-source-jpegs-and-created-day
          path: artifacts/pse-204-original-archive-date/report.json
          retention-days: 30
          if-no-files-found: warn
