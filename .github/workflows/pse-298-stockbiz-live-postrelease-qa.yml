name: PSE original 2012 reviewed alternative PDF live parity (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-298-stockbiz-live-postrelease-qa.mjs
      - .github/workflows/pse-298-stockbiz-live-postrelease-qa.yml
      - .pse-298-stockbiz-live-qa-request
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-298-stockbiz-live-postrelease-qa.mjs
      - name: Verify exact WordPress Post, replacement PDF original SHA and real responsive public site
        if: >-
          github.event.head_commit.message == 'test(pse): verify 2012 Stockbiz alternative PDF public postrelease'
        run: node scripts/pse-298-stockbiz-live-postrelease-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-298-reviewed-live-qa
          path: artifacts/pse-298-reviewed-live-qa/report.json
          retention-days: 21
          if-no-files-found: ignore
