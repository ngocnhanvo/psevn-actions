name: PSE gallery 1053 original JPEG byte and decode proof (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-gallery-1053-original-pixel-proof.yml
      - .pse-gallery-1053-original-pixel-proof-request
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-gallery-1053-original-pixel-proof.mjs && node scripts/pse-gallery-1053-original-pixel-proof.mjs
