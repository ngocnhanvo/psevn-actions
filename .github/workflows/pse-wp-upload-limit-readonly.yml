name: PSE WordPress upload limit inspection (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - "scripts/pse-wp-upload-limit-readonly.mjs"
      - ".github/workflows/pse-wp-upload-limit-readonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-wp-upload-limit-readonly.mjs && node scripts/pse-wp-upload-limit-readonly.mjs
