name: PSE Joomla 1640 two verified original publisher archive photos native WP (GUARDED)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-1640-archive-native-import.mjs
      - .github/workflows/pse-1640-archive-native-import.yml
      - .pse-1640-archive-native-import-request
permissions:
  contents: read
  actions: read
jobs:
  source-only:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.event.head_commit.message != 'cms(pse): restore Joomla 1640 original article with two exact publisher archives'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-1640-archive-native-import.mjs
  apply:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'cms(pse): restore Joomla 1640 original article with two exact publisher archives'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: pse-legacy-article-migration-single-writer
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Fresh protected native WordPress database rollback for exact original #1640
        run: node --check scripts/pse-template-updraft-backup.mjs && node scripts/pse-template-updraft-backup.mjs
      - name: Authorize only after Updraft verifies the fresh backup
        run: echo "PSE_1640_FRESH_DB_BACKUP_VERIFIED=yes" >> "$GITHUB_ENV"
      - name: Recover exactly two original archive bytes and one original Joomla Post
        run: node --check scripts/pse-1640-archive-native-import.mjs && node scripts/pse-1640-archive-native-import.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-original-1640-native-wordpress-rollback
          path: artifacts/pse-original-1640-native/report.json
          retention-days: 30
          if-no-files-found: warn
