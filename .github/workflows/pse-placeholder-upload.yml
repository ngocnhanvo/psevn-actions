name: PSE temporary media placeholders (NO OVERWRITE)
on:
  push:
    branches: [main]
    paths: [.pse-placeholder-upload-request]
permissions:
  contents: read
jobs:
  upload-missing-only:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare image encoding
        shell: bash
        run: python3 -m pip install --quiet --disable-pip-version-check pillow
      - name: Place only 11 missing cloned image placeholders in PSE WordPress FTP
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pse-upload-legacy-media-placeholders.py
          python3 scripts/pse-upload-legacy-media-placeholders.py
