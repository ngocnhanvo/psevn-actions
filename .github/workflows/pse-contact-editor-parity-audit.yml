name: PSE Contact WordPress editor typography parity (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-contact-editor-parity-audit.mjs
      - .github/workflows/pse-contact-editor-parity-audit.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-contact-editor-parity-audit.mjs && node scripts/pse-contact-editor-parity-audit.mjs
