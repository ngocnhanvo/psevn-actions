name: PSE corporate live Page responsive Playwright QA (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .pse-corporate-live-qa-trigger
      - .pse-g4-live-qa-trigger
      - .pse-corporate-menu-links-trigger
permissions:
  contents: read
jobs:
  website-qa:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify ten WordPress menu links actually navigate to corporate child Pages
        if: "${{ github.event.head_commit.message == 'test(pse): verify corporate menu destinations' }}"
        run: |
          node --check scripts/pse-corporate-menu-destination-qa.mjs
          node scripts/pse-corporate-menu-destination-qa.mjs
      - name: Confirm all ten frontend Pages render without Joomla sidebar and mobile overflow
        if: "${{ github.event.head_commit.message != 'test(pse): verify G4 article detail after published WP Rewrite' && github.event.head_commit.message != 'test(pse): verify corporate menu destinations' }}"
        run: node scripts/pse-corporate-live-qa.mjs
      - name: Verify live WordPress article detail pages (read-only G4)
        if: "${{ success() && github.event.head_commit.message != 'test(pse): verify corporate menu destinations' }}"
        run: node scripts/pse-g4-live-article-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-corporate-live-screenshots
          path: artifacts/pse-corporate-live/
          if-no-files-found: warn
          retention-days: 7
