name: PSE Chi bo 2015 notices and PDF validation (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/pse-chi-bo-legacy-media-audit.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notices-media:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-chi-bo-legacy-media-audit.mjs && node scripts/pse-chi-bo-legacy-media-audit.mjs
