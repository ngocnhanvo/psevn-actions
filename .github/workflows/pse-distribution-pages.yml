name: PSE authentic distribution 3 Pages and regulation PDF (NO BUILD)
on:
  push:
    branches: [main]
    paths: [.pse-distribution-static-trigger]
permissions:
  contents: read
concurrency:
  group: pse-distribution-original-page-import
  cancel-in-progress: false
jobs:
  cms:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-distribution-pages.mjs && node scripts/pse-distribution-pages.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-distribution-original-migration
          path: artifacts/pse-distribution/migration.json
          retention-days: 14
          if-no-files-found: warn
