name: PSE 1434 original Joomla source publish day (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-1434-original-date-source-readonly.mjs
      - .github/workflows/pse-1434-original-date-source-readonly.yml
permissions: {contents: read}
jobs:
  date:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-1434-original-date-source-readonly.mjs && node scripts/pse-1434-original-date-source-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-1434-original-published-date
          path: artifacts/pse-1434-original-date/report.json
          retention-days: 30
          if-no-files-found: warn
