name: PSE NPK original external photo URL repair (GUARDED)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-npk-1434-external-photo-repair.mjs
      - .github/workflows/pse-npk-1434-external-photo-repair.yml
      - .pse-npk-1434-external-photo-request
permissions:
  contents: read
concurrency:
  group: pse-npk-83593-external-photo-writer
  cancel-in-progress: false
jobs:
  preview:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      PSE_NPK_PHOTO_PREVIEW_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Confirm exact original image, Page identity and one URL change (READ ONLY)
        run: |
          node --check scripts/pse-npk-1434-external-photo-repair.mjs
          node scripts/pse-npk-1434-external-photo-repair.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-npk-photo-preflight
          path: artifacts/pse-npk-external-photo/
          retention-days: 14
          if-no-files-found: ignore
  apply:
    needs: preview
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'cms(pse): restore NPK external photo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Backup WordPress DB before updating one external image URL
        run: node scripts/pse-template-updraft-backup.mjs
      - name: Update only one NPK image URL in Page 83593 and verify readback
        env:
          PSE_NPK_PHOTO_FRESH_BACKUP: 'true'
        run: node scripts/pse-npk-1434-external-photo-repair.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-npk-photo-rollback
          path: artifacts/pse-npk-external-photo/
          retention-days: 30
          if-no-files-found: warn
