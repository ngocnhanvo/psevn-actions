name: PSE distribution missing original map to native WP Media repair (NO BUILD)
on:
  push:
    branches: [main]
    paths: [.pse-distribution-map-repair-trigger]
permissions:
  contents: read
concurrency:
  group: pse-verified-distribution-map-import
  cancel-in-progress: false
jobs:
  map:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 21
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-distribution-map-repair.mjs && node scripts/pse-distribution-map-repair.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-distribution-original-map-checksum
          path: artifacts/pse-distribution-map/repair.json
          if-no-files-found: warn
          retention-days: 14
