name: PSE last three non-upload document URLs source proof (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-last-three-document-url-proof.mjs
      - .github/workflows/pse-last-three-document-url-proof.yml
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/pse-last-three-document-url-proof.mjs
      - run: node scripts/pse-last-three-document-url-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-last-three-documents-asset-availability
          path: artifacts/pse-last-three-doc-links/report.json
          retention-days: 30
          if-no-files-found: warn
