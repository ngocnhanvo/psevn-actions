name: PSE structured Contact WordPress ESC sections (guarded NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-contact-structured-sections.mjs
      - scripts/pse-contact-structured-sections.css
      - .github/workflows/pse-contact-structured-sections.yml
      - .pse-contact-structured-trigger
permissions:
  contents: read
concurrency:
  group: pse-contact-native-content-writer
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      PSE_CONTACT_STRUCTURED_MODE: ${{ github.event.head_commit.message == 'cms(pse): create native structured Contact ESC tables' && 'tables' || (github.event.head_commit.message == 'cms(pse): apply native structured Contact ESC Page' && 'page' || 'dry') }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-contact-structured-sections.mjs && node scripts/pse-contact-structured-sections.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-contact-structured-original-backup
          path: artifacts/pse-contact-structured/backup.json
          if-no-files-found: warn
          retention-days: 14
