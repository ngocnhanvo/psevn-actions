name: PSE DPM 1090 and 237 dated publisher archive discovery (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-dpm-1090-237-relocation-discovery.py
      - .github/workflows/pse-dpm-1090-237-relocation-discovery.yml
permissions:
  contents: read
jobs:
  publisher-discovery:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - run: python -m py_compile scripts/pse-dpm-1090-237-relocation-discovery.py
      - run: python scripts/pse-dpm-1090-237-relocation-discovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-dpm-1090-237-relocation-discovery
          path: artifacts/pse-dpm-1090-237-relocation-discovery/
          retention-days: 30
          if-no-files-found: warn
