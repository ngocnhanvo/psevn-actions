name: PSE financial reports source-to-WordPress parity (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-financial-report-parity.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pse-financial-reports-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-financial-report-parity.mjs && node scripts/pse-financial-report-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-financial-report-parity
          path: artifacts/pse-financial-report-parity/report.json
          if-no-files-found: warn
          retention-days: 14
