name: PSE #382 Austria original owner FTP 2 JPEG byte proof (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-original-382-ao-bytes-proof.py
      - scripts/test-pse-original-382-ao-bytes-proof.py
      - .github/workflows/pse-original-382-ao-bytes-proof.yml
permissions:
  contents: read
jobs:
  offline:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m py_compile scripts/pse-original-382-ao-bytes-proof.py scripts/test-pse-original-382-ao-bytes-proof.py
      - run: python3 scripts/test-pse-original-382-ao-bytes-proof.py
  inspect:
    needs: offline
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: pse-original-joomla-source-readonly
      cancel-in-progress: false
    env:
      PSE_SOURCE_FTP_HOST: ${{ secrets.PSE_SOURCE_FTP_HOST }}
      PSE_SOURCE_FTP_USERNAME: ${{ secrets.PSE_SOURCE_FTP_USERNAME }}
      PSE_SOURCE_FTP_PASSWORD: ${{ secrets.PSE_SOURCE_FTP_PASSWORD }}
      PSE_SOURCE_FTP_CA_PEM: ${{ secrets.PSE_SOURCE_FTP_CA_PEM }}
      PSE_SOURCE_FTP_PROTOCOL: ftps
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 scripts/pse-original-382-ao-bytes-proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-original-382-austria-source-two-jpegs-byte-proof
          path: artifacts/pse-original-382-ao-bytes-proof/report.json
          retention-days: 30
          if-no-files-found: warn
