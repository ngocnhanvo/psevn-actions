name: PSE Chi bo 2015 verified existing PDF notice binding (NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/pse-chi-bo-2015-existing-bind.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bind-existing:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-chi-bo-2015-existing-bind.mjs && node scripts/pse-chi-bo-2015-existing-bind.mjs
      - name: Preserve rollback metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pse-chi-bo-2015-existing-bind-rollback
          path: docs/reports/pse-chi-bo-2015-existing-bind-rollback.json
          if-no-files-found: ignore
          retention-days: 7
