name: PSE release configuration readiness (NO BUILD)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-release-config-audit.yml

permissions:
  contents: read

jobs:
  config:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      PSE_ASTRO_UNZIP_SIGNING_KEY: ${{ secrets.PSE_ASTRO_UNZIP_SIGNING_KEY }}
      SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      PSE_ASTRO_FTP_TARGET: ${{ vars.PSE_ASTRO_FTP_TARGET }}
      PSE_BUILD_ENABLED: ${{ vars.PSE_BUILD_ENABLED }}
    steps:
      - name: Report missing PSE runtime settings by name only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          secret_names=('ENV_FILE','PSE_ASTRO_UNZIP_SIGNING_KEY','SOURCE_REPO_PAT',
                        'FTP_SERVER','FTP_USERNAME','FTP_PASSWORD')
          variable_names=('PSE_ASTRO_FTP_TARGET','PSE_BUILD_ENABLED')
          for name in secret_names+variable_names:
              value=os.environ.get(name,'')
              print('PSE_RELEASE_SETTING '+name+'='+('present' if value else 'missing'))
          raw=os.environ.get('ENV_FILE','')
          parsed={}
          for line in raw.splitlines():
              hit=re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)\s*$',line)
              if hit:
                  parsed[hit[1]]=hit[2].strip().strip('"\'')
          for name in ('WC_URL','WC_URL_CLIENT'):
              uri=urlsplit(parsed.get(name,''))
              valid=(uri.scheme=='https' and bool(uri.hostname)
                     and not uri.username and not uri.password
                     and uri.port in (None,443) and uri.path in ('','/')
                     and not uri.query and not uri.fragment)
              print('PSE_RELEASE_ENV '+name+'='+('valid_https_origin' if valid else 'missing_or_invalid'))
          wp=parsed.get('WC_URL','')
          client=parsed.get('WC_URL_CLIENT','')
          print('PSE_RELEASE_ENV backend_differs_from_frontend='+(
              'yes' if wp and client and wp.rstrip('/')!=client.rstrip('/') else 'unverified'))
          blocked=any('nghiencuukhoahoc' in parsed.get(k,'').lower()
                      for k in ('WC_URL','WC_URL_CLIENT'))
          print('PSE_RELEASE_ENV source_project_url='+('FORBIDDEN' if blocked else 'not_detected'))
          enabled=os.environ.get('PSE_BUILD_ENABLED')=='true'
          print('PSE_PRODUCTION_BUILD_GATE='+('ENABLED' if enabled else 'LOCKED'))
          target=os.environ.get('PSE_ASTRO_FTP_TARGET','')
          host=urlsplit(client).hostname
          ready=bool(host and target==f'/domains/{host}/public_html/')
          print('PSE_RELEASE_ENV ftp_target_matches_frontend='+('yes' if ready else 'no_or_unverified'))
          # This is a static config-readiness verdict, never authorization to deploy.
          # The WordPress PHP gate and all production workflow checks remain separate.
          prerequisites = (
              all(os.environ.get(k,'') for k in secret_names)
              and ready and not blocked
              and urlsplit(wp).scheme=='https'
              and urlsplit(client).scheme=='https'
              and wp.rstrip('/')!=client.rstrip('/')
          )
          print('PSE_RELEASE_PREREQUISITES='+('READY_FOR_FURTHER_VERIFICATION' if prerequisites
                 else 'INCOMPLETE_DO_NOT_DEPLOY'))
          print('PSE_RELEASE_READ_ONLY_AUDIT=PASS')
          print('NO_ASTRO_BUILD=PASS NO_FTP=PASS NO_DISPATCH=PASS')
          PY
      - name: Check public PSE unzip protocol readiness marker without deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import ssl
          import urllib.request
          from urllib.parse import urlsplit
          raw=os.environ.get('ENV_FILE','')
          vals={}
          for line in raw.splitlines():
              line=line.strip()
              if line.startswith('export '):
                  line=line[7:].strip()
              if line.startswith('WC_URL='):
                  vals['WC_URL']=line.split('=',1)[1].strip().strip('"').strip("'")
          origin=vals.get('WC_URL','')
          parsed=urlsplit(origin)
          valid=(parsed.scheme=='https' and bool(parsed.hostname)
                 and not parsed.username and not parsed.password
                 and parsed.path in ('','/') and not parsed.query and not parsed.fragment
                 and parsed.port in (None,443)
                 and not any(x in parsed.hostname.lower() for x in ('nghiencuukhoahoc','xuongmunonbaohiem')))
          if not valid:
              print('PSE_SIGNED_UNZIP_MARKER=UNVERIFIED_INVALID_PSE_WP_ORIGIN')
          else:
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,*args,**kwargs):
                      return None
              getter=urllib.request.build_opener(NoRedirect,
                  urllib.request.HTTPSHandler(context=ssl.create_default_context()))
              req=urllib.request.Request('https://'+parsed.hostname+'/pse-unzip-v2.ready',
                  headers={'User-Agent':'PSE-Release-Readiness/1.0','Accept':'text/plain'},
                  method='GET')
              try:
                  with getter.open(req,timeout=10) as resp:
                      body=resp.read(90)
                      ready=(resp.status==200 and body.strip()==b'PSE_ASTRO_UNZIP_PROTOCOL=2')
                  print('PSE_SIGNED_UNZIP_MARKER='+('PASS' if ready else 'MISSING_OR_INVALID'))
              except Exception:
                  print('PSE_SIGNED_UNZIP_MARKER=MISSING_OR_UNAVAILABLE')
          print('PSE_UNZIP_CHECK_MODE=GET_ONLY')
          PY
