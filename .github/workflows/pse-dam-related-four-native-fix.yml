name: PSE four proven Dam Phu My related links native repair (GUARDED)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-dam-related-four-native-fix.mjs
      - .github/workflows/pse-dam-related-four-native-fix.yml
      - .pse-dam-related-four-native-fix-request
permissions:
  contents: read
  actions: read
jobs:
  syntax:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-dam-related-four-native-fix.mjs
  apply:
    if: github.repository == 'ngocnhanvo/psevn-actions' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'cms(pse): repair four proven Dam Phu My related URLs native WP'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pse-legacy-redirect-native-wordpress
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: pse-dam-related-links-audit
          path: inputs/dam
          run-id: 44989359696
          github-token: ${{ github.token }}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Fresh database backup before native repair
        run: node scripts/pse-template-updraft-backup.mjs
      - run: echo "PSE_DAM_FRESH_BACKUP=yes" >> "$GITHUB_ENV"
      - run: node scripts/pse-dam-related-four-native-fix.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-dam-related-four-fix
          path: artifacts/pse-dam-related-four-fix/
          retention-days: 30
          if-no-files-found: warn
