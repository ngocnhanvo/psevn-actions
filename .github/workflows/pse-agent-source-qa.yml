name: PSE AI Agent PHP source security QA (NO DEPLOY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-agent-source-qa.yml
permissions:
  contents: read
jobs:
  agent-security:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout PSE PHP isolated agent feature branch
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-php
          ref: feat/pse-ai-agent-secure-20261028
          path: php
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - name: Verify exact source and syntax without FTP or WordPress writes
        working-directory: php
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'feat/pse-ai-agent-secure-20261028'
          git rev-parse HEAD
          for f in \
            wp-content/mu-plugins/esc-agent.php \
            wp-content/mu-plugins/esc-agent/src/Core/Planner.php \
            wp-content/mu-plugins/esc-agent/src/Core/AgentSynthesisPrompt.php \
            wp-content/mu-plugins/esc-agent/src/Core/KnowledgeAwarePlanner.php \
            wp-content/mu-plugins/esc-agent/src/Skills/ProductSkill.php \
            wp-content/mu-plugins/esc-agent/src/Skills/KnowledgeSearchSkill.php; do
            php -l "$f"
          done
      - name: Assert history auth, POST-only clear and PSE-wide retrieval contract
        working-directory: php
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('wp-content/mu-plugins/esc-agent.php').read_text()
          assert "'permission_callback' => 'esc_agent_rest_authorize'" in s
          assert "'methods' => ['POST', 'DELETE']" in s
          assert "['GET', 'POST', 'DELETE']" not in s
          assert 'default_session' not in s
          planner=Path('wp-content/mu-plugins/esc-agent/src/Core/Planner.php').read_text()
          assert 'KHÔNG PHỤ THUỘC TRANG ĐANG MỞ' in planner
          print('PSE_AGENT_SECURITY_SOURCE=PASS')
          PY
      - run: echo 'PSE_AGENT_PHP_QA=PASS; NO_ASTRO_BUILD=PASS; NO_FTP=PASS; NO_WORDPRESS_WRITE=PASS'

  astro-release-candidate:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout only isolated PSE Astro agent release candidate
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: feat/pse-agent-zero-load-release-20261028
          path: source
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Run complete source regression tests without build
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'feat/pse-agent-zero-load-release-20261028'
          pnpm install --frozen-lockfile --prefer-offline
          pnpm exec vitest run
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createRequire } from 'node:module';
          import { pathToFileURL } from 'node:url';
          const require=createRequire(import.meta.url);
          const astroRequire=createRequire(require.resolve('astro/package.json'));
          const compiler=await import(pathToFileURL(astroRequire.resolve('@astrojs/compiler')).href);
          for(const file of ['src/astro/components/Tool/PseAgentLauncher.astro','src/astro/components/Layout/Layout.astro']) {
            await compiler.transform(await readFile(file,'utf8'),{filename:file});
            console.log('ASTRO_AGENT_PARSE_PASS '+file);
          }
          NODE
          echo 'PSE_AGENT_ASTRO_RELEASE_QA=PASS; NO_BUILD=PASS; NO_FTP=PASS'

  agent-ftps-readonly-preflight:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout review candidate PHP Agent (not production)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-php
          ref: feat/pse-ai-agent-secure-20261028
          path: source-php
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - name: Check exact Agent source inventory and FTPS scope without writes
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pse-agent-ftps-release.py
          python3 scripts/pse-agent-ftps-release.py --check-only
          echo 'PSE_AGENT_FTPS_SOURCE_READONLY=PASS; NO_FTP_WRITES=PASS'
