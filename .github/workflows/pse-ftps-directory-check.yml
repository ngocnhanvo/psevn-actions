name: PSE FTPS directory access check (READ ONLY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-ftps-directory-check.yml
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout pinned strict FTPS read-only directory probe
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/knowledge-actions
          ref: 2ecb39311faeba4c12ef18149b5e6545ce95cfec
          persist-credentials: false
      - name: Inspect allowed PSE directory CWD paths without writes
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ftp-pse-directory-readonly.py
