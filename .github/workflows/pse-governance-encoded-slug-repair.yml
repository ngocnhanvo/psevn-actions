name: PSE governance percent-encoded article slug repair (NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-governance-encoded-slug-repair.mjs
      - .github/workflows/pse-governance-encoded-slug-repair.yml
      - .pse-governance-encoded-slug-trigger
permissions:
  contents: read
concurrency:
  group: pse-governance-slug-single-writer
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-governance-encoded-slug-repair.mjs && node scripts/pse-governance-encoded-slug-repair.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-governance-encoded-slug-report
          path: artifacts/pse-governance-encoded-slug/report.json
          if-no-files-found: ignore
          retention-days: 7
