name: PSE original source 1137 financial PDF and 225 exact HTTP image evidence (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-1137-225-original-source-proof.mjs
      - .github/workflows/pse-1137-225-original-source-proof.yml
permissions:
  contents: read
jobs:
  forensic:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-1137-225-original-source-proof.mjs
      - run: node scripts/pse-1137-225-original-source-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-1137-original-pdf-and-225-original-photo-proof
          path: artifacts/pse-1137-225-original-source/report.json
          retention-days: 14
          if-no-files-found: ignore
