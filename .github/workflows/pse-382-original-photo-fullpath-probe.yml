name: PSE Joomla article 382 original image full-path provenance (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-382-original-photo-fullpath-probe.mjs
      - .github/workflows/pse-382-original-photo-fullpath-probe.yml
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-382-original-photo-fullpath-probe.mjs && node scripts/pse-382-original-photo-fullpath-probe.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pse-382-original-full-size-photo-proof
          path: artifacts/pse-382-source-full-photo/report.json
          retention-days: 14
          if-no-files-found: ignore
