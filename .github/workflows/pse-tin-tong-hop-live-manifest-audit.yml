name: PSE Tin tong hop full WP public manifest versus Joomla checkpoint (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-tin-tong-hop-live-manifest-audit.yml
      - scripts/pse-tin-tong-hop-live-manifest-audit.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-data:
    if: github.repository == 'ngocnhanvo/psevn-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compare all source mappings with live WP taxonomy and independent date checkpoint
        run: node --check scripts/pse-tin-tong-hop-live-manifest-audit.mjs && node scripts/pse-tin-tong-hop-live-manifest-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-tin-tong-hop-live-manifest
          path: artifacts/pse-tin-tong-hop-live-manifest/
          if-no-files-found: warn
          retention-days: 21
