name: PSE two published original albums 174 photos independent CMS parity (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-two-published-gallery-wordpress-source-parity.mjs
      - .github/workflows/pse-two-published-gallery-wordpress-source-parity.yml
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Compare authentic Joomla image order against published WordPress raw Post content
        run: node --check scripts/pse-two-published-gallery-wordpress-source-parity.mjs && node scripts/pse-two-published-gallery-wordpress-source-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-two-published-gallery-native-source-parity
          path: artifacts/pse-two-published-gallery-native-parity/report.json
          if-no-files-found: warn
          retention-days: 21
