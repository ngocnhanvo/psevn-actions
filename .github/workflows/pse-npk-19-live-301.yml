name: PSE NPK 19 exact Joomla query redirects live QA (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .pse-npk-19-live-301-request
      - scripts/pse-npk-19-live-301.mjs
      - .github/workflows/pse-npk-19-live-301.yml
permissions:
  contents: read
jobs:
  verify-live:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-npk-19-live-301.mjs && node scripts/pse-npk-19-live-301.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-npk-19-exact-query-live-301
          path: artifacts/pse-npk-19-live-301/report.json
          retention-days: 30
          if-no-files-found: warn
