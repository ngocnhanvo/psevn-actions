name: PSE image delta signed deploy unit contracts (NO ASTRO BUILD)
on:
  push:
    branches: [main, feature/pse-delta-image-ftps-20261025]
    paths:
      - scripts/pse-image-delta-package.py
      - scripts/pse-static-delta-package.py
      - tests/pse-static-delta-package.test.py
      - tests/pse-remote-unzip-manifest.test.py
      - scripts/pse-remote-unzip.py
      - tests/pse-image-delta-package.test.py
      - .github/workflows/pse-image-delta-contract-ci.yml
      - .github/workflows/pse-production-deploy.yml
      - scripts/pse-build-metrics.py
      - tests/test_pse_build_metrics.py
      - scripts/pse-ftps-upload.py
      - tests/test_pse_ftps_upload.py
      - .github/workflows/pse-php-live-release.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/pse-image-delta-package.py
      - scripts/pse-static-delta-package.py
      - tests/pse-static-delta-package.test.py
      - scripts/pse-remote-unzip.py
      - .github/workflows/pse-production-deploy.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PSE Actions feature changes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout merged PSE PHP master for backward-compatible contract
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: php-source
          persist-credentials: false
      - name: Check signed client, package code and YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pse-image-delta-package.py scripts/pse-static-delta-package.py scripts/pse-remote-unzip.py
          python3 tests/pse-image-delta-package.test.py
          python3 tests/pse-static-delta-package.test.py
          python3 tests/pse-remote-unzip-manifest.test.py
          python3 -m py_compile scripts/pse-build-metrics.py scripts/pse-ftps-upload.py
          python3 -m unittest discover -s tests -p 'test_pse_build_metrics.py' -v
          python3 -m unittest discover -s tests -p 'test_pse_ftps_upload.py' -v
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' .github/workflows/pse-production-deploy.yml
      - name: Verify PHP pure-unit image integrity, symlinks and fallback
        shell: bash
        run: |
          set -euo pipefail
          php -l php-source/pse-image-delta.php
          php -l php-source/pse-unzip.php
          php -l php-source/wp-content/plugins/github-trigger/redirects/endpoint.php
          php php-source/tests/pse-image-delta.php
          php php-source/tests/pse-static-delta.php
      - name: Assert no independent production build or signing bypass
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'types: [wp_trigger_build]' .github/workflows/pse-production-deploy.yml
          grep -Fq 'pse-remote-unzip.py unpack' .github/workflows/pse-production-deploy.yml
          grep -Fq 'set ssl:verify-certificate yes' scripts/pse-resumable-ftp.sh
          echo 'PSE_DELTA_UNIT_CONTRACT=PASS; NO_ASTRO_BUILD; NO_FTP; NO_DEPLOY'

  astro-redirect-registry:
    name: Validate Astro redirect incremental cache (NO DEPLOY)
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout Astro master for read-only redirect tests
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node 24 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Run Astro redirect registry regression suite
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline
          pnpm exec vitest run src/lib/wordpress/redirects/registry.test.ts src/lib/wordpress/redirects/registry.bounded-concurrency.test.ts src/lib/wordpress/redirects/registry.incremental-log.test.ts src/lib/wordpress/pages/runBoundedTasks.test.ts
          # The redirect registry runs while Info/Pages load; rejected reads
          # are settled immediately and surfaced before TablePress enrichment.
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/lib/wordpress/cache.ts').read_text()
          first = src.index("const redirectsPrefetch = loadRedirects().then(")
          assert first < src.index("const info = await getInfo(", first)
          assert "error => ({ ok: false as const, error })" in src
          assert "if (!redirectOutcome.ok) throw redirectOutcome.error;" in src
          assert src.count("const loadRedirects = async") == 1
          assert src.count("loadRedirects()") == 1
          # Pages image queue must remain strictly bounded and fail on missing media.
          pages = Path('src/lib/wordpress/pages/getData.ts').read_text()
          worker = Path('src/lib/wordpress/pages/runBoundedTasks.ts').read_text()
          assert 'const CONCURRENCY_LIMIT = 8;' in pages
          assert 'await runBoundedTasks(' in pages
          assert 'throw error;' in pages
          assert 'while (!failed)' in worker
          assert 'Math.min(maxConcurrent, tasks.length)' in worker
          assert 'if (failed)' in worker
          print("PSE_PAGES_IMAGE_WORKER_LIMIT_AND_FAILURE=PASS")
          print("PSE_REDIRECT_PREFETCH_ORDER_AND_FAILURE=PASS")
          PY
          echo "PSE_ASTRO_REDIRECT_REGISTRY=PASS; NO_ASTRO_BUILD; NO_DEPLOY"
