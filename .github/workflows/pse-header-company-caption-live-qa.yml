name: PSE company name responsive header live QA (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.pse-header-company-caption-qa-request]
permissions:
  contents: read
jobs:
  header-responsive:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 10
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install Playwright JS driver (Chromium already installed)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify company caption at 1240px and adjacent widths
        run: node --check scripts/pse-header-company-caption-live-qa.mjs && node scripts/pse-header-company-caption-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-company-header-responsive
          path: artifacts/pse-header-caption/
          if-no-files-found: ignore
          retention-days: 7
