name: PSE Yoast product categories SEO source audit (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.pse-lighthouse-terms-seo-audit-request]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-lighthouse-category-seo-audit.mjs && node scripts/pse-lighthouse-category-seo-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-yoast-category-seo-audit
          path: artifacts/pse-yoast-term-seo/
          if-no-files-found: warn
          retention-days: 10
