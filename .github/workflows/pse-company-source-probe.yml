name: PSE live Joomla company archive 10 page vs native WP direct posts QA
on:
  push:
    branches: [main]
    paths: [.pse-company-source-probe-request]
permissions:
  contents: read
jobs:
  read-only:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Collect original Joomla headings and compare to native WordPress taxonomy
        run: node --check scripts/pse-company-source-probe.mjs && node scripts/pse-company-source-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-company-news-source-parity
          path: artifacts/pse-company-news/joomla-source-parity.json
          retention-days: 7
          if-no-files-found: warn
