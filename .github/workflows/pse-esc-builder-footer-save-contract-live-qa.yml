name: PSE ESC Builder G4 Footer no-op Save Reload permission live QA (NO CMS MUTATION)
on:
  push:
    branches: [main]
    paths:
      - .pse-esc-builder-footer-save-qa-request
permissions:
  contents: read
concurrency:
  group: pse-esc-builder-footer-save-contract
  cancel-in-progress: false
jobs:
  qa:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify no-op Footer Save, original reload, and forbidden requests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pse-esc-builder-footer-save-contract-live-qa.mjs
          node scripts/pse-esc-builder-footer-save-contract-live-qa.mjs
          echo 'PSE_G4_FOOTER_NOOP_SAVE_QA=PASS; NO_CONTENT_MUTATION=PASS; NO_ASTRO_BUILD=PASS'
