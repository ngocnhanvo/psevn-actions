name: PSE historical Tin tong hop exact RSS dates (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-379-full-original-rss.mjs
      - .github/workflows/pse-379-full-original-rss.yml
permissions:
  contents: read
jobs:
  exact-source:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/pse-379-full-original-rss.mjs
      - run: node scripts/pse-379-full-original-rss.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-exact-source-tin-tong-hop-rss
          path: artifacts/pse-379-full-rss/report.json
          retention-days: 14
          if-no-files-found: ignore
