name: PSE four original Joomla gallery creation day proof (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-four-gallery-original-created-date-audit.mjs
      - .github/workflows/pse-four-gallery-created-day-audit.yml
permissions:
  contents: read
jobs:
  source-day:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify exact original Joomla-created dates, never infer from titles
        run: node --check scripts/pse-four-gallery-original-created-date-audit.mjs && node scripts/pse-four-gallery-original-created-date-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-four-original-gallery-created-day-evidence
          path: artifacts/pse-four-gallery-created-dates/report.json
          if-no-files-found: warn
          retention-days: 21
