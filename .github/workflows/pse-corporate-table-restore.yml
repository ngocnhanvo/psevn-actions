name: PSE verified corporate WordPress table restoration
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-corporate-table-restore.mjs
      - .github/workflows/pse-corporate-table-restore.yml
permissions:
  contents: read
jobs:
  restore-table:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Restore source-identical table content without changing WP publish status
        run: node scripts/pse-corporate-table-restore.mjs
