name: PSE Astro build and deploy via WordPress GitHub Trigger
on:
  repository_dispatch:
    types: [wp_trigger_build]
permissions:
  contents: read
concurrency:
  group: pse-astro-production-deploy
  cancel-in-progress: false
jobs:
  astro:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions'
      && github.ref == 'refs/heads/main'
      && github.event_name == 'repository_dispatch'
      && github.event.action == 'wp_trigger_build'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      ZIP_PATH: source/upload/pse-astro.zip
      PSE_PRODUCTION_SOURCE: master
      PSE_DEPLOY_SOURCE_BRANCH: master
      PSE_DEPLOY_REQUEST_DOMAIN: ${{ github.event.client_payload.site_domain }}
    steps:
      - name: Checkout immutable PSE deploy scripts
        uses: actions/checkout@v4
        with:
          path: actions-hub
      - name: Checkout only Astro PRODUCTION branch
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - name: Verify PSE production source and configured WordPress/frontend destinations
        shell: bash
        run: |
          set -euo pipefail
          # Instrument from source validation through signed sitemap/inventory
          # reads; keep all checks in the original fail-closed order.
          python3 actions-hub/scripts/pse-build-metrics.py start preflight || true
          test -n "$ENV_FILE" && test -n "$SOURCE_REPO_PAT"
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          test "$(git -C source symbolic-ref --short HEAD)" = master
          sha="$(git -C source rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "PSE_DEPLOY_COMMIT=$sha" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          vals={}
          for line in os.environ['ENV_FILE'].splitlines():
              m=re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)\s*$',line)
              if m:vals[m[1]]=m[2].strip().strip('"\'')
          def origin(key):
              url=urlsplit(vals.get(key,''))
              if (url.scheme!='https' or not url.hostname or url.username or url.password
                  or url.port not in (None,443) or url.path not in ('','/')
                  or url.query or url.fragment):
                  raise RuntimeError('Invalid HTTPS origin: '+key)
              return url.hostname, 'https://'+url.hostname
          wp_host,wp_origin=origin('WC_URL')
          client_host,client_origin=origin('WC_URL_CLIENT')
          if wp_host==client_host:
              raise RuntimeError('WordPress and frontend origins cannot be identical')
          # Same as inherited NCKH workflow, but migrate-safe: target is
          # derived exclusively from the validated WC_URL_CLIENT, not a new var.
          target='/domains/'+client_host+'/public_html/'
          if os.environ.get('PSE_DEPLOY_REQUEST_DOMAIN')!=client_host:
              raise RuntimeError('Build trigger domain disagrees with WordPress frontend')
          if any(x in vals for x in ('NCKH_GOOGLE_OAUTH_JSON','NCKH_SESSION_KEY',
                                     'PSE_GOOGLE_OAUTH_JSON','PSE_SESSION_KEY',
                                     'GOOGLE_OAUTH_STAGING_JSON')):
              raise RuntimeError('Private runtime credentials cannot be written into build .env')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as out:
              out.write('PSE_CLIENT_HOST='+client_host+'\n')
              out.write('PSE_CLIENT_ORIGIN='+client_origin+'\n')
              out.write('PSE_WP_ORIGIN='+wp_origin+'\n')
              out.write('ASTRO_FTP_TARGET='+target+'\n')
              out.write('FTP_ASTRO_DIR='+target+'\n')
          print('PASS: PSE master and deployment target derived from WC_URL_CLIENT')
          PY
      - name: Reject inherited tenant runtime while requiring active WordPress SSR routes
        shell: bash
        run: |
          set -euo pipefail
          test ! -e source/src/lib/nckh
          test ! -e source/src/pages/api/nckh
          test ! -e source/src/pages/api/auth
          test ! -e source/src/pages/so-tay
          test -f source/src/pages/api/user/info.ts
          test -f 'source/src/pages/ssr/posts/[slug]/detail.astro'
          test -f 'source/src/pages/ssr/products/[slug]/detail.astro'
          grep -Eq 'export const prerender = false' source/src/pages/api/user/info.ts
          if grep -Eq 'nghiencuukhoahoc|api-nghiencuukhoahoc|xuongmunonbaohiem' \
              source/src/pages/api/user/info.ts \
              'source/src/pages/ssr/posts/[slug]/detail.astro' \
              'source/src/pages/ssr/products/[slug]/detail.astro'; then
            echo "::error::PSE Astro runtime includes a source-tenant backend reference"
            exit 1
          fi
      - name: Check signed unzip staging destination before any build or FTP
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile actions-hub/scripts/pse-remote-unzip.py
          python3 actions-hub/tests/pse-remote-unzip-manifest.test.py
          python3 actions-hub/scripts/pse-remote-unzip.py verify
      - name: Read saved sitemap revision and signed image inventory concurrently (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 -m py_compile actions-hub/scripts/pse-published-sitemap-revision.py
          # These two reads are independent. BOTH results must succeed before
          # dependencies, build or deployment proceed. Signed preflight above
          # has already validated the PHP server and deploy destination.
          python3 actions-hub/scripts/pse-published-sitemap-revision.py &
          sitemap_pid=$!
          python3 actions-hub/scripts/pse-remote-unzip.py manifest &
          image_pid=$!
          sitemap_status=0
          image_status=0
          wait "$sitemap_pid" || sitemap_status=$?
          wait "$image_pid" || image_status=$?
          if (( sitemap_status != 0 || image_status != 0 )); then
            echo "::error::PSE signed read-only preflight failed"
            exit 1
          fi
          python3 actions-hub/scripts/pse-build-metrics.py stop preflight 0 || true
          # This timer crosses the existing pnpm/node/cache Actions without
          # inserting any network requests, unsafe bypasses or new build steps.
          python3 actions-hub/scripts/pse-build-metrics.py start cache_setup || true
      # GitHub-hosted runners are ephemeral: reuse downloaded packages
      # keyed by the Astro production lockfile. Never cache node_modules or .env.
      - name: Set up pnpm 9 (without installing project dependencies)
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js 24 with pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      # Same production data cache model as Blue Sea: retain Astro's
      # native .cache across fresh runners. No special Page/section filtering.
      - name: Restore and update Astro cache
        uses: actions/cache@v4
        with:
          path: source/.cache
          key: pse-prod-dot-cache-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pse-prod-dot-cache-v2-${{ runner.os }}-
      - name: Install frozen Astro dependencies (pnpm cache)
        shell: bash
        working-directory: source
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python3 ../actions-hub/scripts/pse-build-metrics.py stop cache_setup 0 || true
          python3 ../actions-hub/scripts/pse-build-metrics.py start install
          trap 'status=$?; python3 ../actions-hub/scripts/pse-build-metrics.py stop install "$status" || true' EXIT
          pnpm install --frozen-lockfile --prefer-offline
      - name: Build Astro Production (incremental WordPress data cache)
        shell: bash
        working-directory: source
        timeout-minutes: 18
        run: |
          set -euo pipefail
          python3 ../actions-hub/scripts/pse-build-metrics.py start astro
          trap 'status=$?; python3 ../actions-hub/scripts/pse-build-metrics.py stop astro "$status" || true' EXIT
          printf '%s\n' "$ENV_FILE" > .env
          # Original WordPress source/cache rules and production build command.
          pnpm run build-git
      - name: Verify compiled Astro SSR and production source
        shell: bash
        working-directory: source
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 ../actions-hub/scripts/pse-build-metrics.py start verify
          trap 'status=$?; python3 ../actions-hub/scripts/pse-build-metrics.py stop verify "$status" || true' EXIT
          node --check dist/server/entry.mjs
          # Private runtime env loader must be part of the same compiled release.
          grep -q "__PSE_PRIVATE_RUNTIME_ENV_V1__" dist/server/entry.mjs
          test -s dist/client/index.html
          test -s dist/server/entry.mjs
          ! grep -q 'xuongmunonbaohiem' dist/client/index.html
          # Verify that compiled server routing still includes the active WordPress
          # user endpoint and dynamic SSR routes, not retired NCKH endpoints.
          if ! grep -RqlE 'api/user/info|ssr/(posts|products)' dist/server; then
            echo "::error::Compiled server does not contain expected WordPress SSR routes"
            exit 1
          fi
          echo "Build source SHA: $(git rev-parse HEAD) (master)" >> "$GITHUB_STEP_SUMMARY"
      - name: Package only compiled staging output (strictly no .env)
        shell: bash
        working-directory: source
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python3 ../actions-hub/scripts/pse-build-metrics.py start package
          trap 'status=$?; python3 ../actions-hub/scripts/pse-build-metrics.py stop package "$status" || true' EXIT
          mkdir -p deploy upload
          # All three root HTML entrypoints and representative _astro CSS/JS
          # and image assets have been tested by reversible FTPS removal.
          # Their public URLs continue to return identical content from
          # the Astro Node runtime client tree. Keep one canonical copy.
          # Reproducible staging probes: 39211910217, 39212152303,
          # 39212358489 (CSS/JS/WebP passed), 39212524243 (restored OK).
          cp -a dist/. deploy/
          test -s deploy/client/index.html
          test -s deploy/server/entry.mjs
          test ! -e deploy/index.html
          test ! -e deploy/so-tay
          test ! -e deploy/xem-truoc
          test ! -e deploy/_astro
          # Apache serves these three public metadata files from document-root.
          # The Astro SSR runtime serves app assets from client/, while old root
          # copies remain unchanged unless explicitly included in the archive.
          # Whitelist ONLY the public, content-checked metadata; never flatten
          # HTML, _astro assets, application data or private runtime files.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          import xml.etree.ElementTree as ET

          root = Path("deploy")
          origin = os.environ['PSE_CLIENT_ORIGIN']
          state_file = root / "client" / ".template-sitemap-deploy-state.json"
          if not state_file.is_file():
              raise RuntimeError("Missing signed-build sitemap Save revision decision")
          state = json.loads(state_file.read_text())
          if state.get("origin") != origin or not isinstance(state.get("changed"), bool):
              raise RuntimeError("Unexpected sitemap deploy decision")
          rev = state.get("revision")
          import re
          if not isinstance(rev, str) or re.fullmatch(r"(?:legacy|[a-f0-9-]{36})", rev) is None:
              raise RuntimeError("Unexpected sitemap Save revision")
          # Workflow-local metadata (not uploaded publicly except safe revision
          # token in the existing pse-staging-build.json).
          Path(".pse-sitemap-package-state.json").write_text(json.dumps(state))
          state_file.unlink()
          published = {}
          for name in ("llms.txt", "robots.txt"):
              compiled = root / "client" / name
              if not compiled.is_file():
                  raise RuntimeError("Missing WordPress SEO metadata: " + name)
              raw = compiled.read_bytes()
              if not raw:
                  raise RuntimeError("Invalid compiled SEO metadata: " + name)
              published[name] = raw

          if state["changed"]:
              compiled = root / "client" / "sitemap.xml"
              if not compiled.is_file():
                  raise RuntimeError("Saved sitemap XML missing from build")
              raw = compiled.read_bytes()
              try:
                  xmlroot = ET.fromstring(raw)
              except ET.ParseError as e:
                  raise RuntimeError("Invalid WordPress XML: " + str(e))
              ns = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
              if xmlroot.tag != ns + "urlset":
                  raise RuntimeError("Invalid sitemap namespace")
              urls = []
              for item in xmlroot.findall(ns + "url"):
                  loc = item.find(ns + "loc")
                  if loc is None or not loc.text:
                      raise RuntimeError("Missing sitemap loc")
                  value = loc.text.strip()
                  p = urlsplit(value)
                  if p.scheme != "https" or p.netloc != os.environ['PSE_CLIENT_HOST'] or p.query or p.fragment:
                      raise RuntimeError("Sitemap loc uses unsafe origin")
                  urls.append(value)
              if not urls or origin + "/" not in urls or len(urls) != len(set(urls)):
                  raise RuntimeError("Sitemap homepage missing/duplicate")
              published["sitemap.xml"] = raw
              print("SITEMAP SAVE DETECTED: XML included in deploy")
          else:
              # The signed PHP activator copies the unchanged public file
              # locally into the new client directory. Do not send XML.
              (root / "client" / "sitemap.xml").unlink(missing_ok=True)
              if (root / "sitemap.xml").exists():
                  raise RuntimeError("Unchanged sitemap must not be at ZIP root")
              print("SITEMAP UNCHANGED: XML excluded from deploy; hosting retains prior XML")

          # WordPress already validated and saved robots/llms. Preserve the
          # administrator's public settings; no staging or one-page policy.
          for name, data in published.items():
              (root / name).write_bytes(data)
          print("PASS: production SEO root files from WP; update sitemap=" + str(state["changed"]))
          PY
          echo "$(date +%s)" > deploy/pm2-reload.txt
          python3 - <<'PY'
          import json,os
          sha=os.environ['PSE_DEPLOY_COMMIT']
          state=json.load(open('.pse-sitemap-package-state.json',encoding='utf8'))
          with open('deploy/pse-staging-build.json','w',encoding='utf8') as handle:
              json.dump({
                  'branch':'master','commit':sha,'target':os.environ['PSE_CLIENT_HOST'],
                  'sitemap_revision':state['revision'],
              },handle)
          PY
          test ! -e deploy/.env
          test -s deploy/server/entry.mjs
          test -s deploy/client/index.html
          # Image and public static reuse only remove bytes from the ZIP
          # after a signed PHP inventory proves both hash and size unchanged.
          # server/ SSR, index.html and SEO files remain in every release.
          # PHP restores every reused byte into verified staging BEFORE swap.
          python3 ../actions-hub/scripts/pse-image-delta-package.py
          python3 ../actions-hub/scripts/pse-static-delta-package.py
          cd deploy
          # Default deflate level 6: measured against level 9 on 901 real
          # PSE cached images (56 MiB), where level 9 saved only 50 bytes.
          # On unchanged-media production level 9 saved just 0.42% of a
          # ~2 MiB ZIP; neither measured release ran faster as a result.
          # Preserve the exact signed ZIP format, entries, checksums, PHP
          # activation and rollback without requiring a stronger compression
          # setting that has not shown end-to-end performance benefit.
          zip -q -6 -r ../upload/pse-astro.zip .
          echo "PSE_RELEASE_ZIP_DEFLATE_LEVEL=6"
          cd ..
          python3 - <<'PY'
          import json
          import os
          from zipfile import ZipFile
          with ZipFile('upload/pse-astro.zip') as z:
              names=z.namelist()
              if '.env' in names or any('private-runtime' in name for name in names):
                  raise RuntimeError('Refusing archive with private runtime secrets')
              # No flattened client output must reappear at root.
              if any(name in names for name in ('index.html','so-tay/index.html','xem-truoc/index.html','_astro/')):
                  raise RuntimeError('Duplicate application assets outside client/ are forbidden')
              state=json.load(open('.pse-sitemap-package-state.json',encoding='utf8'))
              for static in ('llms.txt','robots.txt'):
                  if static not in names or ('client/' + static) not in names:
                      raise RuntimeError('Missing WordPress metadata: ' + static)
                  if z.read(static) != z.read('client/' + static):
                      raise RuntimeError('Metadata copies differ: ' + static)
              present='sitemap.xml' in names and 'client/sitemap.xml' in names
              absent='sitemap.xml' not in names and 'client/sitemap.xml' not in names
              if state['changed'] and (not present or z.read('sitemap.xml')!=z.read('client/sitemap.xml')):
                  raise RuntimeError('Saved sitemap missing or mismatched in archive')
              if not state['changed'] and not absent:
                  raise RuntimeError('Unchanged sitemap XML must be excluded from archive')
              if 'pse-image-delta.json' in names:
                  image_delta=json.loads(z.read('pse-image-delta.json'))
                  if image_delta.get('format') != 1 or not isinstance(image_delta.get('reuse'),list) or not isinstance(image_delta.get('files'),dict):
                      raise RuntimeError('Malformed signed image delta ZIP manifest')
                  for name in image_delta['reuse']:
                      if not isinstance(name,str) or 'client/images/'+name in names or name not in image_delta['files']:
                          raise RuntimeError('Reused image was improperly uploaded')
              if 'pse-static-delta.json' in names:
                  static_delta=json.loads(z.read('pse-static-delta.json'))
                  if (static_delta.get('format')!=1 or
                      not isinstance(static_delta.get('reuse'),list) or
                      not isinstance(static_delta.get('files'),dict)):
                      raise RuntimeError('Malformed static delta ZIP marker')
                  for name in static_delta['reuse']:
                      if (not isinstance(name,str) or name=='index.html' or
                          'client/'+name in names or name not in static_delta['files']):
                          raise RuntimeError('Reused static file was improperly uploaded')
              meta=json.loads(z.read('pse-staging-build.json'))
              if meta.get('branch')!='master' or meta.get('commit')!=os.environ['PSE_DEPLOY_COMMIT'] or meta.get('sitemap_revision')!=state['revision']:
                  raise RuntimeError('Archive revision marker mismatch')
              for required in ('server/entry.mjs','client/index.html','pse-staging-build.json'):
                  if required not in names:raise RuntimeError('Missing staged bundle file: '+required)
          print('PASS: ZIP contains dev server/client and provenance, no private environment file.')
          PY
          python3 ../actions-hub/scripts/pse-build-metrics.py zip upload/pse-astro.zip
      - name: Verify Python FTPS transport (stdlib, no APT)
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 -m py_compile actions-hub/scripts/pse-ftps-upload.py
          python3 -m unittest discover -s actions-hub/tests -p 'test_pse_ftps_upload.py' -v
          echo "PYTHON_FTPS_TRANSPORT=READY"
      - name: Upload staging ZIP and protected runtime .env in parallel (verified FTPS)
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          python3 -m py_compile actions-hub/scripts/pse-runtime-env-ftps.py
          # Separate FTPS sessions and disjoint paths. Never package secrets
          # into the public ZIP; retain HTTP deny, permissions and rollback.
          # Serialize metric updates because both stages share one JSON file.
          metric() {
            flock "$RUNNER_TEMP/pse-build-metrics.lock" python3 actions-hub/scripts/pse-build-metrics.py "$@"
          }
          run_stage() (
            stage="$1"; shift
            metric start "$stage"
            trap 'status=$?; metric stop "$stage" "$status" || true' EXIT
            "$@"
          )
          start_ms="$(date +%s%3N)"
          run_stage ftps timeout --signal=TERM --kill-after=10s 360s python3 -u actions-hub/scripts/pse-ftps-upload.py &
          zip_pid=$!
          run_stage runtime_env timeout --signal=TERM --kill-after=10s 290s python3 -u actions-hub/scripts/pse-runtime-env-ftps.py &
          env_pid=$!
          zip_status=0
          env_status=0
          wait "$zip_pid" || zip_status=$?
          wait "$env_pid" || env_status=$?
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          echo "PSE_PARALLEL_UPLOAD elapsed_ms=$elapsed_ms zip_exit=$zip_status env_exit=$env_status"
          printf '\n- Parallel ZIP + runtime env wall time: %s ms (ZIP exit %s, env exit %s).\n' "$elapsed_ms" "$zip_status" "$env_status" >> "$GITHUB_STEP_SUMMARY"
          # Both uploads must succeed BEFORE signed activation.
          if (( zip_status != 0 || env_status != 0 )); then
            echo "::error::PSE parallel upload failed (ZIP=$zip_status, env=$env_status)"
            exit 1
          fi
      - name: Verify provenance and activate staging bundle using signed PHP rollback
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python3 actions-hub/scripts/pse-build-metrics.py start activate
          trap 'status=$?; python3 actions-hub/scripts/pse-build-metrics.py stop activate "$status" || true' EXIT
          python3 actions-hub/scripts/pse-remote-unzip.py unpack
          # Public readiness/SSR/SEO checks are reported by the separate read-only workflow.
          echo 'PSE_SMOKE_POLICY=external'
      - name: Summarize PSE deploy stages and ZIP composition
        if: always()
        shell: bash
        run: |
          python3 actions-hub/scripts/pse-build-metrics.py summary
