name: PSE annual 18 source and WordPress parity (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-annual-18-parity.mjs
      - .github/workflows/pse-annual-18-parity.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pse-annual-18-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 23
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-annual-18-parity.mjs && node scripts/pse-annual-18-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-annual-18-parity
          path: artifacts/pse-annual-parity/report.json
          if-no-files-found: warn
          retention-days: 14
