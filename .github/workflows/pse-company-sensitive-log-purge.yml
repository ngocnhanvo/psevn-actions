name: PSE one-time sensitive failed run log purge
on:
  push:
    branches: [main]
    paths: [.pse-company-sensitive-log-purge-request]
permissions:
  contents: read
  actions: write
jobs:
  purge:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Purge accidentally verbose failed network stacktrace logs
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .pse-company-sensitive-log-purge-request)" = "MODE=PURGE_RUN_45954350458"
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 3 --retry-all-errors \
            --request DELETE --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ngocnhanvo/psevn-actions/actions/runs/45954350458/logs")"
          test "$code" = 204
          echo "Purged the affected failed CI logs: HTTP 204"
