name: PSE private runtime env contract (NO DEPLOY)
on:
  push:
    branches: [feat/pse-runtime-env-ftps-20261028]
    paths:
      - .github/workflows/pse-runtime-env-ci.yml
      - .github/workflows/pse-production-deploy.yml
      - scripts/pse-runtime-env-ftps.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pse-runtime-env-ci.yml
      - .github/workflows/pse-production-deploy.yml
      - scripts/pse-runtime-env-ftps.py
permissions:
  contents: read
jobs:
  private-env-contract:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate FTPS script syntax and safe target without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pse-runtime-env-ftps.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path('scripts/pse-runtime-env-ftps.py')
          spec=importlib.util.spec_from_file_location('env_probe', path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          values=module.env_values('WC_URL=https://admin-pse.webnvn.com\nWC_URL_CLIENT=https://pse.webnvn.com\nWOO_KEY=synthetic\nWOO_SECRET=synthetic\n')
          assert values['WOO_SECRET']=='synthetic'
          assert module.origin('https://pse.webnvn.com')=='pse.webnvn.com'
          assert '../' not in module.NAME and '/' not in module.NAME
          source=path.read_text()
          assert 'ftp.prot_p()' in source
          assert 'SITE CHMOD 600' in source
          assert 'public_html' in source and 'ftp.cwd(domain_root)' in source
          workflow=Path('.github/workflows/pse-production-deploy.yml').read_text()
          upload=workflow.index('python3 actions-hub/scripts/pse-runtime-env-ftps.py')
          activate=workflow.index('Verify provenance and activate staging bundle')
          assert upload < activate
          assert 'test ! -e deploy/.env' in workflow
          assert '__PSE_PRIVATE_RUNTIME_ENV_V1__' in workflow
          print('PSE_PRIVATE_RUNTIME_ENV_CONTRACT=PASS no_ftp=no_astro_build=PASS')
          PY
      - name: Validate Astro source loader on its isolated development branch
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: feat/pse-runtime-env-loader-20261028
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: astro
          persist-credentials: false
      - name: Check SSR patch syntax and non-public runtime env path
        shell: bash
        run: |
          set -euo pipefail
          node --check astro/scripts/patch-entry.mjs
          node - <<'JS'
          const fs=require('node:fs');
          const s=fs.readFileSync('astro/scripts/patch-entry.mjs','utf8');
          if(!s.includes('new URL("../../.pse-astro-runtime.env", import.meta.url)') ||
             !s.includes('code = privateRuntimeEnvBootstrap + code;') ||
             !s.includes('__PSE_PRIVATE_RUNTIME_ENV_V1__'))process.exit(1);
          if(typeof process.loadEnvFile!=='function')process.exit(1);
          console.log('PSE_PRIVATE_RUNTIME_ASTRO_CONTRACT=PASS');
          JS
          echo 'PSE_RUNTIME_ENV_QA=PASS no_deploy=PASS'
