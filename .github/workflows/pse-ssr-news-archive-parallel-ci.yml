name: PSE news archive SSR parallel source tests (NO BUILD)
on:
  push:
    branches: [main]
    paths: [.github/workflows/pse-ssr-news-archive-parallel-ci.yml]
permissions:
  contents: read
jobs:
  unit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: perf/pse-news-ssr-category-parallel-20261028
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: source
      - name: Verify exact source revision
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "f204d5caa9c3613f03b802300b28b521a801c823"
          echo "PSE_NEWS_SSR_SHA=$(git rev-parse HEAD)"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: News SSR regression tests and Astro syntax (no build)
        working-directory: source
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm exec vitest run src/lib/seo/pseNewsCategorySsr.test.ts src/lib/wordpress/categories/pseArchive.test.ts src/lib/wordpress/posts/index.test.ts
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { transform } from '@astrojs/compiler';
          const f='src/pages/ssr/posts/[slug]/[page].astro';
          const result=await transform(await readFile(f,'utf8'), {filename:f});
          if(result.errors?.length)throw Error(JSON.stringify(result.errors));
          console.log('PSE_NEWS_SSR_ASTRO_PARSE=PASS');
          NODE
          echo "PSE_NEWS_SSR_REGRESSION=PASS; NO_ASTRO_BUILD=PASS; NO_FTP=PASS"
