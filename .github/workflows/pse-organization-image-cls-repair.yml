name: PSE organization intrinsic image CLS fix (NO BUILD)
on:
  push:
    branches: [main]
    paths: [.pse-organization-image-cls-repair-request]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-organization-image-intrinsic-repair.mjs && node scripts/pse-organization-image-intrinsic-repair.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-organization-image-dimensions-backup
          path: artifacts/pse-organization-image-size/
          if-no-files-found: warn
          retention-days: 21
