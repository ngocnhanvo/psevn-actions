name: PSE Chi bo HDQT BKS legacy category parity (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/pse-chi-bo-category-parity.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chi-bo-parity:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Audit all Joomla pages against WP and Astro
        run: |
          node --check scripts/pse-chi-bo-category-parity.mjs
          node scripts/pse-chi-bo-category-parity.mjs
