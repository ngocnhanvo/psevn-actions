name: PSE hotline and FAQ live ESC UI QA (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .pse-support-pages-live-qa-trigger
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-support-pages-live-qa.mjs && node scripts/pse-support-pages-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-support-esc-desktop-mobile
          path: artifacts/pse-support-live-qa/
          if-no-files-found: ignore
          retention-days: 7
