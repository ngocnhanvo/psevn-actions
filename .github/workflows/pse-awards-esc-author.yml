name: PSE G8 awards native ESC Table authoring (NO LIVE PAGE EDIT)
on:
  push:
    branches: [main]
    paths:
      - .pse-awards-esc-author-trigger
permissions:
  contents: read
concurrency:
  group: pse-awards-esc-author
  cancel-in-progress: false
jobs:
  table:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Native ESC Table structured rows and original PSE media
        run: |
          node --check scripts/pse-awards-esc-author.mjs
          node scripts/pse-awards-esc-author.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-g8-esc-before
          path: artifacts/pse-awards-esc/before-authoring.json
          if-no-files-found: ignore
          retention-days: 14
