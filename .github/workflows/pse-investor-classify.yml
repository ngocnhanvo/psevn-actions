name: PSE verified investor category taxonomy and article classification (NO BUILD)
on:
  push:
    branches: [main]
    paths: [.pse-investor-classify-trigger]
permissions:
  contents: read
concurrency:
  group: pse-investor-category-classification
  cancel-in-progress: false
jobs:
  classify:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-investor-classify.mjs && node scripts/pse-investor-classify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: pse-investor-classify-source-manifest, path: artifacts/pse-investor-classify/audit.json, if-no-files-found: ignore, retention-days: 14}
