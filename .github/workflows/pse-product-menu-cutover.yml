name: PSE verified Product SSR routes and Header menu after release (NO BUILD)
on:
  push:
    branches: [main]
    paths: [.pse-product-menu-cutover-trigger]
permissions:
  contents: read
concurrency:
  group: pse-product-menu-cutover
  cancel-in-progress: false
jobs:
  cms:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-product-menu-cutover.mjs && node --check scripts/pse-product-menu-ssr-sync.mjs && node --check scripts/pse-product-detail-cms-table-fix.mjs && node --check scripts/pse-product-menu-task-router.mjs && node scripts/pse-product-menu-task-router.mjs
