name: PSE 2014 2016 annual PDF frontend proxy exact binary proof (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-two-annual-pdf-route-proof.mjs
      - .github/workflows/pse-two-annual-pdf-route-proof.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/pse-two-annual-pdf-route-proof.mjs
      - run: node scripts/pse-two-annual-pdf-route-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-two-annual-original-binary-route-proof
          path: artifacts/pse-two-annual-pdf-routes/report.json
          retention-days: 21
          if-no-files-found: warn
