name: PSE Builder disposable WP REST acceptance (NO PROD)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-esc-builder-disposable-wp-rest.yml
      - scripts/pse-esc-builder-disposable-wp-rest.php
      - .pse-esc-builder-disposable-wp-rest-request
permissions:
  contents: read
jobs:
  isolated-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: qa-local-only
          MARIADB_DATABASE: pse_builder_qa
          MARIADB_USER: pseqa
          MARIADB_PASSWORD: qa-local-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: php
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, zip, gd
          tools: wp-cli
          coverage: none
      - name: Audit bundled PSE native menu and locale helper ownership (read only)
        shell: bash
        run: |
          set -euo pipefail
          grep -R -l -E 'function[[:space:]]+esc_pse_(page_lang|get_menu_meta|find_menu_object|get_menu_item_link_mode)' \
            php/wp-content/mu-plugins php/wp-content/plugins/esc-table \
            php/wp-content/plugins/esc-visual-builder php/wp-content/themes/vibe-code-theme \
            --include='*.php' || true
          echo 'PSE_S8_SOURCE_HELPER_INVENTORY=PASS NO_WRITE=true'
      - name: Verify WP-CLI or recover a pinned upstream release
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v wp >/dev/null 2>&1; then
            version=2.12.0
            base="https://github.com/wp-cli/wp-cli/releases/download/v${version}/wp-cli-${version}.phar"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              --max-time 90 "$base" --output /tmp/pse-wp-cli.phar
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              --max-time 30 "$base.sha256" --output /tmp/pse-wp-cli.sha256
            expected="$(tr -d '\r\n ' < /tmp/pse-wp-cli.sha256)"
            [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
            echo "$expected  /tmp/pse-wp-cli.phar" | sha256sum --check -
            sudo install -m 0755 /tmp/pse-wp-cli.phar /usr/local/bin/wp
            echo "PSE_WP_CLI_RECOVERY=PASS SHA256=PASS VERSION=$version"
          fi
          command -v wp
          wp --info | grep -E 'WP-CLI version'
      - name: Install loopback-only WordPress
        shell: bash
        run: |
          set -euo pipefail
          test -f php/wp-settings.php
          php -l scripts/pse-esc-builder-disposable-wp-rest.php
          wp config create --path=php --dbname=pse_builder_qa --dbuser=pseqa --dbpass=qa-local-only --dbhost=127.0.0.1 --skip-check --quiet
          wp core install --path=php --url=https://127.0.0.1:8099 --title="PSE disposable" --admin_user=pse_qa --admin_password=qa-only --admin_email=qa@example.invalid --skip-email --quiet
          wp plugin activate esc-table esc-visual-builder --path=php --quiet
          # Real PSE REST origin uses pretty /wp-json/wp/v2/posts; default
          # clean WP installs otherwise expose ?rest_route= and fail closed.
          wp rewrite structure '/%postname%/' --path=php --quiet
      - name: Authenticated source Save readback and rollback
        shell: bash
        env:
          PSE_DISPOSABLE_WP: '1'
        run: |
          set -euo pipefail
          export PSE_QA_SCRIPT="$PWD/scripts/pse-esc-builder-disposable-wp-rest.php"
          wp eval 'require getenv("PSE_QA_SCRIPT");' --path=php --quiet
          echo 'PSE_DISPOSABLE_WORDPRESS_QA=PASS; NO_PRODUCTION_CMS_WRITE=PASS; NO_ASTRO_BUILD=PASS'
