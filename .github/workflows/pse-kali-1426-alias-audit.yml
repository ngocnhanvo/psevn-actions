name: PSE Kali 1426 live aliases audit (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-kali-1426-alias-audit.mjs
      - .github/workflows/pse-kali-1426-alias-audit.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-kali-1426-alias-audit.mjs && node scripts/pse-kali-1426-alias-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-kali-1426-alias-audit
          path: artifacts/pse-kali-1426-alias-audit/
          retention-days: 14
