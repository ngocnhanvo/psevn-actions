name: PSE native agriculture knowledge hierarchy and verified article mapping (NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - .pse-agriculture-classify-trigger
permissions:
  contents: read
concurrency:
  group: pse-agriculture-classification
  cancel-in-progress: false
jobs:
  cms:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 26
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-agriculture-classify.mjs && node scripts/pse-agriculture-classify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-agriculture-native-taxonomy
          path: artifacts/pse-agriculture-classification/manifest.json
          retention-days: 14
          if-no-files-found: warn
