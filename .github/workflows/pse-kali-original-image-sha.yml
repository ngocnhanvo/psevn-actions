name: PSE archived original Kali image SHA versus WP Media (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-kali-original-image-sha.mjs
      - .github/workflows/pse-kali-original-image-sha.yml
permissions:
  contents: read
jobs:
  provenance:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/pse-kali-original-image-sha.mjs
      - run: node scripts/pse-kali-original-image-sha.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-kali-original-image-sha
          path: artifacts/pse-kali-image-sha/report.json
          retention-days: 14
          if-no-files-found: ignore
