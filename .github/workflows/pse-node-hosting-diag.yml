name: PSE Node SSR hosting diagnosis (FTP READ ONLY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .pse-node-hosting-diag-trigger
      - .github/workflows/pse-node-hosting-diag.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - name: Read only Node startup markers, Passenger/PM2 routing hints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib,ssl,os,io,re
          from urllib.parse import urlsplit
          raw=os.environ.get('FTP_SERVER','').strip()
          if '://' not in raw:raw='ftp://'+raw
          u=urlsplit(raw)
          if not(u.hostname and u.scheme in ('ftp','ftps') and u.port in (None,21)
                 and not u.username and not u.password and u.path in ('','/')
                 and not u.query and not u.fragment):
              raise SystemExit('PSE_NODE_FTP=HOST_INVALID')
          vals={}
          for line in os.environ.get('ENV_FILE','').splitlines():
              line=line.strip()
              if line.startswith('WC_URL_CLIENT='):
                  vals['front']=line.split('=',1)[1].strip().strip('"').strip("'")
              elif line.startswith('WC_URL='):
                  vals['wp']=line.split('=',1)[1].strip().strip('"').strip("'")
          front=urlsplit(vals.get('front',''))
          wp=urlsplit(vals.get('wp',''))
          def valid_origin(v):
              return (v.scheme=='https' and bool(v.hostname) and not v.username and not v.password
                      and v.port in (None,443) and v.path in ('','/')
                      and not v.query and not v.fragment)
          if not valid_origin(front) or not valid_origin(wp) or wp.hostname==front.hostname:
              raise SystemExit('PSE_NODE_FTP=FRONTEND_ORIGIN_INVALID')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=18)
          root='/domains/'+front.hostname+'/public_html'
          try:
              ftp.connect(u.hostname,u.port or 21,timeout=18)
              ftp.auth()
              ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
              ftp.prot_p()
              ftp.cwd(root)
              assert ftp.pwd().rstrip('/')==root
              print('PSE_NODE_FTP=PASS')
              # Metadata only. Never retrieve, print, checksum or publish .env contents.
              for label,where in (
                  ('PUBLIC_HTML',root),
                  ('DOMAIN_PARENT','/domains/'+front.hostname),
              ):
                  try:
                      ftp.cwd(where)
                      try:
                          size=ftp.size('.env')
                          state='PRESENT' if size is not None else 'UNVERIFIED'
                      except ftplib.error_perm as exc:
                          state='MISSING_OR_UNREADABLE' if str(exc).startswith('550') else 'DENIED'
                      print('PSE_ENVFILE_PRESENCE '+label+'='+state)
                  except ftplib.error_perm:
                      print('PSE_ENVFILE_PRESENCE '+label+'=DIRECTORY_UNAVAILABLE')
                  finally:
                      ftp.cwd(root)
              configured={}
              for line in os.environ.get('ENV_FILE','').splitlines():
                  stripped=line.strip()
                  if stripped.startswith('export '):
                      stripped=stripped[7:].strip()
                  if '=' not in stripped:
                      continue
                  name,value=stripped.split('=',1)
                  if re.fullmatch('[A-Za-z_][A-Za-z0-9_]*',name):
                      configured[name]=bool(value.strip().strip(chr(34)).strip(chr(39)))
              for key in ('WC_URL','WC_URL_CLIENT','WOO_KEY','WOO_SECRET','PUBLIC_PSE_AGENT_ENABLED'):
                  print('PSE_BUILD_SECRET '+key+'='+('PRESENT' if configured.get(key) else 'MISSING_OR_EMPTY'))
              for item in ('server','server/entry.mjs','client','client/index.html',
                           '.htaccess','app.js','server.js','package.json','node_modules',
                           'tmp','tmp/restart.txt','pm2-reload.txt','pse-staging-build.json'):
                  try:
                      status=ftp.size(item)
                      ok=status is not None
                  except (ftplib.error_perm,ftplib.error_temp):
                      # For directories SIZE often returns 550 even if present.
                      try:
                          ftp.cwd(root+'/'+item)
                          ok=True
                      except ftplib.all_errors:
                          ok=False
                  finally:
                      ftp.cwd(root)
                  print('PSE_NODE_MARKER '+item.replace('/','_').replace('.','_')+'='+('PRESENT' if ok else 'MISSING_OR_UNVERIFIED'))
              try:
                  size=ftp.size('.htaccess')
                  if size and size<=32768:
                      output=io.BytesIO()
                      ftp.retrbinary('RETR .htaccess',output.write)
                      rawtxt=output.getvalue().decode('utf8','replace')
                      for directive in ('PassengerEnabled','PassengerAppRoot','PassengerBaseURI','PassengerStartupFile',
                                        'PassengerNodejs','PassengerAppType','PassengerFriendlyErrorPages',
                                        'RewriteEngine','RewriteRule','ProxyPass','SetHandler'):
                          print('PSE_NODE_CONFIG '+directive+'='+('SET' if re.search(r'(?im)^\s*'+directive+r'\b',rawtxt) else 'ABSENT'))
                  else:print('PSE_NODE_CONFIG htaccess=NOT_READABLE')
              except ftplib.all_errors:
                  print('PSE_NODE_CONFIG htaccess=NOT_AVAILABLE')
              print('PSE_NODE_AUDIT=READ_ONLY_PASS')
          except Exception as e:
              print('PSE_NODE_AUDIT=FAIL_'+type(e).__name__)
              raise SystemExit(1)
          finally:
              try:ftp.close()
              except Exception:pass
          PY
