name: PSE market source-verified taxonomy correction (NO ASTRO BUILD)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/pse-market-source-category-correction.mjs'
      - '.github/workflows/pse-market-source-category-correction.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pse-market-source-taxonomy-correction
  cancel-in-progress: false
jobs:
  correct-taxonomy:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-market-source-category-correction.mjs && node scripts/pse-market-source-category-correction.mjs
      - name: Preserve exact previous category assignments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pse-market-category-rollback
          path: docs/reports/pse-market-taxonomy-rollback.json
          if-no-files-found: ignore
          retention-days: 7