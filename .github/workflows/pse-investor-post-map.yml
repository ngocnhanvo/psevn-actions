name: PSE investor legacy-to-WP post category mapping (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.pse-investor-map-trigger]
permissions:
  contents: read
jobs:
  map:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-investor-post-map.mjs && node scripts/pse-investor-post-map.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: pse-investor-subcategories-verified-map, path: artifacts/pse-investor-mapping/audit.json, if-no-files-found: ignore, retention-days: 14}
