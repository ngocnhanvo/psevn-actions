name: PSE Tin tong hop five imported posts and distinct 2024 alias QA (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-tin-tong-hop-five-posts-live-qa.yml
      - scripts/pse-tin-tong-hop-five-posts-live-qa.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-qa:
    if: github.repository == 'ngocnhanvo/psevn-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Assert five WordPress articles, preserved March 2025 article and public Astro listing
        run: node --check scripts/pse-tin-tong-hop-five-posts-live-qa.mjs && node scripts/pse-tin-tong-hop-five-posts-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-tin-tong-hop-five-posts-qa
          path: artifacts/pse-tin-tong-hop-five-posts/
          if-no-files-found: warn
          retention-days: 21
