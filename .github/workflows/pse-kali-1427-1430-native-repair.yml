name: PSE Kali 1430 restore and exact query redirects (GUARDED)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-kali-1427-1430-native-repair.mjs
      - .github/workflows/pse-kali-1427-1430-native-repair.yml
      - .pse-kali-1427-1430-native-repair-request
permissions:
  contents: read
  actions: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-kali-1427-1430-native-repair.mjs
  apply:
    needs: syntax
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'cms(pse): restore Kali 1430 and repair exact links'
    concurrency:
      group: pse-legacy-redirect-native-wordpress
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: pse-kali-1427-1430-source
          path: inputs/proof
          run-id: 44993780995
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: pse-kali-1427-1430-cms-preflight
          path: inputs/preflight
          run-id: 45220040010
          github-token: ${{ github.token }}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Fresh WordPress database backup
        run: node scripts/pse-template-updraft-backup.mjs
      - run: echo "PSE_KALI_FRESH_BACKUP=yes" >> "$GITHUB_ENV"
      - run: node scripts/pse-kali-1427-1430-native-repair.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-kali-1427-1430-native-repair
          path: artifacts/pse-kali-1427-1430-native-repair/
          retention-days: 30
