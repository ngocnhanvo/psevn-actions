name: PSE native complaint WordPress Page draft (NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-complaint-page-stage.mjs
      - .github/workflows/pse-complaint-page-stage.yml
      - .pse-complaint-stage-trigger
permissions:
  contents: read
concurrency:
  group: pse-wordpress-complaint-page
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-complaint-page-stage.mjs && node scripts/pse-complaint-page-stage.mjs
