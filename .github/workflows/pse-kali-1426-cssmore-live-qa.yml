name: PSE Kali WordPress cssmore postdeploy browser QA (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.pse-kali-1426-cssmore-live-qa-request]
permissions:
  contents: read
jobs:
  live-css:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      PSE_KALI_CSSMORE_PREVIEW_ONLY: 'true'
      PSE_KALI_VERIFY_PUBLISHED: 'true'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Assert deployed CSS works without injecting styles
        run: |
          node --check scripts/pse-kali-1426-cssmore-apply.mjs
          node scripts/pse-kali-1426-cssmore-apply.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-kali-cssmore-live-qa
          path: artifacts/pse-kali-1426-cssmore/
          retention-days: 14
          if-no-files-found: ignore
