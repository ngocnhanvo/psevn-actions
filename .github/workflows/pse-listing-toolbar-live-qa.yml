name: PSE listing toolbar normal scroll live QA (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.pse-listing-toolbar-live-trigger]
permissions:
  contents: read
jobs:
  live-scroll:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-listing-toolbar-live-qa.mjs && node scripts/pse-listing-toolbar-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-listing-toolbar-scroll-screenshots
          path: artifacts/pse-listing-toolbar/
          if-no-files-found: ignore
          retention-days: 7
