name: PSE WordPress cssmore ownership correction (BACKUP FIRST)
on:
  push:
    branches: [main]
    paths: [.pse-cssmore-owner-cleanup-request]
permissions:
  contents: read
jobs:
  clean-css-boundaries:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-cssmore-owner-cleanup.mjs && node scripts/pse-cssmore-owner-cleanup.mjs
      - name: Retain pre-change CSS rollback copy privately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pse-cssmore-rollback-private
          path: pse-cssmore-ownership-backup.json
          if-no-files-found: warn
          retention-days: 30
