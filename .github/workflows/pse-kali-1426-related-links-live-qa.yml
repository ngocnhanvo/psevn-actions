name: PSE Kali related links postdeploy live QA (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .pse-kali-1426-related-links-live-qa-request
permissions:
  contents: read
jobs:
  live:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 10
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Check related links in published Kali Page and NPK destination
        run: |
          node --check scripts/pse-kali-1426-related-links-live-qa.mjs
          node scripts/pse-kali-1426-related-links-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-kali-related-links-live-screenshots
          path: artifacts/pse-kali-related-links-live/
          retention-days: 14
          if-no-files-found: ignore
