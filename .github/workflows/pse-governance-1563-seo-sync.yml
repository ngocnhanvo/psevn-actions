name: PSE restore Joomla SEO for governance article 1563 (NO ASTRO BUILD)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-governance-1563-seo-sync.mjs
      - .github/workflows/pse-governance-1563-seo-sync.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pse-governance-seo-single-writer
  cancel-in-progress: false
jobs:
  article:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: pse-governance-2026-independent-parity
          run-id: 44744504960
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/pse-governance-source-proof
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Fresh WP DB-only backup before exact source SEO write
        run: node scripts/pse-template-updraft-backup.mjs
      - run: node --check scripts/pse-governance-1563-seo-sync.mjs && node scripts/pse-governance-1563-seo-sync.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-governance-1563-seo-readback
          path: artifacts/pse-governance-1563-seo/report.json
          if-no-files-found: warn
          retention-days: 14
