name: PSE four Joomla posts WordPress Admin search audit (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-four-post-admin-search-audit.mjs
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Compare native Admin title searches and WordPress post IDs (no writes)
        run: |
          node --check scripts/pse-four-post-admin-search-audit.mjs
          node scripts/pse-four-post-admin-search-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-four-post-admin-search-readonly
          path: artifacts/pse-four-admin-search.json
          retention-days: 7
          if-no-files-found: warn
