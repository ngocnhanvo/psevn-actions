name: PSE #382 newly published WordPress vs Astro SSR route diagnostics (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-382-public-page-readonly-diagnostics.mjs
      - .github/workflows/pse-382-public-page-readonly-diagnostics.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-382-public-page-readonly-diagnostics.mjs
      - run: node scripts/pse-382-public-page-readonly-diagnostics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-382-public-wordpress-vs-astro-route-diagnostics
          path: artifacts/pse-382-live-post-qa/read-only.json
          retention-days: 14
          if-no-files-found: warn
