name: PSE Home_00 desktop and mobile slider postdeploy QA (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.pse-homepage-slider-postdeploy-qa-trigger]
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser client in pinned Playwright image
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify deployed slider functionality without editing site
        run: node --check scripts/pse-home00-production-slider-qa.mjs && node scripts/pse-home00-production-slider-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-home00-live-qa
          path: artifacts/pse-home00
          if-no-files-found: warn
