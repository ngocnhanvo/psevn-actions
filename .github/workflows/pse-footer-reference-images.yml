name: PSE legacy footer image source inspect (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-footer-reference-images.yml
      - scripts/pse-footer-reference-images.mjs
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      PSE_REFERENCE_ORIGIN: https://pse.vn
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-footer-reference-images.mjs && node scripts/pse-footer-reference-images.mjs
