name: PSE nine outstanding Joomla source canonical route audit (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-nine-outstanding-original-live-qa.mjs
      - .github/workflows/pse-nine-outstanding-original-live-qa.yml
permissions: {contents: read}
jobs:
  verify:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-nine-outstanding-original-live-qa.mjs
      - run: node scripts/pse-nine-outstanding-original-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-nine-outstanding-live-route-diagnostics
          path: artifacts/pse-nine-unresolved-live-paths/report.json
          retention-days: 30
          if-no-files-found: warn
