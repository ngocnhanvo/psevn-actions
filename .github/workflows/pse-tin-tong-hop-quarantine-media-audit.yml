name: PSE Tin tong hop historical media blockers audit (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-tin-tong-hop-quarantine-media-audit.yml
      - scripts/pse-tin-tong-hop-quarantine-media-audit.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-media:
    if: github.repository == 'ngocnhanvo/psevn-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 24
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-tin-tong-hop-quarantine-media-audit.mjs && node scripts/pse-tin-tong-hop-quarantine-media-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-tin-tong-hop-media-blockers
          path: artifacts/pse-tin-tong-hop-media-blockers/
          if-no-files-found: warn
          retention-days: 21
