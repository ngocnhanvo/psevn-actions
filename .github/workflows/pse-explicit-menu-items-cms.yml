name: PSE migrate generated View all links to native WP menu items
on:
  push:
    branches: [main]
    paths: [.pse-explicit-menu-items-cms-request]
permissions:
  contents: read
concurrency:
  group: pse-native-menu-items
  cancel-in-progress: false
jobs:
  cms:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-explicit-menu-items-cms.mjs && node scripts/pse-explicit-menu-items-cms.mjs
