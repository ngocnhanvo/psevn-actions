name: PSE shared footer postdeploy QA (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .pse-footer-postdeploy-qa-trigger
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-footer-postdeploy-qa.mjs && node scripts/pse-footer-postdeploy-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-footer-desktop-mobile-screenshots
          path: artifacts/pse-footer-postdeploy
          if-no-files-found: ignore
          retention-days: 7
