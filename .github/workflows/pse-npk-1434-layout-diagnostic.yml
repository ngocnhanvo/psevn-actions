name: PSE NPK historical Page layout analysis (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-npk-1434-layout-diagnostic.mjs
      - .github/workflows/pse-npk-1434-layout-diagnostic.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 10
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install matching Playwright driver, without browser download
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Inspect current WordPress source and production DOM
        run: |
          node --check scripts/pse-npk-1434-layout-diagnostic.mjs
          node scripts/pse-npk-1434-layout-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-npk-1434-layout-diagnostic
          path: artifacts/npk-1434-layout/
          retention-days: 7
          if-no-files-found: ignore
