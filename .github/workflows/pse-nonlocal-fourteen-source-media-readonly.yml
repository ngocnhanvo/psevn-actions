name: PSE fourteen original Joomla non-local media and created-day source proof (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-nonlocal-fourteen-source-media-readonly.mjs
      - .github/workflows/pse-nonlocal-fourteen-source-media-readonly.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify original Joomla required media URLs bytes and source CREATED day
        run: node --check scripts/pse-nonlocal-fourteen-source-media-readonly.mjs && node scripts/pse-nonlocal-fourteen-source-media-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-fourteen-original-remote-media-source-evidence
          path: artifacts/pse-nonlocal-fourteen/report.json
          retention-days: 30
          if-no-files-found: warn
