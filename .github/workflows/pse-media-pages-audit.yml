name: PSE media, contact and complaint source/live audit (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-media-pages-audit.mjs
      - .github/workflows/pse-media-pages-audit.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-media-pages-audit.mjs && node scripts/pse-media-pages-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: pse-media-contact-source-inventory, path: artifacts/pse-media-pages/audit.json, if-no-files-found: warn, retention-days: 14}
