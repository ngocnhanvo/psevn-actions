name: PSE disclosure quarantined source evidence (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - "scripts/pse-disclosure-recovery-evidence.mjs"
      - ".github/workflows/pse-disclosure-recovery-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-evidence:
    if: github.repository == 'ngocnhanvo/psevn-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify original source records without CMS modification
        run: node --check scripts/pse-disclosure-recovery-evidence.mjs && node scripts/pse-disclosure-recovery-evidence.mjs
      - name: Upload source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pse-disclosure-quarantined-evidence
          path: artifacts/pse-disclosure-recovery/source.json
          if-no-files-found: warn
          retention-days: 14
