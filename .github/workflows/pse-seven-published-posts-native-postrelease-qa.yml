name: PSE seven published original Posts native postrelease browser QA (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-seven-published-posts-native-postrelease-qa.yml
      - scripts/pse-seven-published-posts-native-postrelease-qa.mjs
permissions:
  contents: read
concurrency:
  group: pse-seven-post-native-readonly
  cancel-in-progress: false
jobs:
  browser:
    if: github.repository == 'ngocnhanvo/psevn-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Assert 7 native published Posts 46 images and 14 responsive views without unavailable Joomla
        run: node --check scripts/pse-seven-published-posts-native-postrelease-qa.mjs && node scripts/pse-seven-published-posts-native-postrelease-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-seven-original-posts-native-postrelease
          path: artifacts/pse-seven-post-native-postrelease/report.json
          retention-days: 30
          if-no-files-found: warn
