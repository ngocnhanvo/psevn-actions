name: PSE 98 original Joomla gallery images live QA (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.pse-gallery-989-live-qa-request]
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-gallery-989-live-qa.mjs && node scripts/pse-gallery-989-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-gallery-989-production-acceptance
          path: artifacts/pse-gallery-989-live/report.json
          if-no-files-found: ignore
          retention-days: 14
