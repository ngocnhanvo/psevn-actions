name: PSE two historical Kali original exact 301 (GUARDED)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-kali-two-historical-native-redirects.mjs
      - .github/workflows/pse-kali-two-historical-native-redirects.yml
      - .pse-kali-two-historical-native-redirects-request
permissions:
  contents: read
  actions: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-kali-two-historical-native-redirects.mjs
  apply:
    needs: syntax
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'cms(pse): redirect two verified historical Kali pages'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pse-legacy-redirect-native-wordpress
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: pse-kali-legacy-native-page-source-proof
          path: inputs/source
          run-id: 44990978357
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: pse-kali-two-historical-native-pages
          path: inputs/applied
          run-id: 44992141050
          github-token: ${{ github.token }}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Fresh database backup before exact historical URL redirects
        run: node scripts/pse-template-updraft-backup.mjs
      - run: echo "PSE_KALI_FRESH_BACKUP=yes" >> "$GITHUB_ENV"
      - run: node scripts/pse-kali-two-historical-native-redirects.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-kali-two-historical-native-redirects
          path: artifacts/pse-kali-two-historical-native-redirects/
          retention-days: 30
          if-no-files-found: warn
