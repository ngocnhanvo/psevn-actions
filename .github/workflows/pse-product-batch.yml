name: PSE original fertilizer native Product batches (NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - .pse-product-batch-trigger
permissions:
  contents: read
concurrency:
  group: pse-original-product-import
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 44
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Import original product records (existing workflow)
        if: ${{ !startsWith(github.event.head_commit.message, 'audit(pse): product content parity dry-run') && !startsWith(github.event.head_commit.message, 'cms(pse): restore verified fertilizer descriptions batch ') }}
        run: node --check scripts/pse-product-batch.mjs && node scripts/pse-product-batch.mjs
      - name: Restore verified product descriptions (separate from original imports)
        if: ${{ startsWith(github.event.head_commit.message, 'audit(pse): product content parity dry-run') || startsWith(github.event.head_commit.message, 'cms(pse): restore verified fertilizer descriptions batch ') }}
        run: node --check scripts/pse-product-description-repair.mjs && node scripts/pse-product-description-repair.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-product-batch-manifest
          path: |
            artifacts/pse-product-batch/manifest.json
            artifacts/pse-product-batch/product-description-repair.json
          retention-days: 14
          if-no-files-found: warn
