name: PSE ESC Visual Builder native-cell contract (NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-esc-builder-schema-ci.yml
      - .pse-esc-builder-schema-test-request
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cell-contract:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout WordPress PHP master (source only)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: php
          persist-credentials: false
      - name: Validate ESC Visual Builder PHP and native-cell discovery
        shell: bash
        run: |
          set -euo pipefail
          for file in php/wp-content/plugins/esc-visual-builder/esc-visual-builder.php \
            php/wp-content/plugins/esc-visual-builder/includes/*.php; do
            php -l "$file"
          done
          php php/wp-content/plugins/esc-visual-builder/tests/auto-discovery.test.php
          php php/wp-content/plugins/esc-visual-builder/tests/shared-menu-source.test.php
      - name: Checkout Astro development source (source only)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: github
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: astro
          persist-credentials: false
      - name: Install Node and pnpm (no website build)
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: astro/pnpm-lock.yaml
      - name: Test dynamic text binding and retained media mapping (NO BUILD)
        working-directory: astro
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline
          pnpm exec vitest run src/lib/wordpress/builderHeaderNavLock.test.ts src/lib/wordpress/builderEditabilityCues.test.ts src/lib/wordpress/builderFooterSelection.test.ts src/lib/wordpress/builderAutoText.test.mjs src/lib/wordpress/builderAutoDiscovery.test.mjs src/lib/wordpress/builderCustomerSlider.test.mjs src/astro/tablepress/Home_00.mobile.test.ts src/astro/tablepress/Pse_support.cssOwnership.test.ts
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createRequire} from 'node:module';
          import {pathToFileURL} from 'node:url';
          const require=createRequire(import.meta.url);
          const astroRequire=createRequire(require.resolve('astro/package.json'));
          const compiler=await import(pathToFileURL(astroRequire.resolve('@astrojs/compiler')).href);
          const path='src/pages/esc-builder/preview/[pageId].astro';
          await compiler.transform(await readFile(path,'utf8'),{filename:path});
          for (const other of ['src/astro/tablepress/Pse_hotline.astro','src/astro/tablepress/Pse_faq.astro','src/astro/components/Layout/Footer.astro','src/astro/components/Menu/Desktop.astro','src/astro/components/Menu/DesktopBranch.astro','src/astro/components/Menu/MobileBranch.astro']) {
            await compiler.transform(await readFile(other,'utf8'),{filename:other});
          }
          console.log('ESC_BUILDER_ASTRO_PARSE=PASS');
          NODE
          # Compile only Tailwind CSS utilities, not the Astro website.
          pnpm exec tailwindcss -c tailwind.config.mjs -i src/styles/global.css -o /tmp/pse-esc-source-tailwind.css --minify
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const css=readFileSync('/tmp/pse-esc-source-tailwind.css','utf8');
          for(const token of ['grid-template-columns:repeat(auto-fit','padding:clamp(22px,3vw,34px)','border-radius:23px']){
            if(!css.includes(token))throw Error('Tailwind utility missing: '+token);
          }
          console.log('PSE_ESC_TAILWIND_SOURCE_COMPILE=PASS no_website_build=true');
          NODE
          echo 'PSE_ESC_BUILDER_SCHEMA_CI=PASS; NO_BUILD=PASS; NO_FTP=PASS'
