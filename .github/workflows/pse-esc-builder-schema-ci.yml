name: PSE ESC Visual Builder native-cell contract (NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-esc-builder-schema-ci.yml
      - .pse-esc-builder-schema-test-request
      - scripts/pse-esc-builder-menu-inspector.test.mjs
      - scripts/pse-esc-builder-footer-assets-inspector.test.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cell-contract:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout PSE Actions test scripts (source only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout WordPress PHP master (source only)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: php
          persist-credentials: false
      - name: Validate ESC Visual Builder PHP and native-cell discovery
        shell: bash
        run: |
          set -euo pipefail
          for file in php/wp-content/plugins/esc-visual-builder/esc-visual-builder.php \
            php/wp-content/plugins/esc-visual-builder/includes/*.php; do
            php -l "$file"
          done
          php php/wp-content/plugins/esc-visual-builder/tests/items-and-sections.test.php
          php php/wp-content/plugins/esc-visual-builder/tests/item-manual-reference-auth.test.php
          php php/wp-content/plugins/esc-visual-builder/tests/auto-discovery.test.php
          php php/wp-content/plugins/esc-visual-builder/tests/text-href.test.php
          php php/wp-content/plugins/esc-visual-builder/tests/text-ui-script.test.php > /tmp/pse-builder-text-ui.js
          node --check /tmp/pse-builder-text-ui.js
          php php/wp-content/plugins/esc-visual-builder/tests/shared-menu-source.test.php
          php php/wp-content/plugins/esc-visual-builder/tests/shared-footer-source.test.php
          php php/wp-content/plugins/esc-visual-builder/tests/shared-footer-media-source.test.php
          php php/wp-content/plugins/esc-visual-builder/tests/shared-footer-assets-source.test.php
          php php/wp-content/plugins/esc-visual-builder/tests/item-ui-script.test.php > /tmp/pse-builder-item-ui.js
          node --check /tmp/pse-builder-item-ui.js
          php php/wp-content/plugins/esc-visual-builder/tests/image-ui-script.test.php > /tmp/pse-builder-image-ui.js
          node --check /tmp/pse-builder-image-ui.js
          node php/wp-content/plugins/esc-visual-builder/tests/item-ui-ticket.test.cjs /tmp/pse-builder-item-ui.js
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const js=readFileSync('/tmp/pse-builder-item-ui.js','utf8');
          for (const token of ['BUILDER_GAP','esc-vb-item-pick-start','esc-vb-item-sort-preview-ack']) {
            if (!js.includes(token)) throw Error('Missing guarded item picker: '+token);
          }
          for (const forbidden of ['renderSortList(', 'fallbackPicker', 'sortList.', 'chooseItemSource(']) {
            if (js.includes(forbidden)) throw Error('Unsafe list fallback remains: '+forbidden);
          }
          console.log('PSE_DIRECT_PREVIEW_SWAP_ONLY=PASS');
          JS
      - name: Checkout Astro master source (source only)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: astro
          persist-credentials: false
      - name: Install Node and pnpm (no website build)
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: astro/pnpm-lock.yaml
      - name: Parse WordPress Builder inspector inline JavaScript (NO BUILD)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          for(const file of [
            'php/wp-content/plugins/esc-visual-builder/includes/shared-menu-ui.php',
            'php/wp-content/plugins/esc-visual-builder/includes/shared-footer-ui.php',
            'php/wp-content/plugins/esc-visual-builder/includes/shared-footer-media-ui.php',
            'php/wp-content/plugins/esc-visual-builder/includes/shared-footer-assets-ui.php'
          ]){
            const content=readFileSync(file,'utf8');
            const scripts=[...content.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/g)];
            if(scripts.length!==1)throw Error('Expected one inspector script: '+file);
            // PHP injects a JSON config object at runtime. Use an inert
            // object literal so this source-only check validates JS syntax.
            const js=scripts[0][1].replace(/<\?php[\s\S]*?\?>/g,'{}');
            new Function(js);
            console.log('ESC_BUILDER_INSPECTOR_JS_PARSE=PASS '+file);
          }
          NODE
      - name: Test dynamic text binding and retained media mapping (NO BUILD)
        working-directory: astro
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline
          node ../scripts/pse-esc-builder-menu-inspector.test.mjs
          node ../scripts/pse-esc-builder-footer-assets-inspector.test.mjs
          pnpm exec vitest run src/lib/wordpress/builderHeaderNavLock.test.ts src/lib/wordpress/builderEditabilityCues.test.ts src/lib/wordpress/builderSectionDrafts.test.ts src/lib/wordpress/tablepress/builderCollectionMode.test.ts src/lib/wordpress/tablepress/siteLocalPostReferences.test.ts src/lib/wordpress/builderFooterSelection.test.ts src/lib/wordpress/tablepress/pseFooterAssets.test.ts src/lib/wordpress/builderAutoText.test.mjs src/lib/wordpress/builderLinkDraft.test.mjs src/lib/wordpress/tablepress/sourceOwnedHref.test.ts src/lib/wordpress/tablepress/stripEscTableEditorPreviews.test.ts src/lib/wordpress/posts/pseNewsQueryConfig.test.ts src/lib/wordpress/builderAutoDiscovery.test.mjs src/lib/wordpress/builderCustomerSlider.test.mjs src/astro/tablepress/Home_02_09.builderSource.test.ts src/astro/tablepress/Home_00.mobile.test.ts src/lib/seo/pseHistoryTable.test.ts src/lib/seo/pseNativeContactSections.test.ts src/lib/seo/pseAwardsTable.test.ts src/lib/seo/pseVisionMission.test.ts src/astro/tablepress/Pse_01.sourceOwnership.test.ts src/astro/tablepress/Pse_previewParity.test.ts src/astro/tablepress/Pse_03.sourceCoordinates.test.ts src/astro/tablepress/Pse_faq.sourceOwnership.test.ts src/astro/tablepress/Pse_02.sourceOwnership.test.ts src/astro/tablepress/Pse_00.sourceOwnership.test.ts src/astro/tablepress/Pse_hotline.sourceOwnership.test.ts src/astro/tablepress/Pse_support.cssOwnership.test.ts
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createRequire} from 'node:module';
          import {pathToFileURL} from 'node:url';
          const require=createRequire(import.meta.url);
          const astroRequire=createRequire(require.resolve('astro/package.json'));
          const compiler=await import(pathToFileURL(astroRequire.resolve('@astrojs/compiler')).href);
          const path='src/pages/esc-builder/preview/[pageId].astro';
          await compiler.transform(await readFile(path,'utf8'),{filename:path});
          for (const other of ['src/astroutils/ExtractHTML.astro','src/astro/tablepress/Pse_hotline.astro','src/astro/tablepress/Pse_faq.astro','src/astro/tablepress/Pse_history.astro','src/astro/tablepress/Pse_02.astro','src/astro/tablepress/Pse_contact_warehouses.astro','src/astro/tablepress/Pse_contact_office.astro','src/astro/tablepress/Pse_awards.astro','src/astro/tablepress/Pse_vision.astro','src/astro/tablepress/Pse_00.astro','src/astro/tablepress/Pse_01.astro','src/astro/tablepress/Pse_02.astro','src/astro/tablepress/Pse_03.astro','src/astro/tablepress/Pse_faq.astro','src/astro/tablepress/Pse_hotline.astro','src/astro/tablepress/Home_04.astro','src/astro/tablepress/Home_05.astro','src/astro/tablepress/Home_06.astro','src/astro/tablepress/Home_07.astro','src/astro/tablepress/Home_08.astro','src/astro/tablepress/Home_02.astro','src/astro/tablepress/Home_09.astro','src/astro/tablepress/Home_11.astro','src/astro/tablepress/Home_13.astro','src/astro/components/Contact/PseContactLocationCard.astro','src/astro/components/Layout/Footer.astro','src/astro/components/Menu/Desktop.astro','src/astro/components/Menu/DesktopBranch.astro','src/astro/components/Menu/MobileBranch.astro']) {
            await compiler.transform(await readFile(other,'utf8'),{filename:other});
          }
          for (const file of [
            'src/astro/tablepress/Pse_faq.astro',
            'src/astro/tablepress/Pse_hotline.astro',
            'src/astro/tablepress/Pse_contact_warehouses.astro',
            'src/astro/tablepress/Pse_contact_office.astro',
            'src/astro/tablepress/Pse_awards.astro',
            'src/astro/tablepress/Pse_vision.astro',
            'src/astro/tablepress/Pse_history.astro',
            'src/astro/tablepress/Pse_02.astro'
          ]) {
            const source = await readFile(file, 'utf8');
            if (!source.includes('data-esc-builder-row={item.sourceRow}') &&
                !source.includes('sourceRow={sourceRow}') &&
                !/data-esc-builder-row=\{previewMode\?[a-zA-Z]+\.sourceRow:undefined\}/.test(source)) {
              throw Error('Missing canonical ESC row identity: ' + file);
            }
          }
          const directCards = [
            ['src/astro/tablepress/Pse_00.astro', 'data-esc-builder-row={slide.sourceRow}'],
            ['src/astro/tablepress/Home_09.astro', 'data-esc-builder-row={index}'],
            ['src/astro/tablepress/Home_11.astro', 'data-esc-builder-row={index}'],
            ['src/astro/tablepress/Home_13.astro', 'data-esc-builder-row={index}']
          ];
          for (const [file, marker] of directCards) {
            if (!(await readFile(file, 'utf8')).includes(marker))
              throw Error('Missing directly selectable slide/card marker: '+file);
          }
          const heroSource = await readFile('src/astro/tablepress/Pse_00.astro','utf8');
          if (heroSource.includes('data-esc-builder-image-row={slide.sourceRow}'))
            throw Error('Hero Media must not advertise editing without verified original ESC cell coordinates');
          console.log('PSE_ESC_NATIVE_SOURCE_ROW_MARKERS=PASS');
          console.log('ESC_BUILDER_ASTRO_PARSE=PASS');
          NODE
          # Compile only Tailwind CSS utilities, not the Astro website.
          pnpm exec tailwindcss -c tailwind.config.mjs -i src/styles/global.css -o /tmp/pse-esc-source-tailwind.css --minify
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const css=readFileSync('/tmp/pse-esc-source-tailwind.css','utf8');
          for(const token of ['grid-template-columns:repeat(auto-fit','padding:clamp(22px,3vw,34px)','border-radius:23px']){
            if(!css.includes(token))throw Error('Tailwind utility missing: '+token);
          }
          console.log('PSE_ESC_TAILWIND_SOURCE_COMPILE=PASS no_website_build=true');
          NODE
          echo 'PSE_ESC_BUILDER_SCHEMA_CI=PASS; NO_BUILD=PASS; NO_FTP=PASS'
