name: PSE #382 original 3/3 photos native Post publish with exact redirect (GUARDED)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-382-three-originals-native-publication.mjs
      - .github/workflows/pse-382-three-originals-native-publication.yml
      - .pse-382-three-originals-native-publication-request
permissions:
  contents: read
jobs:
  syntax:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-382-three-originals-native-publication.mjs
  publish:
    needs: syntax
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'cms(pse): publish Joomla 382 after all three exact original media verified'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: pse-legacy-article-migration-single-writer
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Fresh WordPress Updraft rollback snapshot BEFORE public Post and redirect writes
        run: node --check scripts/pse-template-updraft-backup.mjs && node scripts/pse-template-updraft-backup.mjs
      - run: echo "PSE_382_RELEASE_BACKUP_READY=yes" >> "$GITHUB_ENV"
      - name: Publish only Joomla 382 with exact three photo SHA proof and WordPress 301
        run: node scripts/pse-382-three-originals-native-publication.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-382-original-three-images-publish-url-redirect-proof
          path: artifacts/pse-382-exact-source-publication/report.json
          retention-days: 30
          if-no-files-found: warn
