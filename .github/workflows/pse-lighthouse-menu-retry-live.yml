name: PSE Lighthouse retry only transient NO_NAVSTART menu measurements (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.pse-lighthouse-menu-retry-trigger]
permissions:
  contents: read
jobs:
  retry:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0 lighthouse@13.0.1
      - name: Re-measure only three Lighthouse NO_NAVSTART failures from run 40542508873
        run: node --check scripts/pse-lighthouse-menu-retry-live.mjs && node scripts/pse-lighthouse-menu-retry-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-menu-lighthouse-transient-retry
          path: artifacts/pse-lighthouse-menu-retry/
          if-no-files-found: warn
          retention-days: 14
