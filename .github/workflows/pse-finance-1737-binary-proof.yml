name: PSE finance 1737 original versus local PDF SHA proof (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.github/workflows/pse-finance-1737-binary-proof.yml]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-finance-1737-binary-proof.mjs && node scripts/pse-finance-1737-binary-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-finance-1737-binary-proof
          path: artifacts/pse-finance-1737-binary/report.json
          if-no-files-found: warn
          retention-days: 14
