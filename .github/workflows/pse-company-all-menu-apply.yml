name: PSE native company View all first menu CMS apply and verify
on:
  push:
    branches: [main]
    paths: [.pse-company-all-menu-apply-request]
permissions:
  contents: read
concurrency:
  group: pse-native-menu-items
  cancel-in-progress: false
jobs:
  menu:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Create or verify the native company submenu item and first position
        run: node --check scripts/pse-company-all-menu-apply.mjs && node scripts/pse-company-all-menu-apply.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-company-news-menu
          path: artifacts/pse-company-news/native-menu.json
          retention-days: 7
          if-no-files-found: warn
