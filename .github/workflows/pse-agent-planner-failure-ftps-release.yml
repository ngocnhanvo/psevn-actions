name: PSE Agent planner-failure boundary FTPS release (NO ASTRO BUILD)

on:
  push:
    branches: [main]
    paths:
      - .pse-agent-planner-failure-release-request

permissions:
  contents: read

concurrency:
  group: pse-agent-planner-failure-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Checkout reviewed PSE PHP master
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false

      - name: Validate exact planner-failure source contract
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(git -C source-php rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "PSE_AGENT_PLANNER_FAILURE_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"

          files=(
            "wp-content/mu-plugins/esc-agent/src/Core/Planner.php"
            "wp-content/mu-plugins/esc-agent/src/Core/TelemetryPlanner.php"
            "wp-content/mu-plugins/esc-agent/src/Core/KnowledgeAwarePlanner.php"
            "wp-content/mu-plugins/esc-agent/src/Core/PlanValidator.php"
            "wp-content/mu-plugins/esc-agent/src/Core/Agent.php"
          )

          for rel in "${files[@]}"; do
            test -s "source-php/$rel"
            php -l "source-php/$rel" >/dev/null
          done

          test_file="source-php/wp-content/mu-plugins/esc-agent/tests/planner-failure-boundary.php"
          test -s "$test_file"
          php -l "$test_file" >/dev/null

          grep -Fq "'planner_status' => 'failed'" source-php/wp-content/mu-plugins/esc-agent/src/Core/TelemetryPlanner.php
          grep -Fq "'failure_reason' => $lastReason" source-php/wp-content/mu-plugins/esc-agent/src/Core/TelemetryPlanner.php
          grep -Fq "($plan['planner_status'] ?? '') === 'failed'" source-php/wp-content/mu-plugins/esc-agent/src/Core/KnowledgeAwarePlanner.php
          grep -Fq "($planResponse['planner_status'] ?? '') === 'failed'" source-php/wp-content/mu-plugins/esc-agent/src/Core/Agent.php
          grep -Fq "'result' => 'planner_failed'" source-php/wp-content/mu-plugins/esc-agent/src/Core/Agent.php

          echo "PSE_AGENT_PLANNER_FAILURE_SOURCE_PREFLIGHT=PASS files=5"

      - name: Run planner-failure regression suite
        working-directory: source-php
        shell: bash
        run: |
          set -euo pipefail
          php wp-content/mu-plugins/esc-agent/tests/planner-failure-boundary.php
          php wp-content/mu-plugins/esc-agent/tests/llm-telemetry.php
          php wp-content/mu-plugins/esc-agent/tests/llm-first-all-intents.php
          php wp-content/mu-plugins/esc-agent/tests/plan-validator.php
          echo "PSE_AGENT_PLANNER_FAILURE_REGRESSIONS=PASS"

      - name: Validate PSE WordPress FTPS identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ENV_FILE"
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"

          wp_origin="$(php -r '
            $text = getenv("ENV_FILE") ?: "";
            $urls = [];
            foreach (preg_split("/\\R/", $text) as $line) {
                $line = trim($line);
                if (str_starts_with($line, "export ")) $line = trim(substr($line, 7));
                if (str_starts_with($line, "WC_URL=")) $urls[] = trim(trim(substr($line, 7)), "\"\x27");
            }
            if (count($urls) !== 1) exit(2);
            $p = parse_url($urls[0]);
            if (!is_array($p) || ($p["scheme"] ?? "") !== "https"
                || ($p["host"] ?? "") !== "admin-pse.webnvn.com"
                || isset($p["user"]) || isset($p["pass"]) || isset($p["query"]) || isset($p["fragment"])
                || (isset($p["port"]) && (int)$p["port"] !== 443)
                || (($p["path"] ?? "") !== "" && ($p["path"] ?? "") !== "/")) exit(3);
            echo "https://admin-pse.webnvn.com";
          ')"
          test "$wp_origin" = "https://admin-pse.webnvn.com"
          echo "PSE_WP_ORIGIN=$wp_origin" >> "$GITHUB_ENV"

          raw="$FTP_SERVER"
          raw="${raw#ftp://}"
          raw="${raw#ftps://}"
          raw="${raw%/}"
          [[ "$raw" != *"/"* && "$raw" != *"@"* && "$raw" != *"?"* && "$raw" != *"#"* ]]

          if [[ "$raw" == *:* ]]; then
            ftp_host="${raw%%:*}"
            ftp_port="${raw##*:}"
            test "$ftp_port" = "21"
          else
            ftp_host="$raw"
            ftp_port="21"
          fi

          [[ "$ftp_host" =~ ^[A-Za-z0-9.-]+$ ]]
          echo "PSE_FTP_HOST=$ftp_host" >> "$GITHUB_ENV"
          echo "PSE_FTP_PORT=$ftp_port" >> "$GITHUB_ENV"
          echo "PSE_FTP_ROOT=/domains/admin-pse.webnvn.com/public_html" >> "$GITHUB_ENV"

          curl --fail --show-error --silent --ssl-reqd \
            --connect-timeout 20 --max-time 60 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://$ftp_host:$ftp_port/domains/admin-pse.webnvn.com/public_html/wp-load.php" \
            --output "$RUNNER_TEMP/pse-wp-load.php"

          test -s "$RUNNER_TEMP/pse-wp-load.php"
          echo "PSE_AGENT_PLANNER_FAILURE_FTPS_IDENTITY=PASS"

      - name: Upload exact five PHP files with readback and rollback
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "wp-content/mu-plugins/esc-agent/src/Core/Planner.php"
            "wp-content/mu-plugins/esc-agent/src/Core/TelemetryPlanner.php"
            "wp-content/mu-plugins/esc-agent/src/Core/KnowledgeAwarePlanner.php"
            "wp-content/mu-plugins/esc-agent/src/Core/PlanValidator.php"
            "wp-content/mu-plugins/esc-agent/src/Core/Agent.php"
          )

          ftp_base="ftp://$PSE_FTP_HOST:$PSE_FTP_PORT"
          curl_common=(
            --fail --show-error --silent --ssl-reqd
            --connect-timeout 20 --max-time 90
            --user "$FTP_USERNAME:$FTP_PASSWORD"
          )

          fetch_remote() {
            curl "${curl_common[@]}" "$ftp_base$1" --output "$2"
          }

          upload_remote() {
            curl "${curl_common[@]}" --ftp-create-dirs --upload-file "$1" "$ftp_base$2"
          }

          restore_original() {
            upload_remote "$1" "$2"
            fetch_remote "$2" "$3"
            test "$(sha256sum "$1" | awk '{print $1}')" = "$(sha256sum "$3" | awk '{print $1}')"
          }

          installed=0
          matched=0
          for rel in "${files[@]}"; do
            src="source-php/$rel"
            remote="$PSE_FTP_ROOT/$rel"
            safe="${rel//\//__}"
            before="$RUNNER_TEMP/$safe.before"
            verify="$RUNNER_TEMP/$safe.verify"
            rollback_verify="$RUNNER_TEMP/$safe.rollback-verify"
            backup="/domains/admin-pse.webnvn.com/.pse-php-rollback/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${safe}.backup"

            fetch_remote "$remote" "$before"
            expected="$(sha256sum "$src" | awk '{print $1}')"
            current="$(sha256sum "$before" | awk '{print $1}')"

            if [[ "$current" == "$expected" ]]; then
              matched=$((matched + 1))
              echo "PSE_AGENT_PLANNER_FAILURE_FTPS_MATCH file=$rel"
              continue
            fi

            upload_remote "$before" "$backup"
            if ! upload_remote "$src" "$remote"; then
              restore_original "$before" "$remote" "$rollback_verify" || true
              exit 1
            fi
            if ! fetch_remote "$remote" "$verify"; then
              restore_original "$before" "$remote" "$rollback_verify" || true
              exit 1
            fi
            if [[ "$(sha256sum "$verify" | awk '{print $1}')" != "$expected" ]]; then
              restore_original "$before" "$remote" "$rollback_verify"
              exit 1
            fi

            installed=$((installed + 1))
            echo "PSE_AGENT_PLANNER_FAILURE_FTPS_INSTALLED file=$rel sha256=PASS"
          done

          echo "PSE_AGENT_PLANNER_FAILURE_FTPS_RELEASE=PASS installed=$installed matched=$matched"
          echo "NO_ASTRO_BUILD=PASS"

      - name: Release summary
        shell: bash
        run: |
          {
            echo "### PSE Agent planner-failure boundary release"
            echo "- Source: $PSE_AGENT_PLANNER_FAILURE_SOURCE_SHA from ngocnhanvo/psevn-php@master"
            echo "- Files: 5 exact Core PHP files"
            echo "- Regression: planner failure stops before PlanValidator/Skill fallback"
            echo "- Transport: curl explicit FTPS with SHA-256 readback"
            echo "- Rollback: backup outside public_html"
            echo "- Astro build: not triggered"
          } >> "$GITHUB_STEP_SUMMARY"
