name: PSE native WordPress photo album verified pilot (NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-photo-album-pilot.mjs
      - .github/workflows/pse-photo-album-pilot.yml
      - .pse-photo-album-pilot-trigger
      - scripts/pse-photo-album-batch.mjs
      - .pse-photo-album-batch-trigger
permissions:
  contents: read
concurrency:
  group: pse-wp-photo-import
  cancel-in-progress: false
jobs:
  pilot:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-photo-album-pilot.mjs && node --check scripts/pse-photo-album-batch.mjs
      - name: Bounded original photo album pilot only when requested
        if: >-
          github.event.head_commit.message == 'cms(pse): import verified three-photo album pilot'
        run: node scripts/pse-photo-album-pilot.mjs
      - name: Resumable verified legacy album batch
        if: >-
          startsWith(github.event.head_commit.message, 'cms(pse): gallery ') ||
          startsWith(github.event.head_commit.message, 'audit(pse): gallery ')
        run: node scripts/pse-photo-album-batch.mjs
