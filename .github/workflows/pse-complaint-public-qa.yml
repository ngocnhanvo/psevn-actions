name: PSE published complaint form responsive QA (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .pse-complaint-public-qa-request
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-complaint-public-qa.mjs && node scripts/pse-complaint-public-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-complaint-live-responsive
          path: artifacts/pse-complaint-live/
          if-no-files-found: ignore
          retention-days: 7
