name: PSE historical Joomla Post 379 created-day evidence (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-379-joomla-created-date-evidence.mjs
      - .github/workflows/pse-379-joomla-created-date-evidence.yml
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-379-joomla-created-date-evidence.mjs && node scripts/pse-379-joomla-created-date-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-379-exact-date-evidence
          path: artifacts/pse-original-379-date/report.json
          retention-days: 14
          if-no-files-found: ignore
