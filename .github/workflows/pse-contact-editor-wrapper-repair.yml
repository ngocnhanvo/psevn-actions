name: PSE native Contact ESC image-block editor (guarded NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-contact-editor-wrapper-repair.yml
      - scripts/pse-contact-editor-wrapper-repair.mjs
      - .pse-contact-editor-wrapper-request
permissions:
  contents: read
concurrency:
  group: pse-contact-native-content-writer
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      PSE_CONTACT_WRAPPER_APPLY: "${{ github.event.head_commit.message == 'cms(pse): correct nested WordPress Contact ESC preview wrapper' }}"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-contact-editor-wrapper-repair.mjs && node scripts/pse-contact-editor-wrapper-repair.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-contact-native-editor-evidence
          path: artifacts/pse-contact-native-editor/
          if-no-files-found: warn
          retention-days: 14
