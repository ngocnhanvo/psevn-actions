name: PSE two source-proven shareholder exact original Joomla 301 (GUARDED)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-investor-two-notices-301-native.mjs
      - .github/workflows/pse-investor-two-notices-301-native.yml
      - .pse-investor-two-notices-301-request
permissions:
  contents: read
  actions: read
jobs:
  syntax:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.event.head_commit.message != 'cms(pse): redirect two exact original shareholder notices 338 and 1085'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-investor-two-notices-301-native.mjs
  apply:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'cms(pse): redirect two exact original shareholder notices 338 and 1085'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: pse-legacy-article-migration-single-writer
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Fresh Updraft native WP database rollback
        run: node --check scripts/pse-template-updraft-backup.mjs && node scripts/pse-template-updraft-backup.mjs
      - name: Authorize only original shareholder routes after DB backup verified
        run: echo "PSE_TWO_INVESTOR_301_BACKUP_VERIFIED=yes" >> "$GITHUB_ENV"
      - name: Save exactly two source-owned WordPress redirects with readback
        run: node --check scripts/pse-investor-two-notices-301-native.mjs && node scripts/pse-investor-two-notices-301-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-source-338-1085-exact-301-wordpress
          path: artifacts/pse-original-investor-301/
          retention-days: 30
          if-no-files-found: warn
