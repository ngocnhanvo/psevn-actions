name: PSE Joomla 202 exact original publisher JPEG historical host variants (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-202-historical-publisher-variants-readonly.mjs
      - .github/workflows/pse-202-publisher-wayback-variants.yml
permissions:
  contents: read
jobs:
  source-evidence:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-202-historical-publisher-variants-readonly.mjs && node scripts/pse-202-historical-publisher-variants-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-original-202-publisher-archive-host-variants
          path: artifacts/pse-original-202-publisher/evidence.json
          retention-days: 30
          if-no-files-found: warn
