name: PSE WordPress frontend domain read-only diagnosis
on:
  push:
    branches: [main]
    paths:
      - .pse-wp-domain-diagnostic-request
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Playwright wrapper (Chromium already in image)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Compare actual WordPress general-info frontend domain to ENV_FILE
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: node scripts/pse-wordpress-domain-readonly.mjs
