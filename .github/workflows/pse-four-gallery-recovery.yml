name: PSE finish four original Joomla galleries in native WordPress (NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - .pse-four-gallery-recovery-trigger
permissions:
  contents: read
concurrency:
  group: pse-wp-photo-import
  cancel-in-progress: false
jobs:
  source-verified-migration:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.event.head_commit.message == 'cms(pse): complete four verified historical galleries'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install pinned Playwright client without OS dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Source-only exact Joomla archive preflight
        run: |
          node --check scripts/pse-photo-album-batch.mjs
          node --check scripts/pse-unpublished-albums-source-audit.mjs
          node scripts/pse-unpublished-albums-source-audit.mjs
      - name: Resume exact original image batches serially in native WordPress
        shell: bash
        run: |
          set -euo pipefail
          # Each original batch remains idempotent and source/body/media guarded.
          # NEVER invoke two CMS writers simultaneously.
          for task in '1053:2' '990:3' '980:4' '975:3'; do
            gallery="${task%%:*}"
            count="${task##*:}"
            for (( batch=0; batch<count; batch++ )); do
              export PSE_GALLERY_ID="$gallery" PSE_GALLERY_BATCH="$batch"
              echo "PSE_SOURCE_RECOVERY_BEGIN gallery=$gallery batch=$batch of=$count"
              # If and only if a read/probe transport error interrupts the
              # importer, a bounded batch retry is safe: each fresh invocation
              # first REST-reads exact source-derived Media/Post identifiers and
              # never blindly replays a WordPress POST.
              completed=false
              for (( attempt=1; attempt<=3; attempt++ )); do
                log="$RUNNER_TEMP/pse-source-gallery-$gallery-$batch-attempt-$attempt.log"
                if node scripts/pse-photo-album-batch.mjs 2>&1 | tee "$log"; then
                  # Exit zero is insufficient; verify native Post/Media markers.
                  if (( batch == count-1 )); then
                    grep -Eq 'PSE_GALLERY_BATCH=(COMPLETE|ALREADY_DONE)' "$log"
                  else
                    grep -Eq 'PSE_GALLERY_BATCH=(PARTIAL|ALREADY_DONE)' "$log"
                  fi
                  completed=true
                  break
                fi
                # Reject source/media identity failures and HTTP4xx. Only
                # transient networking may be retried once state is reread.
                if ! grep -Eqi 'ECONNRESET|ETIMEDOUT|socket hang up|TimeoutError|retries exhausted.*(network|ECONNRESET|ETIMEDOUT)' "$log"; then
                  echo "PSE_RECOVERY_STOP nontransient source or CMS error"
                  exit 1
                fi
                if (( attempt == 3 )); then
                  echo "PSE_RECOVERY_STOP transient retries exhausted"
                  exit 1
                fi
                echo "PSE_RECOVERY_TRANSIENT_RETRY gallery=$gallery batch=$batch attempt=$attempt"
                sleep $((attempt*5))
              done
              if [[ "$completed" != true ]]; then exit 1; fi
              echo "PSE_SOURCE_RECOVERY_BATCH_PASS gallery=$gallery batch=$batch"
            done
            echo "PSE_SOURCE_RECOVERY_ALBUM_PUBLISHED id=$gallery"
          done
          echo "PSE_FOUR_VERIFIED_GALLERIES_CMS=PASS originalPhotos=464 nativePostAlbums=4"
      - name: Independently compare all 464 original image identities and order on live SSR
        run: node --check scripts/pse-four-gallery-live-qa.mjs && node scripts/pse-four-gallery-live-qa.mjs
      - name: Preserve independent public parity QA even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pse-four-original-albums-public-parity
          path: artifacts/pse-four-original-gallery-live/report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve original evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pse-four-original-albums-source
          path: artifacts/pse-unpublished-four-albums/report.json
          if-no-files-found: warn
          retention-days: 30
