name: PSE Common Crawl exact missing originals discovery (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-common-crawl-original-leads-readonly.yml
permissions:
  contents: read
concurrency:
  group: pse-common-crawl-original-leads
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/pse-common-crawl-original-leads-readonly.mjs && node scripts/pse-common-crawl-original-leads-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-common-crawl-original-leads
          path: artifacts/pse-common-crawl-original-leads/report.json
          retention-days: 30
          if-no-files-found: warn
