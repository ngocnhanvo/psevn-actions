name: PSE homepage WordPress CMS authoring checks
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-homepage-editor-audit.yml
      - scripts/pse-homepage-editor-audit.mjs
      - scripts/pse-homepage-news-table-setup.mjs
      - scripts/pse-homepage-remaining-tables-setup.mjs
      - scripts/pse-homepage-draft-bind.mjs
      - scripts/pse-homepage-categories-setup.mjs
      - scripts/pse-homepage-news-slug-bind.mjs
      - scripts/pse-homepage-verified-content.mjs
      - scripts/pse-homepage-article-source-audit.mjs
      - scripts/pse-legacy-feed-date-audit.mjs
      - scripts/pse-legacy-2013-date-audit.mjs
      - scripts/pse-homepage-verified-draft-dates.mjs
      - scripts/pse-homepage-draft-assets-audit.mjs
      - scripts/pse-homepage-draft-media-migrate.mjs
      - scripts/pse-homepage-first-post-featured-image.mjs
      - scripts/pse-homepage-featured-draft-import.mjs
      - scripts/pse-homepage-publish-verified-news.mjs
      - scripts/pse-homepage-corporate-info.mjs
      - scripts/pse-homepage-media-source-audit.mjs
      - scripts/pse-homepage-legacy-slider-import.mjs
      - scripts/pse-homepage-image-cell-audit.mjs
      - scripts/pse-homepage-native-insert-images.mjs
      - docs/PSE_RELEASE_READINESS.md
      - scripts/pse-homepage-official-media-import.mjs
      - scripts/pse-homepage-brand-logo.mjs
      - scripts/pse-homepage-search-page-draft.mjs
      - scripts/pse-homepage-live-cutover.mjs
      - scripts/pse-wordpress-initialize-sitemap.mjs
      - scripts/pse-homepage-visual-qa.mjs
      - scripts/pse-homepage-live-visual-qa.mjs
      - scripts/pse-homepage-live-slider-qa.mjs
      - scripts/pse-homepage-menu-diagnostic.mjs
      - scripts/pse-homepage-navigation-audit.mjs
      - scripts/pse-legacy-menu-readonly.mjs
      - scripts/pse-homepage-header-menu-import.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cms-authoring:
    if: github.repository == 'ngocnhanvo/psevn-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser driver wrapper (Chromium pinned in container)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Inspect PSE WordPress homepage and company editor without saving data
        if: >-
          github.event.head_commit.message != 'test(pse): audit live legacy homepage slider sources (READ ONLY)' && github.event.head_commit.message != 'test(pse): inspect image cell Insert Image contract before CMS edit' && github.event.head_commit.message != 'cms(pse): normalize PSE eleven hero images using native Insert Image and SEO alt' && github.event.head_commit.message != 'cms(pse): import original eleven legacy slider images into ESC Table' && github.event.head_commit.message != 'cms(pse): verify previous ESC Table save' && github.event.head_commit.message != 'cms(pse): author three news lane field rows' && github.event.head_commit.message != 'cms(pse): retry native editor news rows' && github.event.head_commit.message != 'cms(pse): author remaining PSE ESC Table schemas' && github.event.head_commit.message != 'cms(pse): create internal PSE homepage draft via native Insert Code' && github.event.head_commit.message != 'cms(pse): create verified three news categories and bind ESC Table IDs' && github.event.head_commit.message != 'test(pse): audit CMS category slug binding and latest five posts (READ ONLY)' && github.event.head_commit.message != 'cms(pse): bind verified category slugs for dynamic latest five news tabs' && github.event.head_commit.message != 'cms(pse): populate verified PSE homepage company copy and official links' && github.event.head_commit.message != 'test(pse): audit verified legacy feature articles for CMS migration (READ ONLY)' && github.event.head_commit.message != 'cms(pse): import three verified PSE featured articles as private drafts' && github.event.head_commit.message != 'cms(pse): restore verified public company information from legacy PSE' && github.event.head_commit.message != 'test(pse): audit original PSE homepage branding media (READ ONLY)' && github.event.head_commit.message != 'cms(pse): import official PSE hero panorama and logo into WordPress Media' && github.event.head_commit.message != 'cms(pse): bind official PSE logo to WordPress header branding' && github.event.head_commit.message != 'cms(pse): prepare verified news/search PostsPage as unpublished WordPress draft' && github.event.head_commit.message != 'test(pse): verify real CMS homepage sections in Astro dev browser (NO BUILD)' && github.event.head_commit.message != 'cms(pse): bind verified original PSE Open image as private featured media' && github.event.head_commit.message != 'test(pse): audit final private WordPress Media links and source dates (READ ONLY)' && github.event.head_commit.message != 'cms(pse): initialize WordPress-managed sitemap from existing public PSE Pages' && github.event.head_commit.message != 'cms(pse): publish approved PSE homepage sections to canonical WordPress Page 248' && github.event.head_commit.message != 'test(pse): audit existing public homepage state after Save' && github.event.head_commit.message != 'test(pse): verify deployed four-section homepage at five viewports (READ ONLY)' && github.event.head_commit.message != 'test(pse): verify live original eleven-slide carousel after WordPress deploy' && github.event.head_commit.message != 'test(pse): audit three verified original news posts before publication' && github.event.head_commit.message != 'cms(pse): publish three verified source news posts for homepage' && github.event.head_commit.message != 'cms(pse): sync verified published news post events for normal PHP build' && github.event.head_commit.message != 'test(pse): inspect WordPress post change queue after verified resaves' && github.event.head_commit.message != 'cms(pse): native WordPress Save of three verified public posts for build queue' && github.event.head_commit.message != 'test(pse): verify unobstructed hero menu and three real news lanes live' && github.event.head_commit.message != 'test(pse): diagnose actual deployed investor menu structure (READ ONLY)' && github.event.head_commit.message != 'chore(pse): align QA for unobstructed hero and published news' && github.event.head_commit.message != 'test(pse): audit WordPress G3 redirect change log parity (READ ONLY)'
        run: node scripts/pse-homepage-editor-audit.mjs
      - name: Read exact legacy PSE menu hierarchy without WordPress mutation
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'test(pse): inspect verified legacy PSE nav hierarchy (READ ONLY)'
        run: node scripts/pse-legacy-menu-readonly.mjs
      - name: Replace inherited EduResearch Header using native WordPress PSE Menu Import
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): replace inherited research Header menu with verified PSE legacy tree'
        run: node scripts/pse-homepage-header-menu-import.mjs
      - name: Inspect native PSE G3 route records versus incremental logs (READ ONLY)
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'test(pse): audit WordPress G3 redirect change log parity (READ ONLY)'
        run: node scripts/pse-homepage-navigation-audit.mjs
      - name: Inspect actual PSE CMS Pages and Header menu before safe replacement
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'test(pse): inspect PSE pages and existing Header menu before replacement (READ ONLY)'
        run: |
          node scripts/pse-homepage-navigation-audit.mjs
          node scripts/pse-legacy-menu-readonly.mjs
      - name: Audit default WP category slug and latest five news REST (READ ONLY)
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'test(pse): audit CMS category slug binding and latest five posts (READ ONLY)'
        run: PSE_NEWS_SLUG_AUDIT_ONLY=1 node scripts/pse-homepage-news-slug-bind.mjs
      - name: Bind actual WordPress category slugs in PSE news ESC Table via native editor
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): bind verified category slugs for dynamic latest five news tabs'
        run: node scripts/pse-homepage-news-slug-bind.mjs
      - name: Create one verified PSE news ESC Table (idempotent, no publication)
        if: >-
          github.event_name == 'push' && (github.event.head_commit.message == 'cms(pse): author one verified news ESC Table' || github.event.head_commit.message == 'cms(pse): verify previous ESC Table save' || github.event.head_commit.message == 'cms(pse): author three news lane field rows' || github.event.head_commit.message == 'cms(pse): retry native editor news rows')
        run: node scripts/pse-homepage-news-table-setup.mjs
      - name: Create remaining three WordPress PSE section tables with empty real-data contracts
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): author remaining PSE ESC Table schemas'
        run: node scripts/pse-homepage-remaining-tables-setup.mjs
      - name: Author unpublished PSE homepage draft through native ESC Table Insert Code
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): create internal PSE homepage draft via native Insert Code'
        run: node scripts/pse-homepage-draft-bind.mjs

      - name: Create three verified PSE news categories and bind their real WP IDs
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): create verified three news categories and bind ESC Table IDs'
        run: node scripts/pse-homepage-categories-setup.mjs

      - name: Save verified PSE text and useful links through native ESC Table editor
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): populate verified PSE homepage company copy and official links'
        run: node scripts/pse-homepage-verified-content.mjs

      - name: Examine original PSE news articles for factual content and publish-date evidence
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'test(pse): audit verified legacy feature articles for CMS migration (READ ONLY)'
        run: node scripts/pse-homepage-article-source-audit.mjs

      - name: Import three verified legacy PSE featured articles into private WordPress drafts
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): import three verified PSE featured articles as private drafts'
        run: node scripts/pse-homepage-featured-draft-import.mjs

      - name: Reconcile real published PSE news via native WordPress Update button
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): native WordPress Save of three verified public posts for build queue'
        run: PSE_NEWS_NATIVE_SAVE_ONLY=1 node scripts/pse-homepage-publish-verified-news.mjs

      - name: Inspect WordPress pending queue after real post Save (READ ONLY)
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'test(pse): inspect WordPress post change queue after verified resaves'
        run: PSE_NEWS_PENDING_AUDIT_ONLY=1 node scripts/pse-homepage-publish-verified-news.mjs

      - name: Reconcile three real WordPress post saves through the standard change-log hook
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): sync verified published news post events for normal PHP build'
        run: PSE_NEWS_RESYNC_ONLY=1 node scripts/pse-homepage-publish-verified-news.mjs

      - name: Audit three verified PSE source news drafts before publishing (READ ONLY)
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'test(pse): audit three verified original news posts before publication'
        run: PSE_NEWS_AUDIT_ONLY=1 node scripts/pse-homepage-publish-verified-news.mjs
      - name: Publish exactly three verified legacy PSE news posts and verify category APIs
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): publish three verified source news posts for homepage'
        run: node scripts/pse-homepage-publish-verified-news.mjs

      - name: Validate original PSE RSS dates on all three private post drafts
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): preserve original RSS dates on three private posts'
        run: node scripts/pse-homepage-verified-draft-dates.mjs

      - name: Audit final private PSE WordPress Media links, featured image and source dates
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'test(pse): audit final private WordPress Media links and source dates (READ ONLY)'
        run: node scripts/pse-homepage-draft-assets-audit.mjs

      - name: Import audited external PSE images PDFs to WP and update only private draft links
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): migrate verified private article images and PDFs into WordPress media'
        run: node scripts/pse-homepage-draft-media-migrate.mjs

      - name: Bind source-backed first event photograph as private featured image
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): bind verified original PSE Open image as private featured media'
        run: node scripts/pse-homepage-first-post-featured-image.mjs

      - name: Restore verified PSE corporate name contact and address to WordPress site information
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): restore verified public company information from legacy PSE'
        run: node scripts/pse-homepage-corporate-info.mjs

      - name: Normalize PSE hero ESC Table image cells using WordPress native Insert Image + ALT
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): normalize PSE eleven hero images using native Insert Image and SEO alt'
        run: node scripts/pse-homepage-native-insert-images.mjs
      - name: Retain PSE hero pre-edit TablePress snapshot for rollback
        if: >-
          always() && github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): normalize PSE eleven hero images using native Insert Image and SEO alt'
        uses: actions/upload-artifact@v4
        with:
          name: pse-native-image-cell-before
          path: artifacts/pse-hero-image-migration/pse_00_vi_before.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Inspect actual PSE hero image cell and native WP media editor (READ ONLY)
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'test(pse): inspect image cell Insert Image contract before CMS edit'
        run: node scripts/pse-homepage-image-cell-audit.mjs
      - name: Audit all genuine PSE legacy homepage carousel images (READ ONLY)
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'test(pse): audit live legacy homepage slider sources (READ ONLY)'
        run: PSE_SLIDER_AUDIT_ONLY=1 node scripts/pse-homepage-legacy-slider-import.mjs
      - name: Import original PSE slider images and update native ESC Table rows
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): import original eleven legacy slider images into ESC Table'
        run: node scripts/pse-homepage-legacy-slider-import.mjs
      - name: Read public PSE original homepage image assets for media migration
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'test(pse): audit original PSE homepage branding media (READ ONLY)'
        run: node scripts/pse-homepage-media-source-audit.mjs

      - name: Import validated official PSE hero panorama and logo into WordPress Media
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): import official PSE hero panorama and logo into WordPress Media'
        run: node scripts/pse-homepage-official-media-import.mjs

      - name: Bind official PSE logo into canonical WordPress Header site info
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): bind official PSE logo to WordPress header branding'
        run: node scripts/pse-homepage-brand-logo.mjs

      - name: Bootstrap verified sitemap using native signed PSE WordPress SEO Settings Save
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): initialize WordPress-managed sitemap from existing public PSE Pages'
        run: node scripts/pse-wordpress-initialize-sitemap.mjs

      - name: Inspect actual investor menu DOM and nested positioning (READ ONLY)
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'test(pse): diagnose actual deployed investor menu structure (READ ONLY)'
        run: node scripts/pse-homepage-menu-diagnostic.mjs
      - name: Verify new unobstructed PSE hero, collision-safe dropdown and three real news lanes (READ ONLY)
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'test(pse): verify unobstructed hero menu and three real news lanes live'
        run: |
          node scripts/pse-homepage-live-slider-qa.mjs
          node scripts/pse-homepage-live-visual-qa.mjs
      - name: Verify all 11 original PSE slider slides and desktop/mobile interactions (READ ONLY)
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'test(pse): verify live original eleven-slide carousel after WordPress deploy'
        run: node scripts/pse-homepage-live-slider-qa.mjs
      - name: Save original PSE slider desktop/mobile screenshots
        if: >-
          always() && github.event_name == 'push' && github.event.head_commit.message == 'test(pse): verify live original eleven-slide carousel after WordPress deploy'
        uses: actions/upload-artifact@v4
        with:
          name: pse-live-original-eleven-slides
          path: artifacts/pse-homepage-slider-qa/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Inspect deployed PSE homepage layout in Chromium at five widths (READ ONLY)
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'test(pse): verify deployed four-section homepage at five viewports (READ ONLY)'
        run: node scripts/pse-homepage-live-visual-qa.mjs
      - name: Retain public PSE postdeploy screenshots
        if: >-
          always() && github.event_name == 'push' &&
          github.event.head_commit.message == 'test(pse): verify deployed four-section homepage at five viewports (READ ONLY)'
        uses: actions/upload-artifact@v4
        with:
          name: pse-live-homepage-five-viewports
          path: artifacts/pse-live-visual-qa/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit canonical PSE home after previous Save (READ ONLY)
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'test(pse): audit existing public homepage state after Save'
        run: PSE_CUTOVER_AUDIT_ONLY=1 node scripts/pse-homepage-live-cutover.mjs
      - name: Update canonical WordPress homepage through native ESC Insert Code, retaining rollback snapshot
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): publish approved PSE homepage sections to canonical WordPress Page 248'
        run: node scripts/pse-homepage-live-cutover.mjs
      - name: Retain private backup of Page 248 before homepage switch
        if: >-
          always() && github.event_name == 'push' &&
          github.event.head_commit.message == 'cms(pse): publish approved PSE homepage sections to canonical WordPress Page 248'
        uses: actions/upload-artifact@v4
        with:
          name: pse-homepage-precutover-wordpress-revision
          path: artifacts/pse-homepage-cutover/page-248-before.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Author verified PSE news-search archive Page as private WordPress draft
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): prepare verified news/search PostsPage as unpublished WordPress draft'
        run: node scripts/pse-homepage-search-page-draft.mjs

  visual-qa:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'test(pse): verify real CMS homepage sections in Astro dev browser (NO BUILD)'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - name: Checkout PSE Actions test harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact PSE Astro DEV source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: github
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: source
      - name: Install browser wrapper and Astro DEV dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
          npm install --global pnpm@9.15.9
          cd source
          pnpm install --frozen-lockfile --prefer-offline
      - name: Render real CMS PSE home in transient Astro DEV server with Playwright
        run: timeout --signal=TERM --kill-after=12s 320s node scripts/pse-homepage-visual-qa.mjs
      - name: Retain screenshots for private PSE visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pse-homepage-real-cms-visual-qa
          path: artifacts/pse-homepage-visual-qa/*.png
          if-no-files-found: ignore
          retention-days: 7


  legacy-date-audit:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'test(pse): inspect legacy RSS date metadata without CMS mutation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout existing PSE audit source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect original PSE news RSS metadata, read only
        run: node scripts/pse-legacy-feed-date-audit.mjs

  original-market-date-audit:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'test(pse): inspect alternate original RSS date for 2013 post'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout original PSE source audit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check 2013 market post RSS/Atom metadata without changes
        run: node scripts/pse-legacy-2013-date-audit.mjs
