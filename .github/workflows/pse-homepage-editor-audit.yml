name: PSE homepage WordPress CMS authoring checks
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-homepage-editor-audit.yml
      - scripts/pse-homepage-editor-audit.mjs
      - scripts/pse-homepage-news-table-setup.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor-readonly:
    if: github.repository == 'ngocnhanvo/psevn-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser driver wrapper (Chromium pinned in container)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Inspect PSE WordPress homepage and company editor without saving data
        run: node scripts/pse-homepage-editor-audit.mjs
      - name: Create one verified PSE news ESC Table (idempotent, no publication)
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'cms(pse): author one verified news ESC Table'
        run: node scripts/pse-homepage-news-table-setup.mjs
