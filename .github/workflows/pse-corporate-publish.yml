name: PSE corporate Page publish and native menu cutover
on:
  push:
    branches: [main]
    paths:
      - .pse-corporate-release-audit-trigger
      - .pse-corporate-menu-bind-request
permissions:
  contents: read
concurrency:
  group: pse-corporate-release
  cancel-in-progress: false
jobs:
  wordpress-release:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      PSE_CORPORATE_RELEASE_APPLY: '0'
      PSE_CORPORATE_MENU_BIND_APPLY: "${{ github.event.head_commit.message == 'cms(pse): bind ten company menu items to published Pages' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Preflight then publish verified Pages and bind native WordPress menu
        if: "${{ github.event.head_commit.message != 'cms(pse): bind ten company menu items to published Pages' && github.event.head_commit.message != 'test(pse): audit native company menu binding before save' }}"
        run: node scripts/pse-corporate-publish.mjs
      - name: Verify original WordPress Page references and save Menu Manager fields
        if: "${{ github.event.head_commit.message == 'cms(pse): bind ten company menu items to published Pages' || github.event.head_commit.message == 'test(pse): audit native company menu binding before save' }}"
        run: |
          node --check scripts/pse-corporate-menu-native-binding.mjs
          node scripts/pse-corporate-menu-native-binding.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-corporate-release-checkpoint
          path: artifacts/pse-corporate-release.json
          if-no-files-found: warn
          retention-days: 7
