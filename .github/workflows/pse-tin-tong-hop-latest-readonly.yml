name: PSE latest Tin tong hop Joomla headlines versus WP (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .pse-tin-tong-hop-latest-request
permissions:
  contents: read
jobs:
  check:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.event.head_commit.message == 'audit(pse): check newest Joomla Tin tong hop articles against WordPress'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-tin-tong-hop-latest-readonly.mjs && node scripts/pse-tin-tong-hop-latest-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-tin-tong-hop-latest-source-inventory
          path: artifacts/pse-tin-tong-hop-latest/report.json
          retention-days: 7
          if-no-files-found: warn
