name: PSE original Joomla 379 source/WordPress/Astro live parity (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-379-postrelease-qa.mjs
      - .github/workflows/pse-379-postrelease-qa.yml
      - .pse-379-original-postrelease-qa-request
permissions:
  contents: read
jobs:
  syntax:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-379-postrelease-qa.mjs
  verify:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'test(pse): validate published Joomla 379 on Astro'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-379-postrelease-qa.mjs && node scripts/pse-379-postrelease-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-379-original-live-parity
          path: artifacts/pse-379-postrelease/report.json
          retention-days: 30
          if-no-files-found: warn
