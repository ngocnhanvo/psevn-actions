name: PSE Joomla market 14 publish-date preflight (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .pse-market-joomla-date-readonly-request
permissions:
  contents: read
jobs:
  audit:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.event.head_commit.message == 'test(pse): audit Joomla 14 market created dates'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --check scripts/pse-market-joomla-date-preflight.mjs && node scripts/pse-market-joomla-date-preflight.mjs
