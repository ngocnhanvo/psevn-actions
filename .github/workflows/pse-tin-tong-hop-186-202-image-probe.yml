name: PSE source Tin tong hop 186/202 image recovery probe (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-tin-tong-hop-186-202-image-probe.yml
      - scripts/pse-tin-tong-hop-186-202-image-probe.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-source:
    if: github.repository == 'ngocnhanvo/psevn-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Probe original images only; no TLS bypass, no image substitute
        run: node --check scripts/pse-tin-tong-hop-186-202-image-probe.mjs && node scripts/pse-tin-tong-hop-186-202-image-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-tin-tong-hop-186-202-image-probe
          path: artifacts/pse-tin-tong-hop-image-probe/
          if-no-files-found: warn
          retention-days: 21
