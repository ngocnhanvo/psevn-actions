name: PSE 7 original fertilizer guide files integrity audit (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.pse-guide-files-audit-trigger]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-guide-files-audit.mjs && node scripts/pse-guide-files-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-seven-original-guide-document-hashes
          path: artifacts/pse-fertilizer-guides/source-audit.json
          if-no-files-found: warn
          retention-days: 14
