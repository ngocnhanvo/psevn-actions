name: PSE agricultural knowledge source parity (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .pse-agriculture-map-trigger
permissions:
  contents: read
jobs:
  parity:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Audit agriculture original article identity against WordPress
        run: node --check scripts/pse-agriculture-source-map.mjs && node scripts/pse-agriculture-source-map.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-agriculture-source-mapping
          path: artifacts/pse-agriculture-map/original-to-wordpress.json
          retention-days: 14
          if-no-files-found: warn
