name: PSE 2012 semiannual reviewed report independent Stockbiz PDF proof (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-298-stockbiz-original-financial-pdf-proof.mjs
      - .github/workflows/pse-298-stockbiz-original-financial-pdf-proof.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/pse-298-stockbiz-original-financial-pdf-proof.mjs
      - run: node scripts/pse-298-stockbiz-original-financial-pdf-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-original-2012-reviewed-alt-finance-source
          path: artifacts/pse-298-2012-reviewed-alternative/report.json
          retention-days: 30
          if-no-files-found: warn
