name: PSE WordPress fetch reliability branch CI (NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-wordpress-fetch-ci.yml
      - .pse-wordpress-fetch-ci-trigger
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: fix/pse-undici-fetch-client-20261026
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec vitest run
      - name: Parse shared WordPress fetch module in Node target
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {transformWithEsbuild} from 'vite';
          const path='src/lib/utils/fetchWithDiagnostics.ts';
          await transformWithEsbuild(await readFile(path,'utf8'),path,{loader:'ts'});
          console.log('PSE_WORDPRESS_FETCH_PARSE=PASS; NO_BUILD=PASS');
          NODE
