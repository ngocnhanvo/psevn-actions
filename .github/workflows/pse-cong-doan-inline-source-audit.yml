name: PSE Cong doan inline Joomla 1637 1638 audit (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/pse-cong-doan-inline-source-audit.mjs'
      - '.github/workflows/pse-cong-doan-inline-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-inline-source:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-cong-doan-inline-source-audit.mjs && node scripts/pse-cong-doan-inline-source-audit.mjs
