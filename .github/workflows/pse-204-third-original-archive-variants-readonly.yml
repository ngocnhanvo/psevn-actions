name: PSE Joomla 204 exact third original image archive proof (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-204-third-original-archive-variants-readonly.mjs
      - .github/workflows/pse-204-third-original-archive-variants-readonly.yml
permissions:
  contents: read
jobs:
  read-only:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-204-third-original-archive-variants-readonly.mjs && node scripts/pse-204-third-original-archive-variants-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-exact-third-204-source-archive-variants
          path: artifacts/pse-original-204-third-photo/report.json
          retention-days: 30
          if-no-files-found: warn
