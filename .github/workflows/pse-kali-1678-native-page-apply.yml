name: PSE Kali 1678 exact original native Page restore (GUARDED)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-kali-1678-native-page-apply.mjs
      - .github/workflows/pse-kali-1678-native-page-apply.yml
      - .pse-kali-1678-native-page-request
permissions:
  contents: read
  actions: read
jobs:
  syntax:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-kali-1678-native-page-apply.mjs
  apply:
    needs: syntax
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'cms(pse): restore original Kali 1678 native page'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pse-legacy-redirect-native-wordpress
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: pse-kali-1678-native-page-preflight
          path: inputs/kali
          run-id: 44990223813
          github-token: ${{ github.token }}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Fresh database backup before original content restore
        run: node scripts/pse-template-updraft-backup.mjs
      - run: echo "PSE_KALI_FRESH_BACKUP=yes" >> "$GITHUB_ENV"
      - run: node scripts/pse-kali-1678-native-page-apply.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-kali-1678-native-page-apply
          path: artifacts/pse-kali-1678-native-page/
          retention-days: 30
          if-no-files-found: warn
