name: PSE final independent governance source parity (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-governance-24-final-qa.mjs
      - .github/workflows/pse-governance-24-final-qa.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pse-governance-24-final-readonly
  cancel-in-progress: false
jobs:
  final:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: pse-governance-2026-independent-parity
          run-id: 44744504960
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/pse-governance-source-proof
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-governance-24-final-qa.mjs && node scripts/pse-governance-24-final-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-governance-final-independent-qa
          path: artifacts/pse-governance-final/report.json
          if-no-files-found: warn
          retention-days: 30
