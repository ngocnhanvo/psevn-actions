name: PSE organization chart CLS desktop audit (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.pse-lighthouse-org-cls-request]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0 lighthouse@13.0.1
      - run: node --check scripts/pse-lighthouse-org-cls-diag.mjs && node scripts/pse-lighthouse-org-cls-diag.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-org-cls-evidence
          path: artifacts/pse-org-cls/
          if-no-files-found: warn
          retention-days: 14
