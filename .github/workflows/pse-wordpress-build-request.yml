name: PSE build via WordPress PHP button (OWNER REQUEST)
on:
  push:
    branches: [main]
    paths:
      - .pse-wordpress-build-request
permissions:
  contents: read
concurrency:
  group: pse-wordpress-build-request
  cancel-in-progress: false
jobs:
  wp-trigger:
    name: Signed preflight then WordPress Build Website
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 14
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      # Origin is resolved from ENV_FILE at runtime; never pin the WP hostname.
    steps:
      - name: Checkout PSE's existing WordPress trigger E2E helper
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify signed PSE unzip v2 + exact FTP target before WordPress build
        shell: bash
        run: |
          set -euo pipefail
          ASTRO_FTP_TARGET="$(python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          text=os.environ['ENV_FILE']
          values={}
          for line in text.splitlines():
              if line.strip().startswith('WC_URL_CLIENT='):
                  values['client']=line.split('=',1)[1].strip().strip('"').strip("'")
              if line.strip().startswith('WC_URL='):
                  values['wp']=line.split('=',1)[1].strip().strip('"').strip("'")
          front=urlsplit(values['client'])
          wp=urlsplit(values['wp'])
          def valid_https_origin(parsed):
              return (parsed.scheme=='https' and bool(parsed.hostname)
                  and parsed.username is None and parsed.password is None
                  and parsed.port in (None,443) and parsed.path in ('','/')
                  and not parsed.query and not parsed.fragment)
          assert valid_https_origin(wp) and valid_https_origin(front)
          assert front.hostname != wp.hostname
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as out:
              out.write('WC_URL='+wp.geturl().rstrip('/')+'\n')
          print('/domains/'+front.hostname+'/public_html/')
          PY
          )"
          export ASTRO_FTP_TARGET
          python3 scripts/pse-remote-unzip.py verify
          echo "PSE_SIGNED_WP_UNZIP_PREFLIGHT=PASS"
      - name: Install wrapper only (Chromium already in image)
        shell: bash
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Trigger exactly one WordPress Build Website via authenticated PSE admin
        shell: bash
        run: node imported-eduresearch/scripts/wordpress-build-trigger-e2e.mjs
