name: PSE build via WordPress PHP button (OWNER REQUEST)
on:
  push:
    branches: [main]
    paths:
      - .pse-wordpress-build-request
  workflow_run:
    workflows:
      - PSE two further original gallery-backed Joomla Posts guarded recovery
      - PSE original Phu My Garden eight native WordPress Products (GUARDED)
      - PSE native WordPress Garden eight public Product rewrite repair (GUARDED)
      - PSE Joomla 1639 exact Garden family redirect native WP (GUARDED)
      - PSE Joomla 1640 two verified original publisher archive photos native WP (GUARDED)
      - PSE original Joomla 1640 exact native WordPress 301 redirect (GUARDED)
      - PSE original investor notices 338 and 1085 exact native CMS restoration (GUARDED)
      - PSE exact three archived original agriculture posts and JPEGs (GUARDED)
      - PSE two source-proven shareholder exact original Joomla 301 (GUARDED)
      - PSE original agriculture Joomla 344 348 370 exact WP 301 (GUARDED)
      - PSE Joomla 204 original three archive-backed publisher images native WP (GUARDED)
      - PSE original Joomla 204 exact native WordPress 301 redirect (GUARDED)
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: pse-wordpress-build-request
  cancel-in-progress: false
jobs:
  wp-trigger:
    name: Signed preflight then WordPress Build Website
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      (
        github.event_name == 'push'
        ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == 'ngocnhanvo/psevn-actions' &&
         github.event.workflow_run.head_branch == 'main' &&
         (
           (github.event.workflow_run.event == 'workflow_run' &&
            github.event.workflow_run.name == 'PSE two further original gallery-backed Joomla Posts guarded recovery')
           ||
           (github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.name == 'PSE original Phu My Garden eight native WordPress Products (GUARDED)' &&
            github.event.workflow_run.head_commit.message == 'cms(pse): import eight original Phu My Garden products')
           ||
           (github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.name == 'PSE native WordPress Garden eight public Product rewrite repair (GUARDED)' &&
            github.event.workflow_run.head_commit.message == 'cms(pse): restore eight Garden public Product detail rewrites')
           ||
           (github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.name == 'PSE Joomla 1639 exact Garden family redirect native WP (GUARDED)' &&
            github.event.workflow_run.head_commit.message == 'cms(pse): redirect exact Joomla Garden 1639 to published Garden category')
           ||
           (github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.name == 'PSE Joomla 1640 two verified original publisher archive photos native WP (GUARDED)' &&
            github.event.workflow_run.head_commit.message == 'cms(pse): restore Joomla 1640 original article with two exact publisher archives')
           ||
           (github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.name == 'PSE original Joomla 1640 exact native WordPress 301 redirect (GUARDED)' &&
            github.event.workflow_run.head_commit.message == 'cms(pse): original Joomla 1640 exact native 301 to verified published Post')
           ||
           (github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.name == 'PSE original investor notices 338 and 1085 exact native CMS restoration (GUARDED)' &&
            github.event.workflow_run.head_commit.message == 'cms(pse): restore original shareholder notices 338 and 1085')
            ||
            (github.event.workflow_run.event == 'push' &&
             github.event.workflow_run.name == 'PSE exact three archived original agriculture posts and JPEGs (GUARDED)' &&
             github.event.workflow_run.head_commit.message == 'cms(pse): restore three original one-photo agriculture articles')
            ||
            (github.event.workflow_run.event == 'push' &&
             github.event.workflow_run.name == 'PSE two source-proven shareholder exact original Joomla 301 (GUARDED)' &&
             github.event.workflow_run.head_commit.message == 'cms(pse): redirect two exact original shareholder notices 338 and 1085')
            ||
            (github.event.workflow_run.event == 'push' &&
             github.event.workflow_run.name == 'PSE original agriculture Joomla 344 348 370 exact WP 301 (GUARDED)' &&
             github.event.workflow_run.head_commit.message == 'cms(pse): redirect three exact original agriculture articles 344 348 370')
            ||
            (github.event.workflow_run.event == 'push' &&
             github.event.workflow_run.name == 'PSE Joomla 204 original three archive-backed publisher images native WP (GUARDED)' &&
             github.event.workflow_run.head_commit.message == 'cms(pse): restore Joomla 204 original article with three exact publisher archives')
            ||
            (github.event.workflow_run.event == 'push' &&
             github.event.workflow_run.name == 'PSE original Joomla 204 exact native WordPress 301 redirect (GUARDED)' &&
             github.event.workflow_run.head_commit.message == 'cms(pse): original Joomla 204 exact native 301 to verified published Post')
         ))
      )
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 14
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      # Only the explicit owner-authorized marker commit can request an exception.
      PSE_FORCE_BUILD_ONCE: "${{ github.event.head_commit.message == 'build(pse): approved one-time WordPress exception for subpages' || github.event.head_commit.message == 'build(pse): approved one-time WordPress exception for image API fallback' || github.event.head_commit.message == 'build(pse): approved one-time WordPress exception for Lighthouse SEO and accessibility' || github.event.head_commit.message == 'build(pse): approved one-time WordPress exception for related product quote CTA' || github.event.head_commit.message == 'build(pse): approved one-time WordPress exception for Visual Builder wave 1' || github.event.head_commit.message == 'build(pse): approved one-time WordPress exception for news thumbnail admin URL fix' || github.event.head_commit.message == 'build(pse): approved one-time WordPress exception for organization chart CLS' || github.event.head_commit.message == 'build(pse): approved one-time WordPress exception for desktop homepage SI' || github.event.head_commit.message == 'build(pse): approved one-time WordPress exception for redirect registry pagination' || github.event.head_commit.message == 'build(pse): approved one-time WordPress exception for news SSR latency' || github.event.head_commit.message == 'build(pse): approved one-time WordPress exception for guarded webroot env' || github.event.head_commit.message == 'build(pse): approved one-time WordPress exception for sitewide agent release' || github.event.head_commit.message == 'build(pse): approved one-time WordPress exception for PDF icon 24px' || github.event.head_commit.message == 'build(pse): approved one-time WordPress exception for PDF cards' || github.event.head_commit.message == 'build(pse): approved one-time WordPress exception for product category UI' }}"
      # Origin is resolved from ENV_FILE at runtime; never pin the WP hostname.
    steps:
      - name: Checkout PSE's existing WordPress trigger E2E helper
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify signed PSE unzip v2 + exact FTP target before WordPress build
        shell: bash
        run: |
          set -euo pipefail
          ASTRO_FTP_TARGET="$(python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          text=os.environ['ENV_FILE']
          values={}
          for line in text.splitlines():
              if line.strip().startswith('WC_URL_CLIENT='):
                  values['client']=line.split('=',1)[1].strip().strip('"').strip("'")
              if line.strip().startswith('WC_URL='):
                  values['wp']=line.split('=',1)[1].strip().strip('"').strip("'")
          front=urlsplit(values['client'])
          wp=urlsplit(values['wp'])
          def valid_https_origin(parsed):
              return (parsed.scheme=='https' and bool(parsed.hostname)
                  and parsed.username is None and parsed.password is None
                  and parsed.port in (None,443) and parsed.path in ('','/')
                  and not parsed.query and not parsed.fragment)
          assert valid_https_origin(wp) and valid_https_origin(front)
          assert front.hostname != wp.hostname
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as out:
              out.write('WC_URL='+wp.geturl().rstrip('/')+'\n')
          print('/domains/'+front.hostname+'/public_html/')
          PY
          )"
          export ASTRO_FTP_TARGET
          python3 scripts/pse-remote-unzip.py verify
          echo "PSE_SIGNED_WP_UNZIP_PREFLIGHT=PASS"
      - name: Install wrapper only (Chromium already in image)
        shell: bash
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Authorize build-performance force-once for this exact owner request
        if: "${{ github.event.head_commit.message == 'build(pse): approved one-time WordPress exception for build performance optimization' }}"
        shell: bash
        run: echo "PSE_FORCE_BUILD_ONCE=true" >> "$GITHUB_ENV"
      - name: Verify exact verified CMS job success before signed WordPress build
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          event=json.load(open(os.environ["GITHUB_EVENT_PATH"],encoding="utf-8"))
          run=event.get("workflow_run") or {}
          if not isinstance(run.get("id"),int) or run.get("conclusion")!="success":
              raise SystemExit("PSE_WP_BUILD_CHAIN=REJECT_EVENT")
          if (run.get("head_repository") or {}).get("full_name")!="ngocnhanvo/psevn-actions" or run.get("head_branch")!="main":
              raise SystemExit("PSE_WP_BUILD_CHAIN=REJECT_REPOSITORY")
          name=run.get("name")
          if name=="PSE two further original gallery-backed Joomla Posts guarded recovery" and run.get("event")=="workflow_run":
              cohort="SOURCE_PROVEN_TWO_POSTS"
          elif (name=="PSE original Phu My Garden eight native WordPress Products (GUARDED)" and run.get("event")=="push"
                and (run.get("head_commit") or {}).get("message")=="cms(pse): import eight original Phu My Garden products"):
              cohort="SOURCE_PROVEN_EIGHT_GARDEN"
          elif (name=="PSE native WordPress Garden eight public Product rewrite repair (GUARDED)" and run.get("event")=="push"
                and (run.get("head_commit") or {}).get("message")=="cms(pse): restore eight Garden public Product detail rewrites"):
              cohort="SOURCE_PROVEN_EIGHT_GARDEN_ROUTES"
          elif (name=="PSE Joomla 1639 exact Garden family redirect native WP (GUARDED)" and run.get("event")=="push"
                and (run.get("head_commit") or {}).get("message")=="cms(pse): redirect exact Joomla Garden 1639 to published Garden category"):
              cohort="SOURCE_PROVEN_GARDEN_1639_ALIAS"
          elif (name=="PSE Joomla 1640 two verified original publisher archive photos native WP (GUARDED)" and run.get("event")=="push"
                and (run.get("head_commit") or {}).get("message")=="cms(pse): restore Joomla 1640 original article with two exact publisher archives"):
              cohort="SOURCE_PROVEN_ORIGINAL_1640_TWO_PUBLISHER_ARCHIVES"
          elif (name=="PSE original Joomla 1640 exact native WordPress 301 redirect (GUARDED)" and run.get("event")=="push"
                and (run.get("head_commit") or {}).get("message")=="cms(pse): original Joomla 1640 exact native 301 to verified published Post"):
              cohort="SOURCE_PROVEN_ORIGINAL_1640_EXACT_301"
          elif (name=="PSE original investor notices 338 and 1085 exact native CMS restoration (GUARDED)" and run.get("event")=="push"
                and (run.get("head_commit") or {}).get("message")=="cms(pse): restore original shareholder notices 338 and 1085"):
              cohort="SOURCE_PROVEN_TWO_ORIGINAL_INVESTOR_NOTICES"
          elif (name=="PSE exact three archived original agriculture posts and JPEGs (GUARDED)" and run.get("event")=="push"
                and (run.get("head_commit") or {}).get("message")=="cms(pse): restore three original one-photo agriculture articles"):
              cohort="SOURCE_PROVEN_THREE_ORIGINAL_AGRICULTURE_ARCHIVED_PHOTOS"
          elif (name=="PSE two source-proven shareholder exact original Joomla 301 (GUARDED)" and run.get("event")=="push"
                and (run.get("head_commit") or {}).get("message")=="cms(pse): redirect two exact original shareholder notices 338 and 1085"):
              cohort="SOURCE_PROVEN_TWO_INVESTOR_EXACT_ORIGINAL_301"
          elif (name=="PSE original agriculture Joomla 344 348 370 exact WP 301 (GUARDED)" and run.get("event")=="push"
                and (run.get("head_commit") or {}).get("message")=="cms(pse): redirect three exact original agriculture articles 344 348 370"):
              cohort="SOURCE_PROVEN_THREE_AGRICULTURE_EXACT_ORIGINAL_301"
          elif (name=="PSE Joomla 204 original three archive-backed publisher images native WP (GUARDED)" and run.get("event")=="push"
                and (run.get("head_commit") or {}).get("message")=="cms(pse): restore Joomla 204 original article with three exact publisher archives"):
              cohort="SOURCE_PROVEN_JOOMLA_204_THREE_ARCHIVED_PUBLISHER_JPEGS"
          elif (name=="PSE original Joomla 204 exact native WordPress 301 redirect (GUARDED)" and run.get("event")=="push"
                and (run.get("head_commit") or {}).get("message")=="cms(pse): original Joomla 204 exact native 301 to verified published Post"):
              cohort="SOURCE_PROVEN_ORIGINAL_204_EXACT_301"
          else:
              raise SystemExit("PSE_WP_BUILD_CHAIN=REJECT_UNAPPROVED_CMS_COHORT")
          url=f"https://api.github.com/repos/ngocnhanvo/psevn-actions/actions/runs/{run['id']}/jobs?per_page=100"
          req=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req,timeout=25) as response:
              jobs=json.load(response).get("jobs",[])
          applied=[j for j in jobs if j.get("name")=="apply" and j.get("conclusion")=="success"]
          if len(applied)!=1:
              raise SystemExit("PSE_WP_BUILD_CHAIN=REJECT_MISSING_CMS_APPLY")
          print("PSE_WP_BUILD_CHAIN=PASS_"+cohort+"; no_force=true")
          PY
      - name: Trigger exactly one WordPress Build Website via authenticated PSE admin
        shell: bash
        run: node imported-eduresearch/scripts/wordpress-build-trigger-e2e.mjs
