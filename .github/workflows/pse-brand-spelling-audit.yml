name: PSE public brand spelling audit (read only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-brand-spelling-audit.yml
      - scripts/pse-brand-spelling-audit.mjs

permissions:
  contents: read
  issues: write

concurrency:
  group: pse-public-brand-spelling-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Scan sitemap and public pages with Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - name: Checkout audited project scripts
        uses: actions/checkout@v4
      - name: Install Playwright JS client (Chromium pinned in image)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Self-test brand matcher and hostname restrictions
        run: node scripts/pse-brand-spelling-audit.mjs --self-test
      - name: Scan PSE site with read-only Chromium
        timeout-minutes: 30
        run: node scripts/pse-brand-spelling-audit.mjs
        env:
          SITE_URL: https://pse.webnvn.com
      - name: Attach detailed URL-by-URL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pse-brand-spelling-audit
          path: audit-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish concise GitHub Issue report (no site writes)
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = 'audit-results/pse-brand-spelling-audit.json';
            if (!fs.existsSync(file)) {
              core.warning('Audit output missing; no issue published');
              return;
            }
            const result = JSON.parse(fs.readFileSync(file,'utf8'));
            const title = 'PSE brand spelling audit - PVFCCo-PSE';
            const details = result.findings.slice(0, 80).map((f) =>
              '- ' + f.url + ' - ' + f.kind + ' (' + f.location + '): **' + f.actual + '**');
            const failures = result.errors.slice(0, 30).map((x) => '- ' + x.url + ' - ' + x.error);
            const body = [
              '## Playwright brand spelling audit',
              'Expected spelling: **PVFCCo-PSE** (lowercase o).',
              '',
              '- Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              '- Checked HTML pages: ' + result.pagesChecked,
              '- Sitemap URLs: ' + result.sitemap.discovered,
              '- Findings: ' + result.findingCount,
              '- Failed pages: ' + result.errorCount,
              '- Truncated: ' + result.truncated,
              '',
              '### Incorrect occurrences (first 80)',
              ...details,
              '',
              '### Crawl errors (first 30)',
              ...failures,
              '',
              'Full URL-by-URL JSON and Markdown are attached to the workflow run as artifact pse-brand-spelling-audit.'
            ].join('\n').slice(0, 60000);
            const owner = context.repo.owner, repo = context.repo.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, {owner,repo,state:'open',per_page:100});
            const previous = existing.find(x => x.title === title && !x.pull_request);
            if (previous) {
              await github.rest.issues.update({owner,repo,issue_number:previous.number,body});
              core.info('PSE_AUDIT_ISSUE=' + previous.html_url);
            } else {
              const created = await github.rest.issues.create({owner,repo,title,body});
              core.info('PSE_AUDIT_ISSUE=' + created.data.html_url);
            }
