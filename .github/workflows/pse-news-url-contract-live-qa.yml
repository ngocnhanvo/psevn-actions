name: PSE News canonical category URL contracts (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .pse-news-url-contract-qa-trigger
permissions:
  contents: read
jobs:
  news-urls:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-news-url-contract-live-qa.mjs && node scripts/pse-news-url-contract-live-qa.mjs
      - name: Verify public article image API and Imagick fallback (READ ONLY)
        run: node --check scripts/pse-post-image-api-live-qa.mjs && node scripts/pse-post-image-api-live-qa.mjs
