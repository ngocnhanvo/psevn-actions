name: PSE PDF icons across article archive pages (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-pdf-icons-multipage-readonly.mjs
      - .github/workflows/pse-pdf-icons-multipage-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Check live PDF icon dimensions across investor-relations documents
        run: node --check scripts/pse-pdf-icons-multipage-readonly.mjs && node scripts/pse-pdf-icons-multipage-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-pdf-icons-multipage
          path: artifacts/pse-pdf-multipage/report.json
          if-no-files-found: warn
          retention-days: 14
