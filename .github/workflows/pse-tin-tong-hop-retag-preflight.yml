name: PSE Tin tong hop historic WP content and PDF preflight (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-tin-tong-hop-retag-preflight.yml
      - scripts/pse-tin-tong-hop-retag-verified-collisions.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'ngocnhanvo/psevn-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Compare all five source pages + archived PDFs byte-for-byte with WP
        run: node --check scripts/pse-tin-tong-hop-retag-verified-collisions.mjs && node scripts/pse-tin-tong-hop-retag-verified-collisions.mjs --preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-tin-tong-hop-retag-preflight
          path: artifacts/pse-tin-tong-hop-retag/
          if-no-files-found: warn
          retention-days: 21
