name: PSE historical Joomla gallery feed date crosscheck and 379 pagination (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-feed-pagination-crosscheck.mjs
      - .github/workflows/pse-feed-pagination-crosscheck.yml
permissions:
  contents: read
jobs:
  evidence:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/pse-feed-pagination-crosscheck.mjs
      - run: node scripts/pse-feed-pagination-crosscheck.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-feed-pagination-crosscheck
          path: artifacts/pse-feed-pagination-crosscheck/report.json
          retention-days: 14
          if-no-files-found: ignore
