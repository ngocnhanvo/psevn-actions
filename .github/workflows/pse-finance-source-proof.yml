name: PSE finance original date and missing PDF anchor proof (READ ONLY)
on:
  push:
    branches: [main]
    paths: [scripts/pse-finance-source-proof.mjs]
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-finance-source-proof.mjs && node scripts/pse-finance-source-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-finance-source-proof
          path: artifacts/pse-finance-source-proof/report.json
          retention-days: 14
