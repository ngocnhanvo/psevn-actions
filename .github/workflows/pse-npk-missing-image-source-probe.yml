name: PSE NPK external photo source audit (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-npk-missing-image-source-probe.mjs
      - .github/workflows/pse-npk-missing-image-source-probe.yml
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Check original image source alternatives without CMS write
        run: |
          node --check scripts/pse-npk-missing-image-source-probe.mjs
          node scripts/pse-npk-missing-image-source-probe.mjs
