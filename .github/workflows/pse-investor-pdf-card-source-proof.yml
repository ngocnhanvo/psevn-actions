name: PSE investor document placeholder PDF source proof (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-investor-pdf-card-source-proof.mjs
      - .github/workflows/pse-investor-pdf-card-source-proof.yml
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-investor-pdf-card-source-proof.mjs
      - run: node scripts/pse-investor-pdf-card-source-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-investor-real-pdf-vs-placeholder-card-sources
          path: artifacts/pse-investor-pdf-card-sources/report.json
          retention-days: 30
          if-no-files-found: warn
