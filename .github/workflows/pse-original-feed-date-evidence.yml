name: PSE original Joomla 975 and 379 RSS date evidence (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-original-feed-date-evidence.mjs
      - .github/workflows/pse-original-feed-date-evidence.yml
permissions:
  contents: read
jobs:
  source-feed:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/pse-original-feed-date-evidence.mjs
      - run: node scripts/pse-original-feed-date-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-source-exact-feed-date-evidence
          path: artifacts/pse-original-feed-date/report.json
          retention-days: 14
          if-no-files-found: ignore
