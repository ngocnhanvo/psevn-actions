name: PSE exact five Dam Phu My related link source to CMS audit (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-dam-related-links-audit.mjs
      - .github/workflows/pse-dam-related-links-audit.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-dam-related-links-audit.mjs
      - run: node scripts/pse-dam-related-links-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-dam-related-links-audit
          path: artifacts/pse-dam-related-links-audit/
          retention-days: 30
          if-no-files-found: warn
