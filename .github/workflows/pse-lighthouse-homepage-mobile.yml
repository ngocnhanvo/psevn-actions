name: PSE live homepage Mobile Lighthouse after Desktop SI fix (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-lighthouse-homepage-mobile.yml
      - .pse-lighthouse-homepage-mobile-trigger
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Lighthouse and pinned Playwright browser
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0 lighthouse@13.0.1
      - name: Run read-only Mobile Lighthouse without touching deployment
        run: node --check scripts/pse-lighthouse-homepage-mobile.mjs && node scripts/pse-lighthouse-homepage-mobile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-homepage-mobile-lighthouse
          path: artifacts/pse-lighthouse-mobile
          if-no-files-found: warn
