name: PSE original Garden eight products native and live acceptance (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-garden-eight-live-qa.mjs
      - .github/workflows/pse-garden-eight-live-qa.yml
      - .pse-garden-eight-live-qa-request
permissions:
  contents: read
jobs:
  syntax:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-garden-eight-live-qa.mjs
  public-acceptance:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'test(pse): original eight Garden products postrelease acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify exact original eight Garden images, ProductCategory, and SSR responsive URLs
        run: node --check scripts/pse-garden-eight-live-qa.mjs && node scripts/pse-garden-eight-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-original-garden-eight-products-live-acceptance
          path: artifacts/pse-garden-eight-live/
          retention-days: 30
          if-no-files-found: warn
