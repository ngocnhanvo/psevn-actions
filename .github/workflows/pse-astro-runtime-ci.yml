name: PSE Astro reusable template regression tests (NO BUILD)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-astro-runtime-ci.yml
      - .pse-template-source-neutral-check
      - scripts/pse-local-import-resolution-audit.mjs
permissions:
  contents: read
jobs:
  unit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout PSE Astro DEVELOPMENT source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: github
          path: source
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - name: Checkout PSE Actions local resolver (NO BUILD)
        uses: actions/checkout@v4
        with:
          path: actions-hub
          persist-credentials: false
      - name: Detect unresolved local Astro/TypeScript imports before any build
        run: node actions-hub/scripts/pse-local-import-resolution-audit.mjs
      - name: Set up pnpm without installing app
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node 24 and pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Inventory inherited site URLs by filename only
        shell: bash
        run: |
          set -euo pipefail
          echo 'PSE_STALE_SOURCE_FILENAME_INVENTORY_START'
          grep -RIlF 'nghiencuukhoahoc' source/src source/scripts 2>/dev/null | head -70 || true
          echo 'PSE_STALE_SOURCE_FILENAME_INVENTORY_END'
      - name: Syntax-check portable SSR entry injection (NO BUILD)
        working-directory: source
        run: |
          node --check scripts/patch-entry.mjs
          node --check scripts/inject-handler.js
          node --check scripts/generate-sitemap-robots.mjs
          echo 'PSE_BUILDER_CSP_SYNTAX=PASS'
      - name: Test portable WordPress branding menus SEO and frontend helpers
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline
          pnpm exec vitest run
          echo 'PSE_PORTABLE_UI_TESTS=PASS'
      - name: Parse PSE homepage Astro sections and shared layout (NO BUILD)
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createRequire } from 'node:module';
          import { pathToFileURL } from 'node:url';
          const require = createRequire(import.meta.url);
          const astroRequire = createRequire(require.resolve('astro/package.json'));
          const compiler = await import(pathToFileURL(astroRequire.resolve('@astrojs/compiler')).href);
          const paths = [
            'src/astro/pages/HomePage.astro',
            'src/astro/tablepress/Pse_00.astro',
            'src/astro/tablepress/Pse_01.astro',
            'src/astro/tablepress/Pse_02.astro',
            'src/astro/tablepress/Pse_03.astro',
            'src/astro/tablepress/Pse_awards.astro',
            'src/astro/tablepress/Pse_vision.astro',
            'src/pages/tim-kiem.astro',
            'src/astro/components/Layout/Header.astro',
            'src/astro/components/Menu/Desktop.astro',
            'src/astro/components/Menu/DesktopBranch.astro',
            'src/astro/components/Menu/MobileBranch.astro',
            'src/astro/components/Layout/Footer.astro',
            'src/astro/components/Layout/Layout.astro',
            'src/astro/components/Layout/PseBreadcrumbs.astro',
            'src/astro/pages/PublicPage.astro',
            'src/astro/pages/PostsPage.astro',
            'src/astro/pages/PostDetails.astro',
            'src/astroutils/RelatedPosts.astro',
            'src/astro/tablepress/Pse_01.astro',
            'src/astro/pages/PseComplaintPage.astro',
          ];
          for (const file of paths) {
            await compiler.transform(await readFile(file, 'utf8'), {filename:file});
            console.log('PSE_ASTRO_PARSE_PASS ' + file);
          }
          console.log('PSE_HOMEPAGE_ASTRO_PARSER=PASS; NO_BUILD=PASS');
          NODE
      - name: Verify retired tenant API and avoid route tests as pages (NO BUILD)
        shell: bash
        run: |
          set -euo pipefail
          test ! -e source/src/lib/nckh
          test ! -e source/src/pages/api/nckh
          test ! -e source/src/pages/api/auth
          test ! -e source/src/pages/so-tay
          test ! -e source/src/pages/api/quote
          test ! -e source/src/pages/xem-truoc
          test ! -e source/supportAI
          test -f source/src/pages/api/user/info.ts
          test -f 'source/src/pages/ssr/posts/[slug]/detail.astro'
          test -f 'source/src/pages/ssr/products/[slug]/detail.astro'
          grep -Eq 'export const prerender = false' source/src/pages/api/user/info.ts
          if find source/src/pages -type f \( -name '*.test.ts' -o -name '*.spec.ts' \) | grep .; then
            echo "::error::Vitest file would be compiled as Astro route"
            exit 1
          fi
          echo "PSE_RETIRED_TENANT_ROUTES=PASS"
          echo "PSE_WORDPRESS_SSR_ROUTES=PASS"
      - name: Confirm no Astro build or deploy
        run: echo 'PSE_ASTRO_UNIT=PASS; NO_ASTRO_BUILD=PASS; NO_FTP=PASS'
