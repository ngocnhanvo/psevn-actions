name: PSE Astro API and OAuth isolation tests (NO BUILD)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-astro-runtime-ci.yml
      - .pse-template-source-neutral-check
permissions:
  contents: read
jobs:
  unit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout PSE Astro DEVELOPMENT source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: github
          path: source
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - name: Set up pnpm without installing app
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node 24 and pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Inventory inherited site URLs by filename only
        shell: bash
        run: |
          set -euo pipefail
          echo 'PSE_STALE_SOURCE_FILENAME_INVENTORY_START'
          grep -RIlF 'nghiencuukhoahoc' source/src source/scripts 2>/dev/null | head -70 || true
          echo 'PSE_STALE_SOURCE_FILENAME_INVENTORY_END'
      - name: Syntax-check portable SSR entry injection (NO BUILD)
        working-directory: source
        run: |
          node --check scripts/patch-entry.mjs
          node --check scripts/inject-handler.js
          node --check scripts/generate-sitemap-robots.mjs
          echo 'PSE_BUILDER_CSP_SYNTAX=PASS'
      - name: Test portable WordPress branding menus SEO and frontend helpers
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline
          pnpm exec vitest run \
            src/astro/components/Layout/Header.template-neutral.test.ts \
            src/astro/components/Layout/Header.research-layout.test.ts \
            src/astro/components/Layout/Header.mobile-sticky.test.ts \
            src/lib/googleServices.test.ts \
            src/lib/googleLeadConversions.test.ts \
            src/lib/googleTrackingRuntime.test.ts \
            src/lib/marketingPixels.test.ts \
            src/lib/seo/listingTitles.test.ts \
            src/lib/wordpress/pages/getData.image-errors.test.ts \
            scripts/inject-handler.portability.test.ts \
            scripts/generate-sitemap-robots.test.ts \
            scripts/sync-seo-files.test.ts \
            src/lib/wordpress/builderAutoDiscovery.test.mjs \
            src/lib/wordpress/builderPageImages.test.mjs
          echo 'PSE_PORTABLE_UI_TESTS=PASS'
      - name: Verify retired tenant API and avoid route tests as pages (NO BUILD)
        shell: bash
        run: |
          set -euo pipefail
          test ! -e source/src/lib/nckh
          test ! -e source/src/pages/api/nckh
          test ! -e source/src/pages/api/auth
          test ! -e source/src/pages/so-tay
          if find source/src/pages -type f \( -name '*.test.ts' -o -name '*.spec.ts' \) | grep .; then
            echo "::error::Vitest file would be compiled as Astro route"
            exit 1
          fi
          echo "PSE_RETIRED_TENANT_ROUTES=PASS"
      - name: Confirm no Astro build or deploy
        run: echo 'PSE_ASTRO_UNIT=PASS; NO_ASTRO_BUILD=PASS; NO_FTP=PASS'
