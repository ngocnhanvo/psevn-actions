name: PSE Astro API and OAuth isolation tests (NO BUILD)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-astro-runtime-ci.yml
permissions:
  contents: read
jobs:
  unit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout PSE Astro DEVELOPMENT source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: github
          path: source
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - name: Set up pnpm without installing app
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node 24 and pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Inventory inherited site URLs by filename only
        shell: bash
        run: |
          set -euo pipefail
          echo 'PSE_STALE_SOURCE_FILENAME_INVENTORY_START'
          grep -RIlF 'nghiencuukhoahoc' source/src source/scripts 2>/dev/null | head -70 || true
          echo 'PSE_STALE_SOURCE_FILENAME_INVENTORY_END'
      - name: Verify PSE REST, OAuth, revision-aware and generic SEO regressions
        working-directory: source
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm exec vitest run src/lib/nckh/serverWp.test.ts src/lib/nckh/privateRuntime.test.ts src/lib/nckh/serverSession.test.ts src/lib/nckh/ssrAuthRoutes.test.ts src/lib/nckh/ssrProxyRoutes.test.ts src/lib/nckh/googleOidc.test.ts src/lib/nckh/publicBrand.test.ts src/lib/nckh/authNavigation.test.ts src/lib/nckh/googlePopupCompletion.test.ts src/lib/nckh/articleEditor.test.ts src/lib/wordpress/pages/getData.image-errors.test.ts scripts/generate-sitemap-robots.test.ts scripts/sync-seo-files.nckh.test.ts scripts/sync-seo-files.test.ts
      - name: Reject dangling obsolete staging-only SSR import (NO BUILD)
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n --include='*.ts' --exclude='*.test.ts' -E "allowedStagingRequest|staging_only" source/src/pages/api/nckh source/src/pages/api/auth source/src/lib/nckh/serverSession.ts; then
            echo "::error::Obsolete staging-only SSR guard still present"
            exit 1
          fi
          echo "PSE_SSR_NO_STAGING_GUARD=PASS"
          if find source/src/pages -type f \( -name '*.test.ts' -o -name '*.spec.ts' \) | grep .; then
            echo "::error::Astro src/pages contains Vitest files; they will be compiled as routes"
            exit 1
          fi
          echo "PSE_ASTRO_NO_TEST_FILES_AS_ROUTES=PASS"
      - name: Confirm no Astro build or deploy
        run: echo 'PSE_ASTRO_UNIT=PASS; NO_ASTRO_BUILD=PASS; NO_FTP=PASS'
