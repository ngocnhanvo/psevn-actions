name: PSE bounded FTPS throughput and bundle composition (NO ASTRO BUILD)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-ftps-transfer-profile.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pse-ftps-transfer-profile
  cancel-in-progress: false
jobs:
  diagnostic:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions'
      && (
        github.event_name == 'workflow_dispatch'
        || (
          github.event_name == 'push'
          && github.event.head_commit.message == 'perf(pse): one-shot bounded FTPS blocksize comparison'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      # This write probe is isolated from signed ZIP and only runs on manual or
      # exact one-shot owner-approved marker. Temporary files are verified gone.
      PSE_BENCHMARK_ENABLED: '1'
    steps:
      - name: Read PSE-only diagnostic source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate offline Python syntax and FTPS client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pse-ftps-transfer-profile.py
          python3 -m unittest discover -s tests -p 'test_pse_ftps_transfer_profile.py' -v
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y --no-install-recommends lftp
          fi
      - name: Profile 2 MiB same-host TLS block sizes on removable synthetic files
        shell: bash
        run: python3 scripts/pse-ftps-transfer-profile.py
      - name: Confirm one-shot probe result without touching release
        shell: bash
        run: |
          echo 'PSE_FTPS_PROFILE=PASS; NO_ASTRO_BUILD; NO_PRODUCTION_DEPLOY; PROBE_CLEANUP_VERIFIED'
  cached-assets:
    name: Inspect restored WordPress image cache (NO BUILD)
    if: github.repository == 'ngocnhanvo/psevn-actions' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PSE Astro production source for cache path only
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - name: Restore existing production WordPress/image cache without rebuilding
        uses: actions/cache/restore@v4
        with:
          path: source/.cache
          key: pse-prod-dot-cache-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pse-prod-dot-cache-v2-${{ runner.os }}-
      - name: Report only aggregate cache asset sizes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          from zipfile import ZipFile, ZIP_DEFLATED
          import tempfile
          import time
          root=Path("source/.cache")
          if not root.is_dir():
              raise SystemExit("Existing production cache not restored")
          groups=defaultdict(lambda:[0,0])
          images=[]
          for p in root.rglob("*"):
              if not p.is_file(): continue
              bucket="images" if "images" in p.relative_to(root).parts else "other-data"
              groups[bucket][0]+=1
              groups[bucket][1]+=p.stat().st_size
              if bucket=="images": images.append(p)
          for bucket, (count,size) in sorted(groups.items()):
              print("CACHE_GROUP",bucket,"count",count,"raw_bytes",size)
          # Compare real production-cached bytes.  These already-compressed
          # images are the costly cold/new-media ZIP payload, so -9 must have
          # a measurable size benefit to justify additional CPU.
          # Same ordered files and paths in both runs; never touch hosting.
          if not images:
              raise RuntimeError("No real PSE image cache entries available")
          images.sort(key=lambda p:str(p.relative_to(root)))
          results={}
          for level in (6,9):
              with tempfile.TemporaryFile() as stream:
                  start=time.perf_counter()
                  with ZipFile(stream,"w",compression=ZIP_DEFLATED,compresslevel=level) as archive:
                      for i,p in enumerate(images):
                          archive.write(p,arcname=f"image_{i}{p.suffix}")
                  seconds=time.perf_counter()-start
                  stream.seek(0,2)
                  results[level]=(stream.tell(),seconds)
                  print("PSE_REAL_IMAGE_ZIP level=%d images=%d zip_bytes=%d elapsed_s=%.3f" %
                        (level,len(images),results[level][0],seconds))
          size6,time6=results[6]
          size9,time9=results[9]
          print("PSE_REAL_IMAGE_ZIP_DELTA bytes=%+d fraction=%.5f cpu_seconds=%+.3f" %
                (size9-size6,(size9-size6)/size6,time9-time6))
          print("PSE_ASSET_CACHE_INVENTORY=PASS; NO_ASTRO_BUILD; NO_FTP; NO_DEPLOY")
          PY
