name: PSE reusable template source audit (READ ONLY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/template-audit.py
      - scripts/pse-template-database-readonly.mjs
      - .github/workflows/pse-template-audit.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Actions main
        uses: actions/checkout@v4
        with:
          path: actions
          persist-credentials: false
      - name: Checkout exact Astro github development
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: github
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: astro
          persist-credentials: false
      - name: Checkout exact PHP master
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: php
          persist-credentials: false
      - name: Identify exactly audited source commits
        run: |
          echo "ASTRO_GITHUB_SHA=$(git -C astro rev-parse HEAD)"
          echo "PHP_MASTER_SHA=$(git -C php rev-parse HEAD)"
          echo "ACTIONS_MAIN_SHA=$(git -C actions rev-parse HEAD)"
      - name: Audit only, never rewrite sources
        run: |
          python3 -m py_compile actions/scripts/template-audit.py
          python3 actions/scripts/template-audit.py --astro astro --php php --actions actions
          echo 'SOURCE_AUDIT=PASS; NO_BUILD=PASS; NO_FTP=PASS; NO_DISPATCH=PASS'
          echo 'SOURCE_REUSE_RESCAN=2026-10-22 current source review; preserve production, no DB writes'

  database-inventory:
    name: Inventory existing PSE WP records via admin (READ ONLY)
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - name: Checkout only PSE Actions script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install matching Playwright wrapper
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Read public-safe counts of PSE WordPress content and users
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          node --check scripts/pse-template-database-readonly.mjs
          node scripts/pse-template-database-readonly.mjs
          echo 'PSE_DB_INVENTORY_JOB=PASS_READ_ONLY; NO_DB_EXPORT=PASS; NO_DB_MUTATIONS=PASS'
