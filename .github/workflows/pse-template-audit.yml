name: PSE reusable template source audit (READ ONLY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/template-audit.py
      - scripts/pse-template-database-readonly.mjs
      - scripts/pse-template-content-audit.mjs
      - scripts/pse-template-sanitize-wp-content.mjs
      - .pse-template-content-cleanup-request
      - .pse-template-db-backup-request
      - .pse-template-cleanup-users-request
      - .pse-template-db-sql-audit-request
      - .pse-template-maintenance-request
      - .github/workflows/pse-template-audit.yml
permissions:
  contents: read
jobs:
  audit:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.event.head_commit.message != 'test(template): backup PSE WP database (local only)' &&
      github.event.head_commit.message != 'chore(template): remove five NCKH test accounts after Updraft backup' &&
      github.event.head_commit.message != 'chore(template): prepare bounded NCKH user cleanup (NO EXECUTION)' &&
      github.event.head_commit.message != 'test(template): inspect current PSE SQL backup residues (READ ONLY)' &&
      github.event.head_commit.message != 'test(template): prepare SQL backup audit (NO EXECUTION)' &&
      github.event.head_commit.message != 'test(template): preflight PSE content sanitation (NO WRITES)' &&
      github.event.head_commit.message != 'chore(template): sanitize inherited PSE page text and company name (ONE TIME)' &&
      github.event.head_commit.message != 'chore(template): clear disposable PSE cache and historical chats (ONE TIME)'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Actions main
        uses: actions/checkout@v4
        with:
          path: actions
          persist-credentials: false
      - name: Checkout exact Astro github development
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: github
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: astro
          persist-credentials: false
      - name: Checkout exact Astro master production
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: astro-master
          persist-credentials: false
      - name: Checkout exact PHP master
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: php
          persist-credentials: false
      - name: Identify exactly audited source commits
        run: |
          echo "ASTRO_GITHUB_SHA=$(git -C astro rev-parse HEAD)"
          echo "ASTRO_MASTER_SHA=$(git -C astro-master rev-parse HEAD)"
          echo "PHP_MASTER_SHA=$(git -C php rev-parse HEAD)"
          echo "ACTIONS_MAIN_SHA=$(git -C actions rev-parse HEAD)"
      - name: Audit only, never rewrite sources
        run: |
          python3 -m py_compile actions/scripts/template-audit.py
          python3 actions/scripts/template-audit.py --astro astro --php php --actions actions
          echo 'TEMPLATE_AUDIT_FRONTEND_DEV=completed'
          python3 actions/scripts/template-audit.py --astro astro-master --php php --actions actions
          echo 'TEMPLATE_AUDIT_FRONTEND_PRODUCTION=completed'
          ! grep -Eiq 'Blue Sea|AUDITED_CATEGORY_TITLES' astro-master/src/lib/seo/listingTitles.ts
          echo 'TEMPLATE_PRODUCTION_SEO_BRAND_NEUTRAL=PASS'
          echo 'SOURCE_AUDIT=PASS; NO_BUILD=PASS; NO_FTP=PASS; NO_DISPATCH=PASS'
          echo 'SOURCE_REUSE_RESCAN=2026-10-22 current source review; preserve production, no DB writes'

  database-inventory:
    name: Inventory existing PSE WP records via admin (READ ONLY)
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.event.head_commit.message != 'test(template): backup PSE WP database (local only)' &&
      github.event.head_commit.message != 'chore(template): remove five NCKH test accounts after Updraft backup' &&
      github.event.head_commit.message != 'chore(template): prepare bounded NCKH user cleanup (NO EXECUTION)' &&
      github.event.head_commit.message != 'test(template): inspect current PSE SQL backup residues (READ ONLY)' &&
      github.event.head_commit.message != 'test(template): prepare SQL backup audit (NO EXECUTION)' &&
      github.event.head_commit.message != 'test(template): preflight PSE content sanitation (NO WRITES)' &&
      github.event.head_commit.message != 'chore(template): sanitize inherited PSE page text and company name (ONE TIME)' &&
      github.event.head_commit.message != 'chore(template): clear disposable PSE cache and historical chats (ONE TIME)' &&
      github.event.head_commit.message != 'test(template): audit DEV and PROD sources (READ ONLY)'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - name: Checkout only PSE Actions script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install matching Playwright wrapper
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Read public-safe counts of PSE WordPress content and users
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          node --check scripts/pse-template-database-readonly.mjs
          node scripts/pse-template-database-readonly.mjs
          node --check scripts/pse-template-content-audit.mjs
          node scripts/pse-template-content-audit.mjs
          echo 'PSE_DB_INVENTORY_JOB=PASS_READ_ONLY; NO_DB_EXPORT=PASS; NO_DB_MUTATIONS=PASS'

  updraft-db-backup:
    name: Save a local protected PSE database backup using existing UpdraftPlus
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' && github.event_name == 'push' &&
      github.event.head_commit.message == 'test(template): backup PSE WP database (local only)'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - name: Checkout PSE Actions script, no additional PHP code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install matching Playwright wrapper
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Backup database through authenticated existing UpdraftPlus UI
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          node --check scripts/pse-template-updraft-backup.mjs
          node scripts/pse-template-updraft-backup.mjs
          echo 'PSE_DATABASE_LOCAL_BACKUP=VERIFIED_IN_UPDRAFTPLUS'

  nckh-user-cleanup:
    name: Remove only five backed-up NCKH test accounts (preserve admin)
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' && github.event_name == 'push' &&
      github.event.head_commit.message == 'chore(template): remove five NCKH test accounts after Updraft backup'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - name: Checkout PSE-only cleanup script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install matching Playwright wrapper
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Validate recent DB backup and clean only five NCKH users via WordPress admin
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          node --check scripts/pse-template-cleanup-users.mjs
          node scripts/pse-template-cleanup-users.mjs
          echo 'PSE_NCKH_USER_CLEANUP=PASS; ADMIN_PRESERVED=PASS; NO_PHP_DEPLOY=PASS; NO_ASTRO_BUILD=PASS'

  database-sql-inspection:
    name: Scan current protected PSE Updraft SQL backup on ephemeral runner (READ ONLY)
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' && github.event_name == 'push' &&
      github.event.head_commit.message == 'test(template): inspect current PSE SQL backup residues (READ ONLY)'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PSE read-only SQL backup audit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect protected database archive through verified FTPS, no SQL execution
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pse-template-db-sql-readonly.py
          python3 scripts/pse-template-db-sql-readonly.py
          echo 'PSE_SQL_ARCHIVE_INSPECTION=PASS_READ_ONLY; NO_SQL_EXECUTION=PASS; NO_BACKUP_ARTIFACT=PASS'

  template-cache-chat-cleanup:
    name: One-time protected PSE cache/chat cleanup through WP admin (NO ASTRO BUILD)
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' && github.event_name == 'push' &&
      github.event.head_commit.message == 'chore(template): clear disposable PSE cache and historical chats (ONE TIME)'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - name: Checkout only PSE Actions cleanup tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate one-time PHP and FTPS transport source
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v php >/dev/null 2>&1; then
            apt-get update -qq >/dev/null
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends php-cli >/dev/null
          fi
          php -l scripts/pse-template-temporary-maintenance.php
          python3 -m py_compile scripts/pse-template-temporary-ftps.py
          node --check scripts/pse-template-temporary-admin-clean.mjs
          echo 'PSE_TEMP_MAINTENANCE_SOURCE_VALIDATION=PASS'
      - name: Install Playwright wrapper matching preinstalled Chromium
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Install temporary admin-only WordPress maintenance plugin through FTPS
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/pse-template-temporary-ftps.py install
      - name: Confirm recoverability and execute only native WP admin nonce-protected cleanup
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/pse-template-temporary-admin-clean.mjs
      - name: ALWAYS remove temporary PHP maintenance plugin from hosting
        if: always()
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/pse-template-temporary-ftps.py remove
      - name: Record post-cleanup database backup using existing UpdraftPlus
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/pse-template-updraft-backup.mjs
      - name: Recheck protected SQL backup after cleanup, no exports or SQL execution
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          python3 scripts/pse-template-db-sql-readonly.py
          echo 'PSE_TEMPLATE_CACHE_CHAT_CLEANUP_AUDIT=PASS; NO_ASTRO_BUILD=PASS'

  content-sanitization-preflight:
    name: Check exact PSE WP content targets without modifying DB
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' && github.event_name == 'push' &&
      github.event.head_commit.message == 'test(template): preflight PSE content sanitation (NO WRITES)'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax-check and install Playwright
        run: |
          node --check scripts/pse-template-sanitize-wp-content.mjs
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Validate all WP content and ACF targets only, with protected backups present
        env:
          PSE_TEMPLATE_DRY_RUN: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          node scripts/pse-template-sanitize-wp-content.mjs
          echo 'PSE_CONTENT_PREFLIGHT=PASS; NO_DB_WRITE=PASS; NO_ASTRO_BUILD=PASS'

  content-sanitization:
    name: Sanitize bounded inherited PSE page text and company label
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' && github.event_name == 'push' &&
      github.event.head_commit.message == 'chore(template): sanitize inherited PSE page text and company name (ONE TIME)'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser wrapper and validate source
        run: |
          node --check scripts/pse-template-sanitize-wp-content.mjs
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Apply only verified WordPress editor content changes
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          node scripts/pse-template-sanitize-wp-content.mjs
          echo 'PSE_WP_CONTENT_CLEANUP=PASS; NO_ASTRO_BUILD=PASS'
      - name: Protect edited database using existing UpdraftPlus
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/pse-template-updraft-backup.mjs
      - name: Audit cleaned WordPress editor contents without exposing text
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          node scripts/pse-template-content-audit.mjs
          echo 'PSE_POST_SANITIZE_CONTENT_RECHECK=PASS_READ_ONLY'
