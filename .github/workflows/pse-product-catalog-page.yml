name: PSE native WordPress fertilizer catalog Page (NO BUILD)
on:
  push:
    branches: [main]
    paths: [.pse-product-catalog-trigger]
permissions:
  contents: read
concurrency:
  group: pse-product-catalog-native-page
  cancel-in-progress: false
jobs:
  cms:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-product-catalog-page.mjs && node --check scripts/pse-product-ssr-cutover.mjs && node --check scripts/pse-product-ssr-public-routes.mjs && node --check scripts/pse-product-catalog-router.mjs && node scripts/pse-product-catalog-router.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-product-ssr-cutover-backup
          path: |
            artifacts/pse-product-ssr-cutover/rollback.json
            artifacts/pse-product-ssr-cutover/public-rules-rollback.json
          if-no-files-found: ignore
          retention-days: 14
