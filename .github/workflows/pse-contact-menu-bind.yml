name: PSE existing WordPress Contact menu binding (NO BUILD)
on:
  push:
    branches: [main]
    paths: [.pse-contact-menu-trigger]
permissions:
  contents: read
concurrency:
  group: pse-contact-menu-binding
  cancel-in-progress: false
jobs:
  connect:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-contact-menu-bind.mjs && node scripts/pse-contact-menu-bind.mjs
