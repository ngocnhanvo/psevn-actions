name: PSE Joomla 1640 exact archived publisher originals and source date (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-1640-archived-original-source-preflight.mjs
      - .github/workflows/pse-1640-archived-original-source-preflight.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify exact Joomla #1640 source body and original archive JPEGs
        run: node --check scripts/pse-1640-archived-original-source-preflight.mjs && node scripts/pse-1640-archived-original-source-preflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-original-1640-source-media-date-evidence
          path: artifacts/pse-original-1640-archive/preflight.json
          retention-days: 30
          if-no-files-found: warn
