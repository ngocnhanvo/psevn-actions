name: PSE eleven unrecovered Joomla source-original external photos archive check (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-remaining-remote-original-archive-readonly.mjs
      - .github/workflows/pse-remaining-remote-original-archive-readonly.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Exact historical original URL archive proof for 11 Joomla Articles
        run: node --check scripts/pse-remaining-remote-original-archive-readonly.mjs && node scripts/pse-remaining-remote-original-archive-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-eleven-remaining-original-external-media-archive
          path: artifacts/pse-remaining-eleven-archive/report.json
          retention-days: 30
          if-no-files-found: warn
