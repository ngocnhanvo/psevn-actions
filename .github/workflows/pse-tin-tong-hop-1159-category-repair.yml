name: PSE Tin tong hop repair exact historical WP post 79852 (NO ASTRO BUILD)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-tin-tong-hop-1159-category-repair.yml
permissions:
  contents: read
concurrency:
  group: pse-legacy-article-migration-single-writer
  cancel-in-progress: false
jobs:
  taxonomy:
    if: github.repository == 'ngocnhanvo/psevn-actions' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Sửa chuyên mục bài Hồ tiêu đã đối chiếu'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Preflight source ID, exact WP fields and taxonomy, no mutation
        run: node --check scripts/pse-tin-tong-hop-1159-category-repair.mjs && node scripts/pse-tin-tong-hop-1159-category-repair.mjs
      - name: Create fresh verified DB-only UpdraftPlus backup
        run: node scripts/pse-template-updraft-backup.mjs
      - name: Append only missing category to existing WP post 79852
        run: node scripts/pse-tin-tong-hop-1159-category-repair.mjs --apply
