name: PSE Joomla 1434 original NPK overview vs native category (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-1434-npk-category-source-proof.mjs
      - .github/workflows/pse-1434-npk-category-source-proof.yml
permissions:
  contents: read
jobs:
  npk-source:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Compare Joomla source and native WordPress taxonomy
        run: |
          node --check scripts/pse-1434-npk-category-source-proof.mjs
          node scripts/pse-1434-npk-category-source-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-1434-npk-overview-source-proof
          path: artifacts/pse-1434-npk-category/report.json
          retention-days: 30
          if-no-files-found: warn
