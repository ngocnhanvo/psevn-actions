name: PSE legacy Joomla articles serialized migration queue (NO ASTRO BUILD)
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pse-legacy-article-import-queue.yml"
      - "scripts/pse-legacy-migration-crawl.py"
      - "scripts/pse-legacy-migration-batch.mjs"
      - "scripts/pse-legacy-search-date.mjs"
      - "scripts/pse-legacy-repair-seo.mjs"
      - "scripts/pse-legacy-attribution-clean.mjs"
      - "scripts/pse-legacy-migration-save.mjs"
      - "scripts/pse-legacy-migration-next.mjs"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: pse-legacy-article-migration-single-writer
  cancel-in-progress: false
jobs:
  migration-batch:
    if: github.repository == 'ngocnhanvo/psevn-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 28
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check bounded queue status; do not repeat completed work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          data=json.load(open('docs/pse-legacy-migration-state.json',encoding='utf-8'))
          if data['schema']!='pse-legacy-article-migration-v1' or data['tracker_issue']!=3:
              raise SystemExit('Wrong PSE migration checkpoint')
          annual_ids=set('998 999 1000 1041 1042 1043 1092 1188 1259 1307 1353 1386 1412 1511 1546 1578 1625 1667'.split())
          annual_pending=any(
              id in annual_ids and r.get('group_hint')=='shareholder' and
              '/quan-he-nha-dau-tu/bao-cao-thuong-nien/'+id+'-' in r.get('source_url','') and (
                  (r.get('wp_id') and r.get('status') in ('existing','imported','draft_needs_date') and not r.get('annual_category_verified')) or
                  (id in ('1042','1043','1188','1259') and r.get('status')=='quarantined' and r.get('reason')=='Original media size unsafe; bytes=49; ext=gif' and not r.get('annual_gif_recovery_attempted') and not r.get('wp_id')) or
                  (id=='1667' and r.get('status') in ('quarantined','pending') and r.get('reason')=='Original media size unsafe; bytes=33341195; ext=pdf' and not r.get('annual_pdf_regex_retry_attempted') and not r.get('wp_id')) or
                  (id in ('1042','1043','1188','1259') and r.get('status')=='quarantined' and r.get('reason')=='Annual source GIF not proven corrupt; preserve image' and not r.get('annual_valid_gif_recovery_attempted') and not r.get('wp_id'))
              ) for id,r in data['articles'].items()
          )
          governance_large_pdfs=any(
              id in ('1649','1664') and r.get('status')=='quarantined' and
              r.get('reason')=='Original media size unsafe; bytes='+('28360845' if id=='1649' else '39702837')+'; ext=pdf' and
              not r.get('governance_large_pdf_attempted') and not r.get('wp_id') and
              '/quan-he-nha-dau-tu/tai-lieu-quan-tri-cong-ty/'+id+'-' in r.get('source_url','')
              for id,r in data['articles'].items()
          )
          two_digit_governance_sources={
              '90':'https://www.pse.vn/quan-he-nha-dau-tu/tai-lieu-quan-tri-cong-ty/90-quy-che-quan-tri-cong-ty-14-01-2016.html',
              '91':'https://www.pse.vn/quan-he-nha-dau-tu/tai-lieu-quan-tri-cong-ty/91-quy-trinh-cong-bo-thong-tin.html',
              '92':'https://www.pse.vn/quan-he-nha-dau-tu/tai-lieu-quan-tri-cong-ty/92-dieu-le-cong-ty-co-phan-phan-bon-va-hoa-chat-dau-khi-dong-nam-bo.html'
          }
          two_digit_pending=any(id not in data['articles'] and url in data['seen'] for id,url in two_digit_governance_sources.items())
          incomplete=bool(data.get('queue')) or any((r['status'] in ('pending','media') and r.get('attempts',0)<3) or (r['status']=='quarantined' and r.get('reason')=='Source content incomplete or oversized' and not r.get('short_content_rechecked')) or (r.get('wp_id') and r.get('status') in ('imported','draft_needs_date','existing') and not r.get('seo_cleaned') and (r.get('seo_attempts',0)<3 or r.get('seo_error')=='Post has no exact migration provenance marker') or (r['status'] in ('imported','draft_needs_date','existing') and not r.get('attribution_cleaned') and r.get('attribution_attempts',0)<3) or (id in ('343','346','347','352','360') and r['status']=='quarantined' and r.get('reason')=='Article contains non-local mandatory media' and not r.get('wp_id') and not r.get('broken_image_recovery_attempted'))) for id,r in data['articles'].items()) or annual_pending or governance_large_pdfs or two_digit_pending
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PSE_IMPORT_WORK='+('yes' if incomplete else 'no')+'\n')
          print('PSE_IMPORT_QUEUE='+('ACTIVE' if incomplete else 'NO_PENDING')+'; discovered='+str(len(data['articles'])))
          PY
      - name: Browser tools (container Chromium is pinned)
        if: env.PSE_IMPORT_WORK == 'yes'
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Confirm local Updraft DB backup before first migration write
        if: env.PSE_IMPORT_WORK == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          s=json.load(open('docs/pse-legacy-migration-state.json',encoding='utf-8'))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PSE_IMPORT_NEEDS_BACKUP='+('no' if s.get('backup_verified') else 'yes')+'\n')
          PY
      - name: Create fresh verified WordPress DB-only backup (once)
        if: env.PSE_IMPORT_WORK == 'yes' && env.PSE_IMPORT_NEEDS_BACKUP == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pse-template-updraft-backup.mjs
          python3 - <<'PY'
          import json
          p='docs/pse-legacy-migration-state.json'
          with open(p,encoding='utf-8') as f:s=json.load(f)
          s['backup_verified']=True
          with open(p,'w',encoding='utf-8') as f:json.dump(s,f,ensure_ascii=False,indent=2);f.write('\n')
          print('PSE_LEGACY_MIGRATION_BACKUP=PASS; verified_backup=true')
          PY
      - name: Crawl at most 12 Joomla pages and checkpoint discovered article IDs
        if: env.PSE_IMPORT_WORK == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pse-legacy-migration-crawl.py
          python3 scripts/pse-legacy-migration-crawl.py
      - name: Import up to 4 verified WordPress articles and four files per source
        if: env.PSE_IMPORT_WORK == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pse-legacy-migration-batch.mjs
          node scripts/pse-legacy-migration-batch.mjs
      - name: Clean migrated Joomla related links and backfill verified Yoast SEO metadata
        if: env.PSE_IMPORT_WORK == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pse-legacy-repair-seo.mjs
          node scripts/pse-legacy-repair-seo.mjs
      - name: Remove generated attribution footers and trailing editor blanks
        if: env.PSE_IMPORT_WORK == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pse-legacy-attribution-clean.mjs
          node scripts/pse-legacy-attribution-clean.mjs
      - name: Persist exact migration cursor without overriding another writer
        if: always() && env.PSE_IMPORT_WORK == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pse-legacy-migration-save.mjs
          node scripts/pse-legacy-migration-save.mjs
      - name: Hand off next bounded batch without relying solely on cron
        if: success() && env.PSE_IMPORT_WORK == 'yes' && env.PSE_IMPORT_AUTO_NEXT == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pse-legacy-migration-next.mjs
          node scripts/pse-legacy-migration-next.mjs
      - name: Upload non-secret batch report
        if: always() && env.PSE_IMPORT_WORK == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: pse-legacy-migration-progress
          path: docs/pse-legacy-migration-state.json
          if-no-files-found: ignore
          retention-days: 3
