name: PSE complaint existing Header menu cutover (NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - .pse-complaint-menu-cutover-request
permissions:
  contents: read
concurrency:
  group: pse-complaint-menu-cutover
  cancel-in-progress: false
jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-complaint-menu-cutover.mjs && node scripts/pse-complaint-menu-cutover.mjs
