name: PSE finalize declared branches (NO DEPLOY)
on:
  push:
    branches: [main]
    paths:
      - .pse-branch-finalize-trigger
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pse-branch-finalization
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.SOURCE_REPO_PAT }}
      GH_PROMPT_DISABLED: 1
    steps:
      - name: Check exact repository refs before changes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SOURCE_REPO_PAT missing"
            exit 1
          fi
          sha_of() {
            gh api "repos/$1/branches?per_page=100" --jq ".[] | select(.name == \"$2\") | .commit.sha"
          }
          check_ref() {
            local repo="$1" branch="$2" expected="$3" actual
            actual="$(sha_of "$repo" "$branch")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::SHA mismatch on $repo $branch: $actual (expected $expected); abort"
              exit 1
            fi
            echo "Verified $repo $branch at $actual"
          }
          check_ref ngocnhanvo/psevn-astro github 13cb5a21f5ccecde149ffc9e3d53afdaa9f67795
          check_ref ngocnhanvo/psevn-astro master 13cb5a21f5ccecde149ffc9e3d53afdaa9f67795
          check_ref ngocnhanvo/psevn-php master 93fbcc5f01b43bd80bb55bf541065b1b554bfaaf
          # Confirm placeholders before removal, not any new edits.
          current="$(sha_of ngocnhanvo/psevn-astro main)"
          if [ -n "$current" ] && [ "$current" != "d20d0604b01c288c0fd6229d4007a10c7bd08e97" ]; then
            echo "::error::Astro main no longer a placeholder; abort"
            exit 1
          fi
          current="$(sha_of ngocnhanvo/psevn-php main)"
          if [ -n "$current" ] && [ "$current" != "e97ffce51f14e02effca0459198e286ee1a030d9" ]; then
            echo "::error::PHP main no longer a placeholder; abort"
            exit 1
          fi
          current="$(sha_of ngocnhanvo/psevn-php import/eduresearch-baseline)"
          if [ -n "$current" ] && [ "$current" != "93fbcc5f01b43bd80bb55bf541065b1b554bfaaf" ]; then
            echo "::error::PHP temporary import branch changed; abort"
            exit 1
          fi
          echo "All expected SHA guards passed."
      - name: Switch repository default branches
        shell: bash
        run: |
          set -euo pipefail
          set_default() {
            local repo="$1" wanted="$2" current
            current="$(gh api "repos/$repo" --jq '.default_branch')"
            if [ "$current" = "$wanted" ]; then
              echo "$repo default already $wanted"
            elif [ "$current" = "main" ]; then
              if ! gh api --method PATCH "repos/$repo" -f "default_branch=$wanted" --jq '.default_branch'; then
                echo "::warning::Cannot switch default on $repo (requires Administration: write); retaining main safely."
                return 0
              fi
              actual="$(gh api "repos/$repo" --jq '.default_branch')"
              if [ "$actual" != "$wanted" ]; then
                echo "::warning::Default remains $actual on $repo; retaining main safely."
                return 0
              fi
              echo "$repo default changed from main to $wanted"
            else
              echo "::error::Unexpected default on $repo: $current; abort"
              exit 1
            fi
          }
          set_default ngocnhanvo/psevn-astro github
          set_default ngocnhanvo/psevn-php master
      - name: Delete only obsolete bootstrap/import branches
        shell: bash
        run: |
          set -euo pipefail
          delete_if_exact() {
            local repo="$1" branch="$2" expected="$3" current_sha default
            default="$(gh api "repos/$repo" --jq '.default_branch')"
            if [ "$default" = "$branch" ]; then
              echo "::error::Refusing to delete default branch $repo/$branch"
              exit 1
            fi
            current_sha="$(gh api "repos/$repo/branches?per_page=100" --jq ".[] | select(.name == \"$branch\") | .commit.sha")"
            if [ -z "$current_sha" ]; then
              echo "Already absent: $repo/$branch"
              return 0
            fi
            if [ "$current_sha" != "$expected" ]; then
              echo "::error::Refusing to delete changed $repo/$branch at $current_sha"
              exit 1
            fi
            gh api --method DELETE "repos/$repo/git/refs/heads/$branch"
            echo "Removed obsolete $repo/$branch ($expected)"
          }
          if [ "$(gh api repos/ngocnhanvo/psevn-astro --jq '.default_branch')" = "github" ]; then
            delete_if_exact ngocnhanvo/psevn-astro main d20d0604b01c288c0fd6229d4007a10c7bd08e97
          else
            echo "::warning::Retaining Astro main because it is the default branch"
          fi
          if [ "$(gh api repos/ngocnhanvo/psevn-php --jq '.default_branch')" = "master" ]; then
            delete_if_exact ngocnhanvo/psevn-php main e97ffce51f14e02effca0459198e286ee1a030d9
          else
            echo "::warning::Retaining PHP main because it is the default branch"
          fi
          delete_if_exact ngocnhanvo/psevn-php import/eduresearch-baseline 93fbcc5f01b43bd80bb55bf541065b1b554bfaaf
      - name: Report final branch layout
        run: |
          set -euo pipefail
          for repo in psevn-astro psevn-php psevn-actions; do
            echo "## ngocnhanvo/$repo" >> "$GITHUB_STEP_SUMMARY"
            gh api "repos/ngocnhanvo/$repo" --jq '"Default: " + .default_branch' >> "$GITHUB_STEP_SUMMARY"
            gh api "repos/ngocnhanvo/$repo/branches?per_page=100" --jq '.[] | "- " + .name + " (" + .commit.sha + ")"' >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Only branch metadata was changed: no build/deploy/FTP/WordPress mutations."
