name: PSE finance original PDF filename collision diagnosis (READ ONLY)
on:
  push:
    branches: [main]
    paths: [scripts/pse-finance-media-collision.mjs]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-finance-media-collision.mjs && node scripts/pse-finance-media-collision.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-finance-media-collision
          path: artifacts/pse-finance-media-collision/report.json
          if-no-files-found: warn
          retention-days: 14
