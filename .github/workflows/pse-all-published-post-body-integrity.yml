name: PSE published native WordPress Posts body and asset integrity (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-all-published-post-body-integrity.mjs
      - .github/workflows/pse-all-published-post-body-integrity.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/pse-all-published-post-body-integrity.mjs
      - run: node scripts/pse-all-published-post-body-integrity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-published-native-content-integrity
          path: artifacts/pse-native-body-integrity/report.json
          retention-days: 30
          if-no-files-found: warn
