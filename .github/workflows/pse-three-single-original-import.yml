name: PSE exact three archived original agriculture posts and JPEGs (GUARDED)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-three-single-photo-original-archive-import.mjs
      - .github/workflows/pse-three-single-original-import.yml
      - .pse-three-single-original-import-request
permissions:
  contents: read
  actions: read
jobs:
  syntax:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.event.head_commit.message != 'cms(pse): restore three original one-photo agriculture articles'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/pse-three-single-photo-original-archive-import.mjs
  apply:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'cms(pse): restore three original one-photo agriculture articles'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: pse-legacy-article-migration-single-writer
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Fresh Updraft native WP DB backup and verified rollback
        run: node --check scripts/pse-template-updraft-backup.mjs && node scripts/pse-template-updraft-backup.mjs
      - name: Trust scoped writer only after fresh backup verification
        run: echo "PSE_THREE_SINGLE_FRESH_BACKUP=yes" >> "$GITHUB_ENV"
      - name: Restore exact original three Article/Post and source URL JPEGs into WP
        run: node --check scripts/pse-three-single-photo-original-archive-import.mjs && node scripts/pse-three-single-photo-original-archive-import.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-three-source-original-jpegs-and-posts
          path: artifacts/pse-three-single-original/report.json
          retention-days: 30
          if-no-files-found: warn
