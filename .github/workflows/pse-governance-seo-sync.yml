name: PSE synchronize verified governance Yoast titles (NO ASTRO BUILD)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-governance-seo-sync.mjs
      - .github/workflows/pse-governance-seo-sync.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pse-governance-seo-single-writer
  cancel-in-progress: false
jobs:
  seo:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 16
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: pse-governance-2026-independent-parity
          run-id: 44744504960
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/pse-governance-source-proof
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Backup WordPress database before touching verified SEO titles only
        run: node scripts/pse-template-updraft-backup.mjs
      - name: Fill 23 original Joomla SEO titles without overwriting any other fields
        run: node --check scripts/pse-governance-seo-sync.mjs && node scripts/pse-governance-seo-sync.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-governance-source-seo-readback
          path: artifacts/pse-governance-seo/report.json
          if-no-files-found: warn
          retention-days: 30
