name: PSE Tin tong hop Joomla to WP category parity (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.github/workflows/pse-tin-tong-hop-parity.yml, .pse-tin-tong-hop-parity-trigger]
permissions:
  contents: read
jobs:
  category-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-tin-tong-hop-parity.mjs && node scripts/pse-tin-tong-hop-parity.mjs
