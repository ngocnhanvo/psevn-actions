name: PSE original distribution channel source articles (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.pse-distribution-source-trigger]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-distribution-source-audit.mjs && node scripts/pse-distribution-source-audit.mjs
