name: PSE finance WordPress upload collisions (READ ONLY FTPS)
on:
  push:
    branches: [main]
    paths: [scripts/pse-finance-ftps-collision-audit.py]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m py_compile scripts/pse-finance-ftps-collision-audit.py && python3 scripts/pse-finance-ftps-collision-audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-finance-ftps-collision-report
          path: pse-finance-ftp-collision-report.json
          if-no-files-found: warn
          retention-days: 14
