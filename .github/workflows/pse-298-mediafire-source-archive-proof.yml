name: PSE original 2012 financial PDF MediaFire Joomla link proof (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-298-mediafire-source-archive-proof.mjs
      - .github/workflows/pse-298-mediafire-source-archive-proof.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 11
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-298-mediafire-source-archive-proof.mjs
      - run: node scripts/pse-298-mediafire-source-archive-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-298-original-2012-finance-external-pdf
          path: artifacts/pse-298-original-mediafire/report.json
          retention-days: 30
          if-no-files-found: warn
