name: PSE 2014 2016 actual public annual PDF anchor QA (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-annual-public-pdf-anchor-qa.mjs
      - .github/workflows/pse-annual-public-pdf-anchor-qa.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/pse-annual-public-pdf-anchor-qa.mjs
      - run: node scripts/pse-annual-public-pdf-anchor-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-annual-public-pdf-anchor-diagnostic
          path: artifacts/pse-annual-public-links/report.json
          retention-days: 14
          if-no-files-found: warn
