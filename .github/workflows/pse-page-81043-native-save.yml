name: PSE 81043 native WordPress editor save (NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - .pse-page-81043-native-save-trigger
permissions:
  contents: read
concurrency:
  group: pse-page-81043-native-save
  cancel-in-progress: false
jobs:
  save:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-page-81043-native-save.mjs && node scripts/pse-page-81043-native-save.mjs
