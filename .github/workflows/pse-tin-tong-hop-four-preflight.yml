name: PSE 4 latest Joomla Tin tong hop source originals preflight (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .pse-tin-tong-hop-four-preflight-request
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'ngocnhanvo/psevn-actions' &&
      github.event.head_commit.message == 'audit(pse): verify four original Joomla Tin tong hop posts and media'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/pse-tin-tong-hop-four-preflight.mjs && node scripts/pse-tin-tong-hop-four-preflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-4-new-tin-tong-hop-source-preflight
          path: artifacts/pse-tth-four/preflight.json
          retention-days: 14
          if-no-files-found: warn
