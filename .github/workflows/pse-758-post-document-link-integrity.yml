name: PSE 758 native published Posts document link integrity (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - scripts/pse-758-post-document-link-integrity.mjs
      - .github/workflows/pse-758-post-document-link-integrity.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/pse-758-post-document-link-integrity.mjs
      - run: node scripts/pse-758-post-document-link-integrity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-758-original-post-doc-link-integrity
          path: artifacts/pse-758-post-document-links/report.json
          retention-days: 21
          if-no-files-found: warn
