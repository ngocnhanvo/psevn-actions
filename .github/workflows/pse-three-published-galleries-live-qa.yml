name: PSE three published source albums 354 photos partial live QA (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pse-three-published-galleries-live-qa.yml
      - .pse-three-published-galleries-live-qa-request
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'ngocnhanvo/psevn-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify exactly three published original albums on both viewport widths
        run: node --check scripts/pse-four-gallery-live-qa.mjs && node scripts/pse-four-gallery-live-qa.mjs --published-three-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pse-three-published-original-albums-partial-acceptance
          path: artifacts/pse-four-original-gallery-live/report.json
          if-no-files-found: warn
          retention-days: 30
